 const it=pickItem();if(it&&it.type.startsWith('wand_')){it.boost=3;const cats=pets.filter(q=>!q.off&&!isDog(q)&&q.state!=='sleep');if(!cats.length)return say('🧶 房間裡沒有醒著的貓咪');cats.forEach(q=>goSpot(q,'wand',true,it));say('🧶 甩甩'+NAME[it.type]+'！貓咪衝過來了')}});
window.__dbg={cam,ctl,pets,items,blockers};window.__sp=startPlay;const clk=new THREE.Clock();
R.setAnimationLoop(()=>{const dt=Math.min(.05,clk.getDelta());pets.forEach(p=>{if(!p.off)update(p,dt)});toyFrame(dt);handFrame(dt);swingWands(dt);goodsUpdate(dt);ctl.update();cutWalls();if(MODE===0){comp.render(dt);perfCheck(dt)}else R.render(scene,cam)});
let pf={n:0,t:0,lv:0};function perfCheck(dt){if(pf.lv>=2)return;pf.n++;pf.t+=dt;if(pf.n<90)return;const avg=pf.t/pf.n;pf.n=0;pf.t=0;if(avg>1/26){pf.lv++;if(pf.lv===1){gtao.updateGtaoMaterial({samples:6});gtao.updatePdMaterial({samples:6});comp.setPixelRatio(1);comp.setSize(innerWidth,innerHeight)}else{gtao.enabled=false}}}


/* ---------- 貓屋・貓砂盆・貓玩具・狗玩具 ---------- */
const isCH=t=>t.startsWith('cathouse_'),isLit=t=>t.startsWith('litter_'),isCT=t=>t.startsWith('ctoy_'),isDT=t=>t.startsWith('dtoy_');
const MOVTOY=t=>/^(ctoy_(mouse|yarn)|dtoy_)/.test(t);
const ROLLTOY=t=>/ctoy_yarn|dtoy_tire/.test(t);
const CHEWTOY=t=>/dtoy_(bone|rope|duck)/.test(t);
let pottyWarn=0;
function toyTarget(p,it){const t=it.type,P=p.holder.position,c=it.g.position;
 if(t==='ctoy_tunnel'){const a=locOf(it,-0.62,0,0),b=locOf(it,0.62,0,0);return a.distanceTo(P)<b.distanceTo(P)?[a,b]:[b,a]}
 if(t==='ctoy_scratch'){const a=locOf(it,0,0,0.16+p.d.len*0.42),b=locOf(it,0,0,-(0.16+p.d.len*0.42));return [a.distanceTo(P)<b.distanceTo(P)?a:b]}
 const d=new THREE.Vector3(P.x-c.x,0,P.z-c.z);if(d.length()<1e-3)d.set(0,0,1);d.normalize().multiplyScalar((t==='ctoy_track'?0.24:0.06)+p.d.len*0.42);return [c.clone().add(d)]}
function goodsUpdate(dt){for(const it of items){if(!it.placed)continue;
  if(it.spinN){it.boost=Math.max(0,(it.boost||0)-dt);it.spinN.rotation.y+=dt*(it.boost>0?7:0.25)}
  if(it.v&&MOVTOY(it.type)){const g=it.g,sp=it.v.length();if(sp<0.02){it.v=null;recomputeBlock();save();continue}
   g.position.addScaledVector(it.v,dt);it.v.multiplyScalar(Math.pow(.18,dt));
   if(g.position.x<WALK.x0||g.position.x>WALK.x1)it.v.x*=-1;if(g.position.z<WALK.z0||g.position.z>WALK.z1)it.v.z*=-1;
   g.position.x=THREE.MathUtils.clamp(g.position.x,WALK.x0,WALK.x1);g.position.z=THREE.MathUtils.clamp(g.position.z,WALK.z0,WALK.z1);
   if(ROLLTOY(it.type)){g.rotation.y=Math.atan2(it.v.x,it.v.z);it.roll=(it.roll||0)+sp*dt/0.06;g.children[0].rotation.x=it.roll}else g.rotation.y+=sp*dt*6}}}
function kickToy(p,it){const a=p.yaw+(Math.random()-.5)*1.4;it.v=new THREE.Vector3(Math.sin(a),0,Math.cos(a)).multiplyScalar((isDog(p)?1.1:0.8)+Math.random()*.6);p.hop=1}
function goodsArrive(p,it,k){const t=it.type;
 if(k==='litter'){p.state='potty';p.wait=3.5+Math.random()*1.5;p.yaw=it.g.rotation.y+Math.PI;say(`🚽 ${p.d.name} 在${NAME[t]}上廁所…`);return true}
 if(k!=='toy')return false;
 if(t==='ctoy_tunnel'){p.state='tunnel';p.jt=0;p.j0=p.holder.position.clone();p.j1=p.tunEnd;p.paused=0;say(`🌀 ${p.d.name} 鑽進貓隧道！`);return true}
 if(t==='ctoy_scratch'){p.state='scratch';p.wait=3.5+Math.random()*2;const c=it.g.position;p.yaw=Math.atan2(c.x-p.holder.position.x,c.z-p.holder.position.z);say(`🐾 ${p.d.name} 在磨爪子`);return true}
 if(t==='ctoy_track'){p.state='bat';p.wait=4+Math.random()*2;it.boost=p.wait;const c=it.g.position;p.yaw=Math.atan2(c.x-p.holder.position.x,c.z-p.holder.position.z);say(`🎡 ${p.d.name} 在撥轉盤上的球`);return true}
 p.state=isDog(p)&&CHEWTOY(t)?'chew':'toyplay';p.wait=p.state==='chew'?3+Math.random()*2:6;p.kicks=0;p.maxK=2+Math.floor(Math.random()*3);
 const c=it.g.position;p.yaw=Math.atan2(c.x-p.holder.position.x,c.z-p.holder.position.z);
 say(p.state==='chew'?`🦴 ${p.d.name} 抱著${NAME[t]}咬咬咬`:`${isDog(p)?'🐶':'🐱'} ${p.d.name} 在玩${NAME[t]}`);return true}
function goodsDone(p,coin,e){p.state='happy';p.wait=1;p.mood=Math.min(100,p.mood+8);hearts(p,e);addCoin(coin);if(G&&p.d.idx>=0)G.pat(p.d.idx,1);p.spot=null}
function goodsUpdateP(p,dt){const P=p.holder.position,st=p.state,it=p.spot;
 if(st==='potty'){p.speed=0;p.wait-=dt;if(p.wait<=0){p.state='bury';p.wait=1.4}return true}
 if(st==='bury'){p.speed=0;p.wait-=dt;if(p.hop<=0&&Math.random()<dt*4)p.hop=.55;if(p.wait<=0){p.potty=0;p.state='walk';p.tgt=it?locOf(it,0,0,0.62):randPt(.3);p.spot=null;hearts(p,'✨');addCoin(2);say(`✨ ${p.d.name} 上完廁所還自己埋好了，好乖！+2`)}return true}
 if(st==='tunnel'){p.jt=Math.min(1,p.jt+dt*(p.paused>0?0:0.55));if(p.jt>0.45&&p.jt<0.5&&p.paused===0){p.paused=1.2+Math.random()}if(p.paused>0){p.paused-=dt;if(p.paused<=0){p.paused=-1;p.jt=0.5}}
  P.lerpVectors(p.j0,p.j1,p.jt);P.y=0;p.yaw=Math.atan2(p.j1.x-p.j0.x,p.j1.z-p.j0.z);p.speed=p.paused>0?0:p.d.spd*0.7;p.phase+=dt*p.speed*p.d.stride;
  if(p.jt>=1){p.hop=1;goodsDone(p,3,'🌀');say(`🌀 ${p.d.name} 從隧道另一頭鑽出來了！+3`)}return true}
 if(st==='scratch'||st==='bat'){p.speed=0;p.wait-=dt;if(st==='bat'){if(it)it.boost=Math.max(it.boost||0,.5);if(p.hop<=0&&Math.random()<dt*1.6)p.hop=.6}
  if(p.wait<=0)goodsDone(p,2,st==='bat'?'🎡':'🐾');return true}
 if(st==='chew'){p.speed=0;p.wait-=dt;if(p.wait<=0){if(it)kickToy(p,it);p.state='toyplay';p.wait=6;p.kicks=1}return true}
 if(st==='toyplay'){if(!it||!it.placed){p.state='idle';p.spot=null;return true}p.wait-=dt;const c=it.g.position;const d=moveTo(p,c,dt,isDog(p)?1.5:1.6);
  if(d<p.d.len*0.42+0.08&&(!it.v||it.v.length()<0.25)){if(p.kicks>=p.maxK||p.wait<=0){goodsDone(p,3,isDog(p)?'🐶':'🧶');say(`${isDog(p)?'🐶':'🐱'} ${p.d.name} 玩${NAME[it.type]}玩得好開心！+3`)}else{kickToy(p,it);p.kicks++}}
  return true}
 return false}
function catNeeds(p,dt){if(isDog(p))return;p.potty=(p.potty==null?Math.random()*60:p.potty)+dt*0.28;
 if(p.potty>100&&PLAYABLE(p)){if(goSpot(p,'litter',false))return;if(p.potty>125){p.potty=70;if(performance.now()-pottyWarn>60000){pottyWarn=performance.now();say(`😿 ${p.d.name} 想上廁所，可是家裡沒有貓砂盆，去家具店買一個吧！`)}}}}
/* ---------- 狗屋・貓跳檯・逗貓棒 ---------- */
const isDog=p=>(p.d.key[0]==='p'?(GP[p.d.idx]&&GP[p.d.idx].type==='dog'):p.d.key[0]==='d');
const placedOf=t=>items.filter(i=>i.placed&&(typeof t==='string'?i.type===t:t(i.type)));
const busyBy=(it,st)=>pets.some(q=>q.spot===it&&q.state!=='idle'&&q.state!=='walk');
function locOf(it,x,y,z){const v=new THREE.Vector3(x,y,z);it.g.updateMatrixWorld(true);return v.applyMatrix4(it.g.matrixWorld)}
function goSpot(p,kind,force,it0){if(p.off||(p.state==='sleep'&&!force)||(p.holder.position.y>0.01&&p.state==='perch'))return false;
 let list=kind==='house'?(isDog(p)?placedOf('doghouse'):placedOf(isCH)):kind==='tree'?placedOf('cattree'):kind==='litter'?placedOf(isLit):kind==='toy'?placedOf(isDog(p)?isDT:isCT):placedOf(t=>t.startsWith('wand_'));if(!list.length)return false;
 let it=it0||list.filter(i=>!busyBy(i)).sort((a,b)=>a.g.position.distanceTo(p.holder.position)-b.g.position.distanceTo(p.holder.position))[0];if(!it)return false;
 let tgt;
 if(kind==='house')tgt=locOf(it,0,0,0.05);
 else if(kind==='tree')tgt=locOf(it,0.18,0,0.42);
 else if(kind==='litter')tgt=locOf(it,0,0,0.02);
 else if(kind==='toy'){const tt=toyTarget(p,it);tgt=tt[0];p.tunEnd=tt[1]||null}
 else{const toy=locOf(it,0.32,0,0);const c=new THREE.Vector3(-toy.x,0,-toy.z).normalize().multiplyScalar(0.3+p.d.len*0.35);tgt=toy.clone().add(c);tgt.y=0;p.toy=toy}
 tgt.x=THREE.MathUtils.clamp(tgt.x,WALK.x0,WALK.x1);tgt.z=THREE.MathUtils.clamp(tgt.z,WALK.z0,WALK.z1);
 if(p.friend)endPlay(p);p.state='toSpot';p.spot=it;p.spotKind=kind;p.tgt=tgt;return true}
function trySpot(p){if(!PLAYABLE(p))return false;const r=Math.random();
 if(isDog(p)){if((p.energy<50?r<.5:r<.16)&&goSpot(p,'house'))return true;return r>.72&&goSpot(p,'toy')}
 if(p.energy<50&&r<.4&&goSpot(p,'house'))return true;
 if(r<.18&&goSpot(p,'wand'))return true;if(r>.82&&goSpot(p,'tree'))return true;if(r>.5&&r<.72&&goSpot(p,'toy'))return true;if(r>.42&&r<.5&&goSpot(p,'house'))return true;return false}
function arriveSpot(p){const it=p.spot,k=p.spotKind;if(goodsArrive(p,it,k))return;
 if(k==='house'){p.state='house';p.wait=8+Math.random()*8;p.yaw=it.g.rotation.y;say(`🏠 ${p.d.name} 鑽進${NAME[it.type]||'狗屋'}${p.energy<60?'睡午覺':'休息'}了`)}
 else if(k==='tree'){p.state='climb';p.jt=0;p.j0=p.holder.position.clone();p.j1=locOf(it,0.18,1.14,-0.05);p.yaw=it.g.rotation.y}
 else{p.state='wand';p.wait=5+Math.random()*3;say(`🧶 ${p.d.name} 在玩${NAME[it.type]}`)}}
function spotUpdate(p,dt){const P=p.holder.position;if(goodsUpdateP(p,dt))return true;
 if(p.state!=='climb'&&p.state!=='perch'&&p.state!=='jumpdown'&&P.y>0.001){P.y=Math.max(0,P.y-dt*2.5)}
 if(p.state==='climb'||p.state==='jumpdown'){p.jt=Math.min(1,p.jt+dt*1.5);const a=p.state==='climb'?p.j0:p.j1,b=p.state==='climb'?p.j1:p.j0;
  P.lerpVectors(a,b,p.jt);P.y+=Math.sin(p.jt*Math.PI)*0.35;p.speed=0;
  if(p.jt>=1){if(p.state==='climb'){p.state='perch';p.wait=6+Math.random()*6;p.hop=1;say(`👑 ${p.d.name} 跳上貓跳檯了`);addCoin(2)}else{P.y=0;p.state='idle';p.wait=1+Math.random()*2;p.spot=null}}return true}
 if(p.state==='perch'){p.speed=0;p.wait-=dt;if(p.wait<=0){p.state='jumpdown';p.jt=0;p.j1=P.clone()}return true}
 if(p.state==='house'){p.speed=0;p.wait-=dt;if(p.energy<60)p.energy=Math.min(100,p.energy+dt*3);if(p.wait<=0){p.state='walk';p.tgt=locOf(p.spot,0,0,isCH(p.spot.type)?0.6:0.75);p.spot=null}return true}
 if(p.state==='wand'){p.speed=0;p.wait-=dt;if(p.toy){const da0=Math.atan2(p.toy.x-P.x,p.toy.z-P.z)-p.yaw;p.yaw+=Math.atan2(Math.sin(da0),Math.cos(da0))*Math.min(1,dt*6)}
  if(Math.random()<dt*1.4)p.hop=1;if(p.wait<=0){p.state='happy';p.wait=1;p.mood=Math.min(100,p.mood+8);hearts(p,'🧶');addCoin(3);if(G&&p.d.idx>=0)G.pat(p.d.idx,1);p.spot=null}return true}
 return false}
function swingWands(dt){for(const it of items){if(!it.swing||!it.placed)continue;const playing=pets.some(q=>q.spot===it&&q.state==='wand');it.boost=Math.max(0,(it.boost||0)-dt);
 const amp=playing||it.boost>0?0.55:0.12,sp=playing||it.boost>0?7:1.6;it.sw+=dt*sp;it.swing.rotation.x=Math.sin(it.sw)*amp;it.swing.rotation.z=Math.cos(it.sw*0.7)*amp*0.6}}
// ---- 改名 ----
function curPet(){return pets[sel]||pets[0]||null}
window.openRename=()=>{const p=curPet();if(!p)return say('先點一隻毛孩，再按改名');document.getElementById('rnT').textContent='✏️ 幫 '+p.d.name+' 改名字';const I=document.getElementById('rnI');I.value=p.d.name;document.getElementById('rn').style.display='flex';setTimeout(()=>{I.focus();I.select()},50)};
window.closeRename=()=>{document.getElementById('rn').style.display='none'};
window.doRename=()=>{const p=curPet();const v=document.getElementById('rnI').value.trim().slice(0,6);closeRename();if(!p||!v||v===p.d.name)return;
 if(G&&p.d.idx>=0){if(G.rename&&G.rename(p.d.idx,v)===false)return say('改名失敗')}
 p.d.name=v;const b=btn[p.d.key];if(b)b.textContent=(p.d.key[0]==='p'?(GP[p.d.idx]&&GP[p.d.idx].type==='cat'?'🐱':'🐶'):(p.d.key[0]==='d'?'🐶':'🐱'))+v;say('✏️ 以後叫牠「'+v+'」囉');hearts(p,'✏️')};
document.getElementById('rnI').addEventListener('keydown',e=>{if(e.key==='Enter')doRename();if(e.key==='Escape')closeRename()});
</script></body></html>
