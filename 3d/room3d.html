<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2.5));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#f6efe6');
{const pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.55;}
const cam=new THREE.PerspectiveCamera(45,1,0.05,60);cam.position.set(innerWidth<innerHeight?-2.9:-3.4,innerWidth<innerHeight?4.6:3.9,innerWidth<innerHeight?5.0:5.0);
const ctl=new OrbitControls(cam,cv);ctl.target.set(0,0.2,-0.3);ctl.enableDamping=true;ctl.enableZoom=false;ctl.minPolarAngle=0.35;ctl.maxPolarAngle=1.45;ctl.enablePan=false;
scene.add(new THREE.HemisphereLight('#fff6ea','#8a7060',0.6));
const sun=new THREE.DirectionalLight('#fff1dc',2.2);sun.position.set(3,5,3.5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.5,far:15});sun.shadow.bias=-0.0004;sun.shadow.radius=3;sun.shadow.normalBias=0.02;scene.add(sun);
const fill=new THREE.PointLight('#ffd7a8',0.6,10);fill.position.set(-1.5,2.4,0.5);scene.add(fill);

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?60:42;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();

const tip=document.getElementById('tip');let tipT=0;function say(s){tip.textContent=s;tip.style.opacity=1;clearTimeout(tipT);tipT=setTimeout(()=>tip.style.opacity=0,2400)}
const G=(()=>{try{return window.parent!==window&&window.parent.G3D?window.parent.G3D:null}catch(e){return null}})();
let coins=G?G.coins():0;const coinEl=document.getElementById('coin');coinEl.textContent='💰 '+coins;if(G){document.getElementById('backBtn').style.display='';document.getElementById('ttl').style.display='none'}
function setCoins(n){coins=n;coinEl.textContent='💰 '+coins;if(G)G.setCoins(coins)}
function addCoin(n){setCoins(coins+n);try{save()}catch(e){}}

/* ---------- 房間 ---------- */
const lb=document.getElementById('lb');const prog={};function setP(k,v){prog[k]=v;const a=Object.values(prog);lb.style.width=(a.reduce((x,y)=>x+y,0)/a.length*100)+'%'}
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const load=(url,k)=>new Promise(async(ok,no)=>{try{setP(k,0);const r=await fetch(url);const tot=+r.headers.get('content-length')||0;const rd=r.body.getReader();let got=0,parts=[];for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;if(tot)setP(k,got/tot*.95)}
 const txt=new TextDecoder().decode(await new Blob(parts).arrayBuffer());const b64=JSON.parse(txt).glb;const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));loader.parse(bin.buffer,'',g=>{setP(k,1);ok(g)},no)}catch(e){no(e)}});
const blockers=[];const walls=[];const wallInfo=[];
function setupWalls(){const rc=new THREE.Vector3(0,0,0);walls.forEach(w=>{const b=new THREE.Box3().setFromObject(w),c=b.getCenter(new THREE.Vector3()),z=b.getSize(new THREE.Vector3());const ax=z.x<z.z?'x':'z';const n=new THREE.Vector3();n[ax]=Math.sign(rc[ax]-c[ax])||1;wallInfo.push({w,c,n})})}
function cutWalls(){wallInfo.forEach(({w,c,n})=>{const v=cam.position.clone().sub(c);w.visible=v.dot(n)>0.05})}
// 家具碰撞框 (x,z)
const RW=8.6,RD=7.2,RH=3;const WALK={x0:-RW/2+.3,x1:RW/2-.3,z0:-RD/2+.3,z1:RD/2-.3};
const BN={fl:'fl',fr:'fr',bl:'bl',br:'br',fl2:'fl2',fr2:'fr2',bl2:'bl2',br2:'br2',tail:'tail',tail2:'tail2',head:'head',neck:'neck',spine:'chest'};
const BN2={fl:'fl',fr:'fr',bl:'bl',br:'br',fl2:'fl2',fr2:'fr2',bl2:'bl2',br2:'br2',tail:'tail',tail2:'tail2',head:'head',neck:'neck',spine:'spine'};
const BABIES=[
 ['d_shiba','柴犬',.52,.14],['d_golden','黃金',.58,.16],['d_taiwan','台灣土狗',.55,.21],['d_frenchie','法鬥',.46,.22],['d_poodle','貴賓',.48,.165],['d_chihuahua','吉娃娃',.38,.25],
 ['c_orange','橘貓',.44,.17],['c_black','黑貓',.44,.15],['c_ragdoll','布偶貓',.48,.12],['c_british','英短',.45,.12],['c_maine','緬因貓',.52,.13],['c_tuxedo','賓士貓',.44,.15],['d_corgi','柯基',0.48,0.16],['d_pom','博美',0.4,0.2],['d_schnauzer','雪納瑞',0.48,0.19],['d_dachshund','臘腸',0.52,0.12],['d_husky','哈士奇',0.54,0.17],['d_maltese','馬爾濟斯',0.4,0.18],['d_bichon','比熊',0.44,0.19],['d_border','邊境牧羊犬',0.54,0.18],['c_siamese','暹羅貓',0.46,0.15],['c_american','美國短毛貓',0.45,0.14],['c_scottish','摺耳貓',0.44,0.12],['c_calico','三花貓',0.44,0.13],['d_akita','秋田',0.54,0.17],['d_beagle','米格魯',0.48,0.17],['d_labrador','拉布拉多',0.56,0.16],['d_yorkie','約克夏',0.38,0.2],['d_shihtzu','西施',0.42,0.16],['d_samoyed','薩摩耶',0.54,0.16],['d_pug','巴哥',0.44,0.18],['d_gsd','德國牧羊犬',0.56,0.18],['c_persian','波斯貓',0.44,0.12],['c_russian','俄羅斯藍貓',0.45,0.15],['c_bengal','孟加拉貓',0.46,0.15],['c_munchkin','曼赤肯',0.42,0.09]];
const READY=new Set(['d_shiba','d_golden','d_taiwan','d_frenchie','d_poodle','d_chihuahua','c_orange','c_ragdoll','c_british','c_maine','c_black','c_tuxedo','d_corgi','d_pom','d_schnauzer','d_dachshund','d_husky','d_maltese','d_bichon','d_border','c_siamese','c_american','c_scottish','c_calico','d_akita','d_beagle','d_labrador','d_yorkie','d_shihtzu','d_samoyed','d_pug','d_gsd','c_persian','c_russian','c_bengal','c_munchkin']);
const MAP3D={};
const GP=G?G.pets():[];
const defOf=k=>{let model=k,name;if(k[0]==='p'){const q=GP[+k.slice(1)];model=MAP3D[q.breed]||q.breed;if(!BABIES.find(x=>x[0]===model))model=q.type==='cat'?'c_orange':'d_shiba';name=q.name}
 const b=BABIES.find(x=>x[0]===model);return {key:k,idx:k[0]==='p'?+k.slice(1):-1,kind:'glb',file:'b_'+model+'.json',name:name||b[1],len:b[2],legR:b[3],legH:b[2]*b[3],spd:.3+b[2]*.25,stride:13,bones:BN2}};
const room=load('room.json','room');
const TL=new THREE.TextureLoader();const ltex=u=>new Promise((ok,no)=>TL.load(u,t=>{t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.RepeatWrapping;t.repeat.x=1/9;ok(t)},undefined,no));
const shadowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,2,32,32,31);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();

const items=[];let itemSeq=0;
function mkItem(type,g,place=true){const it={id:++itemSeq,type,g,placed:place};g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.userData.item=it}});g.visible=place;scene.add(g);items.push(it);return it}
function groupOf(meshes){const B=new THREE.Box3();meshes.forEach(m=>B.union(new THREE.Box3().setFromObject(m)));const c=B.getCenter(new THREE.Vector3());const g=new THREE.Group();g.position.set(c.x,0,c.z);scene.add(g);g.updateMatrixWorld(true);meshes.forEach(m=>g.attach(m));return g}
const ORIG={o_sofa:[/sofa/,'舊沙發'],o_table:[/coffee_table_round/,'圓茶几'],o_plant:[/potted_plant_02/,'盆栽'],o_shelf:[/wooden_display_shelves/,'展示櫃']};
const ODEF={o_sofa:[0,-3.0,0],o_table:[0,-1.5,0],o_plant:[-3.7,-3.1,0],o_shelf:[3.95,0.2,0]};
const roomReady=room.then(g=>{const root=g.scene;root.rotation.y=Math.PI;root.updateMatrixWorld(true);let floorM=null,wallM=null;const all=[];
 root.traverse(o=>{if(o.isMesh){all.push(o);if(/Floor/.test(o.name))floorM=o.material;if(/Wall/.test(o.name))wallM=o.material}});
 // 地板與牆：放大成 RW×RD
 const fm=floorM.clone();if(fm.map){fm.map=fm.map.clone();fm.map.wrapS=fm.map.wrapT=THREE.RepeatWrapping;fm.map.repeat.set(RW*0.58,RD*0.58);fm.map.needsUpdate=true}
 ['normalMap','roughnessMap','aoMap'].forEach(k=>{if(fm[k]){fm[k]=fm[k].clone();fm[k].wrapS=fm[k].wrapT=THREE.RepeatWrapping;fm[k].repeat.set(RW*0.58,RD*0.58);fm[k].needsUpdate=true}});
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),fm);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.name='Floor2';scene.add(floor);window.__floor=floor;
 const mkWall=(len,x,z,ry)=>{const m=wallM.clone();if(m.map){m.map=m.map.clone();m.map.wrapS=m.map.wrapT=THREE.RepeatWrapping;m.map.repeat.set(len/2,1.5);m.map.needsUpdate=true}m.side=THREE.FrontSide;
  const w=new THREE.Mesh(new THREE.PlaneGeometry(len,RH),m);w.position.set(x,RH/2,z);w.rotation.y=ry;w.receiveShadow=true;scene.add(w);walls.push(w)};
 mkWall(RW,0,-RD/2,0);mkWall(RW,0,RD/2,Math.PI);mkWall(RD,-RW/2,0,Math.PI/2);mkWall(RD,RW/2,0,-Math.PI/2);
 all.forEach(o=>{if(/Floor|Wall/.test(o.name))o.visible=false});
 for(const [k,[re]] of Object.entries(ORIG)){const ms=all.filter(o=>re.test(o.name));if(!ms.length)continue;ms.forEach(m=>{const mm=m.material;if(mm&&mm.map&&/Floor|Wall/.test(m.name)){}});const gg=groupOf(ms);const d=ODEF[k];gg.position.set(d[0],0,d[1]);gg.rotation.y=d[2];mkItem(k,gg)}

 const wag=(p.state==='happy'||p.state==='play'||p.state==='wait')?Math.sin(p.t*18)*.7:Math.sin(p.t*(p.speed>0?6:2.4))*.28;rot(g('tail'),0,0,wag);rot(g('tail2'),0,0,wag*.8);
 if(lying){rot(g('fl'),-1.25,0,0);rot(g('fr'),-1.25,0,0);rot(g('bl'),1.35,0,0);rot(g('br'),1.35,0,0);rot(g('fl2'),.6,0,0);rot(g('fr2'),.6,0,0);rot(g('bl2'),-1.4,0,0);rot(g('br2'),-1.4,0,0)}
 const look=p.state==='idle'?Math.sin(p.t*.7)*.35:0;rot(g('head'),lying?.25:(p.state==='eat'?.55+Math.sin(p.t*9)*.08:Math.sin(p.t*1.7)*.05),look,0);
 rot(g('spine'),lying?0:Math.sin(p.t*2.2)*.015,0,0)}
function procAnim(p){if(p.d.bones){const lying=p.state==='sleep';p.lie=(p.lie||0)+((lying?1:0)-(p.lie||0))*.08;
 p.m.position.y=p.y0-p.lie*p.d.legH+(p.speed>0?Math.abs(Math.sin(p.phase))*0.012*p.d.len:0)+(p.hop>0?Math.sin((1-p.hop)*Math.PI)*0.22:0);p.m.rotation.x=0;return}// 沒有骨架時：整體擺動
 const bob=p.speed>0?Math.abs(Math.sin(p.phase))*0.025*p.d.len:Math.sin(p.t*2.4)*0.004*p.d.len;
 p.m.position.y=bob+(p.hop>0?Math.sin((1-p.hop)*Math.PI)*0.25:0);
 p.m.rotation.z=p.speed>0?Math.sin(p.phase)*0.04:0;
 const lying=p.state==='sleep';p.m.scale.y=p.m.scale.x*(lying?0.72:1+Math.sin(p.t*2.4)*0.012);
 if(p.state==='eat')p.m.rotation.x=.12+Math.sin(p.t*9)*.03;else p.m.rotation.x=0}

const v3=new THREE.Vector3(),camR=new THREE.Vector3();
function sprAnim(p,dt){// 2.5D：只轉向鏡頭的照片毛孩
 const cy=Math.atan2(cam.position.x-p.holder.position.x,cam.position.z-p.holder.position.z);p.m.rotation.y=cy;
 camR.set(Math.cos(cy),0,-Math.sin(cy));const vx=Math.sin(p.yaw)*camR.x+Math.cos(p.yaw)*camR.z;if(p.speed>.05&&Math.abs(vx)>.15)p.face=vx>0?1:-1;
 const eating=p.state==='eat',lying=p.state==='sleep';const tex=eating?p.te:p.tw;if(p.mat.map!==tex){p.mat.map=tex;p.mat.needsUpdate=true}
 if(p.speed>.05||eating){p.fr+=dt*(eating?8:p.d.fps*Math.min(1.3,p.speed/p.d.spd+.2))}const f=Math.floor(p.fr)%9;
 tex.repeat.x=p.face/9;tex.offset.x=p.face>0?f/9:(f+1)/9;
 const hop=p.hop>0?Math.sin((1-p.hop)*Math.PI)*0.22:0;const br=Math.sin(p.t*2.4)*.012;
 p.plane.position.y=hop;p.plane.scale.set(lying?1.08:1-br*.5,lying?.62:1+br,1);
 p.plane.material.color.setScalar(lying?.92:1)}
/* ---------- 毛孩互相玩耍 ---------- */
const PLAYABLE=q=>q&&!q.off&&['idle','walk','happy'].includes(q.state)&&q.energy>15;
const PLAYS={sniff:['👃','互相聞聞'],chase:['💨','玩追逐'],circle:['🌀','轉圈圈玩'],wrestle:['🤼','滾來滾去']};
function startPlay(a,b,kind){if(!a||!b||a===b)return false;kind=kind||Object.keys(PLAYS)[Math.floor(Math.random()*4)];
 a.state='toFriend';a.friend=b;a.playKind=kind;a.lead=true;b.state='wait';b.friend=a;b.wait=6;b.speed=0;b.playKind=kind;b.lead=false;return true}
function beginPlay(a){const b=a.friend;if(!b||b.friend!==a){a.state='idle';a.wait=1;return}const k=a.playKind;
 const mid=a.holder.position.clone().add(b.holder.position).multiplyScalar(.5);
 [a,b].forEach((q,i)=>{q.state='play';q.pt=0;q.pdur=k==='chase'?6:k==='circle'?4.5:k==='wrestle'?3.5:2.6;q.mid=mid.clone();q.ang=i*Math.PI;q.speed=0});
 if(k==='chase'){a.tgt=randPt(.4);a.chaser=false;b.chaser=true}
 say(PLAYS[k][0]+' '+a.d.name+' 和 '+b.d.name+' '+PLAYS[k][1]+'！+2');addCoin(2);if(G){[a,b].forEach(q=>{if(q.d.idx>=0)G.pat(q.d.idx,1)})}hearts(a,PLAYS[k][0])}
function endPlay(q){q.state='happy';q.wait=1+Math.random();q.hop=1;q.friend=null}
function playUpdate(p,dt){
 if(p.state==='wait'){p.speed*=.85;const f=p.friend;if(f){v3.subVectors(f.holder.position,p.holder.position);let da=Math.atan2(v3.x,v3.z)-p.yaw;da=Math.atan2(Math.sin(da),Math.cos(da));p.yaw+=da*Math.min(1,dt*3)}p.wait-=dt;if(p.wait<=0||!f||f.state!=='toFriend'&&f.state!=='play'){p.state='idle';p.wait=1;p.friend=null}return true}
 if(p.state==='toFriend'){const f=p.friend;if(!f||f.state!=='wait'){p.state='idle';p.wait=1;return true}
  v3.subVectors(f.holder.position,p.holder.position);v3.y=0;const dist=v3.length();const want=Math.atan2(v3.x,v3.z);let da=want-p.yaw;da=Math.atan2(Math.sin(da),Math.cos(da));p.yaw+=da*Math.min(1,dt*4);
  p.speed+=(p.d.spd*1.25-p.speed)*Math.min(1,dt*4);const gap=(p.d.len+f.d.len)*.5;
  if(dist>gap){p.holder.position.x+=Math.sin(p.yaw)*p.speed*dt;p.holder.position.z+=Math.cos(p.yaw)*p.speed*dt;p.phase+=dt*p.speed*p.d.stride}else{p.speed=0;beginPlay(p)}return true}
 if(p.state!=='play')return false;
 const f=p.friend;p.pt+=dt;if(!f||f.state!=='play'||p.pt>p.pdur){endPlay(p);return true}
 const k=p.playKind,P=p.holder.position;let mv=0;
 if(k==='sniff'||k==='wrestle'){v3.subVectors(f.holder.position,P);{const dd=Math.hypot(v3.x,v3.z),gp=(p.d.len+f.d.len)*.42;if(dd<gp&&dd>1e-3){P.x-=v3.x/dd*(gp-dd)*.5;P.z-=v3.z/dd*(gp-dd)*.5}}let da=Math.atan2(v3.x,v3.z)-p.yaw;da=Math.atan2(Math.sin(da),Math.cos(da));p.yaw+=da*Math.min(1,dt*5);p.speed=0;
  if(k==='wrestle'){p.yaw+=Math.sin(p.pt*9+(p.lead?0:2))*0.04;if(Math.random()<dt*1.6)p.hop=1;P.x+=Math.sin(p.pt*7)*0.004;P.z+=Math.cos(p.pt*6)*0.004}
  else if(Math.random()<dt*.6)p.hop=1}
 else if(k==='circle'){p.ang+=dt*2.2;const r=(p.d.len+f.d.len)*.42;const nx=p.mid.x+Math.sin(p.ang)*r,nz=p.mid.z+Math.cos(p.ang)*r;mv=Math.hypot(nx-P.x,nz-P.z);if(mv>1e-4)p.yaw=Math.atan2(nx-P.x,nz-P.z);P.x=nx;P.z=nz;p.speed=mv/dt;if(Math.random()<dt*.5)p.hop=1}
 else if(k==='chase'){const tgt=p.chaser?f.holder.position:p.tgt;v3.subVectors(tgt,P);v3.y=0;const d=v3.length();
  if(!p.chaser&&d<.25)p.tgt=randPt(.4);let da=Math.atan2(v3.x,v3.z)-p.yaw;da=Math.atan2(Math.sin(da),Math.cos(da));p.yaw+=da*Math.min(1,dt*5);
  const spd=p.d.spd*(p.chaser?1.75:1.85)*(p.chaser&&d<(p.d.len+f.d.len)*.55?0.2:1);p.speed+=(spd-p.speed)*Math.min(1,dt*4);
  P.x+=Math.sin(p.yaw)*p.speed*dt;P.z+=Math.cos(p.yaw)*p.speed*dt}
 P.x=THREE.MathUtils.clamp(P.x,WALK.x0,WALK.x1);P.z=THREE.MathUtils.clamp(P.z,WALK.z0,WALK.z1);p.phase+=dt*p.speed*p.d.stride;return true}
window.playTogether=()=>{const on=pets.filter(PLAYABLE);if(on.length<2)return say(pets.length<2?'房間裡至少要有 2 隻毛孩才能一起玩':'毛孩們在忙（睡覺或吃飯），等一下再玩');
 const a=on[Math.floor(Math.random()*on.length)];const others=on.filter(q=>q!==a);startPlay(a,others[Math.floor(Math.random()*others.length)])};

function update(p,dt){p.t+=dt;if(p.hop>0)p.hop=Math.max(0,p.hop-dt*1.6);
 p.hunger=Math.min(100,p.hunger+dt*.4);p.energy=Math.max(0,p.energy-dt*(p.state==='sleep'?-4:.25));
 if(playUpdate(p,dt)){}
 else if(p.state==='sleep'){p.speed=0;if(p.energy>=99){p.state='idle';say(`☀️ ${p.d.name} 睡飽起床了`)}}
 else if(p.state==='walk'||p.state==='toBall'||p.state==='toBowl'||p.state==='toBed'){
  const tgt=p.state==='toBall'?ball.position:p.tgt;v3.subVectors(tgt,p.holder.position);v3.y=0;const dist=v3.length();
  const want=Math.atan2(v3.x,v3.z);let da=want-p.yaw;da=Math.atan2(Math.sin(da),Math.cos(da));p.yaw+=da*Math.min(1,dt*4);
  const spd=p.d.spd*(p.state==='toBall'?1.8:1)*(Math.abs(da)>1?0.3:1);p.speed+= (spd-p.speed)*Math.min(1,dt*4);
  const nx=p.holder.position.x+Math.sin(p.yaw)*p.speed*dt,nz=p.holder.position.z+Math.cos(p.yaw)*p.speed*dt;
  if(free(nx,nz,.18)||p.state!=='walk'){p.holder.position.x=nx;p.holder.position.z=nz}else{p.tgt=randPt(.3)}
  p.phase+=dt*p.speed*p.d.stride;
  if(dist<(p.state==='toBall'?.22:.12)){p.speed=0;
   if(p.state==='toBall'){ball.visible=false;p.state='happy';p.wait=1.6;p.hop=1;hearts(p,'🎾');addCoin(8);say(`🎾 ${p.d.name} 接到球了！+8`)}
   else if(p.state==='toBowl'){p.state='eat';p.wait=4;}
   else if(p.state==='toBed'){p.state='sleep';say(`💤 ${p.d.name} 在床上睡著了`)}
   else{p.state='idle';p.wait=1.5+Math.random()*3}}}
 else{p.speed*=0.85;p.wait-=dt;
  if(p.state==='eat'&&p.wait<=0){p.hunger=0;food.visible=false;p.state='happy';p.wait=1.2;addCoin(5);say(`😋 ${p.d.name} 吃飽了！+5`)}
  else if(p.wait<=0){if(p.state==='happy')p.state='idle';else if(p.state==='sit'){p.state='idle';p.wait=.6+Math.random()}else if(p.mix&&p.state==='idle'&&Math.random()<.25){p.state='sit';p.wait=4+Math.random()*5}else if(Math.random()<.35&&PLAYABLE(p)&&pets.filter(q=>q!==p&&PLAYABLE(q)).length){const o=pets.filter(q=>q!==p&&PLAYABLE(q));startPlay(p,o[Math.floor(Math.random()*o.length)])}else if(p.energy<20){p.state='toBed';p.tgt=new THREE.Vector3(bedG.position.x+(Math.random()-.5)*.2,0,bedG.position.z)}else{p.state='walk';p.tgt=randPt(.3)}}}
 if(p.d.kind==='spr'){sprAnim(p,dt)}else{p.holder.rotation.y=p.yaw;
 if(p.mix)clipAnim(p,dt);else{if(Object.keys(p.B).length&&p.d.bones)animBones(p,dt);procAnim(p);}}
 const hp=p.holder.position.clone();hp.y=p.d.len*0.75;hp.project(cam);p.tag.style.left=((hp.x+1)/2*innerWidth)+'px';p.tag.style.top=((-hp.y+1)/2*innerHeight)+'px';
 p.tag.textContent=p.d.name+(p.state==='play'?' '+PLAYS[p.playKind][0]:p.state==='sleep'?' 💤':p.state==='eat'?' 😋':p.hunger>80?' 🍖?':'')}

function hearts(p,e='💖'){const hp=p.holder.position.clone();hp.y=p.d.len*0.6;hp.project(cam);for(let i=0;i<5;i++){const h=document.createElement('div');h.className='heart';h.textContent=e;h.style.left=((hp.x+1)/2*innerWidth+(Math.random()-.5)*60)+'px';h.style.top=((-hp.y+1)/2*innerHeight)+'px';h.style.animationDelay=i*.1+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),1600)}}
let sel=0;
window.act=(k,pp)=>{const on=pets.filter(q=>!q.off);if(!on.length)return;const p=pp||on[sel%on.length];if(!p)return;sel++;
 if(k==='pet'){if(p.state==='sleep')return say(`🤫 ${p.d.name} 在睡覺，讓牠休息吧`);p.state='happy';p.wait=1.8;p.speed=0;p.hop=1;p.mood=Math.min(100,p.mood+10);hearts(p);addCoin(3);if(G&&p.d.idx>=0)G.pat(p.d.idx,1);say(`💖 摸摸 ${p.d.name}！+3`)}
 if(k==='feed'){food.visible=true;on.forEach((q,i)=>{if(q.state!=='sleep'){q.state='toBowl';q.tgt=new THREE.Vector3(bowlG.position.x+[-.36,.36,0,0][i%4],0,bowlG.position.z+[.12,.12,.4,-.4][i%4])}});say('🍖 開飯囉！毛孩跑向食盆')}
 if(k==='ball'){const pt=randPt(.4);ball.position.set(pt.x,.06,pt.z);ball.visible=true;on.forEach(q=>{if(q.state!=='sleep')q.state='toBall'});say('🎾 丟球！看誰先接到')}
 if(k==='sleep'){on.forEach((q,i)=>{q.state='toBed';q.tgt=new THREE.Vector3(bedG.position.x+[-.2,.2,0,0][i%4],0,bedG.position.z+[0,0,.2,-.2][i%4])});say('💤 該睡覺了，毛孩走去床上')}}
cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];if(!EDIT)return;ptr(e);const it=pickItem();if(it){selIt=it;showSel();if(ray.ray.intersectPlane(plane0,hitP)){drag={it,dx:it.g.position.x-hitP.x,dz:it.g.position.z-hitP.z};ctl.enabled=false;cv.setPointerCapture(e.pointerId)}}});
cv.addEventListener('pointermove',e=>{if(!drag)return;ptr(e);if(ray.ray.intersectPlane(plane0,hitP)){const g=drag.it.g;g.position.x=THREE.MathUtils.clamp(hitP.x+drag.dx,WALK.x0,WALK.x1);g.position.z=THREE.MathUtils.clamp(hitP.z+drag.dz,WALK.z0,WALK.z1);showSel()}});
cv.addEventListener('pointerup',e=>{if(drag){drag=null;ctl.enabled=true;recomputeBlock();save();return}if(EDIT)return;if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;ptr(e);
 for(const p of pets){if(!p.off&&ray.intersectObject(p.holder,true).length){sel=pets.indexOf(p);act('pet',p);return}}});
window.__dbg={cam,ctl,pets,items,blockers};window.__sp=startPlay;const clk=new THREE.Clock();
R.setAnimationLoop(()=>{const dt=Math.min(.05,clk.getDelta());pets.forEach(p=>{if(!p.off)update(p,dt)});if(ball.visible)ball.rotation.x+=dt*4;ctl.update();cutWalls();R.render(scene,cam)});

// ---- 改名 ----
function curPet(){return pets[sel]||pets[0]||null}
window.openRename=()=>{const p=curPet();if(!p)return say('先點一隻毛孩，再按改名');document.getElementById('rnT').textContent='✏️ 幫 '+p.d.name+' 改名字';const I=document.getElementById('rnI');I.value=p.d.name;document.getElementById('rn').style.display='flex';setTimeout(()=>{I.focus();I.select()},50)};
window.closeRename=()=>{document.getElementById('rn').style.display='none'};
window.doRename=()=>{const p=curPet();const v=document.getElementById('rnI').value.trim().slice(0,6);closeRename();if(!p||!v||v===p.d.name)return;
 if(G&&p.d.idx>=0){if(G.rename&&G.rename(p.d.idx,v)===false)return say('改名失敗')}
 p.d.name=v;const b=btn[p.d.key];if(b)b.textContent=(p.d.key[0]==='p'?(GP[p.d.idx]&&GP[p.d.idx].type==='cat'?'🐱':'🐶'):(p.d.key[0]==='d'?'🐶':'🐱'))+v;say('✏️ 以後叫牠「'+v+'」囉');hearts(p,'✏️')};
document.getElementById('rnI').addEventListener('keydown',e=>{if(e.key==='Enter')doRename();if(e.key==='Escape')closeRename()});
