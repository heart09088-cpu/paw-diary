function avImg(src,sz){sz=sz||36;return okAv(src)?`<img src="${src}" alt="大頭貼" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover;border:2.5px solid #3B2A55;flex:none;background:#fff">`:`<span aria-hidden="true" style="width:${sz}px;height:${sz}px;border-radius:50%;border:2.5px solid #3B2A55;background:#FFD84D;display:inline-flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.5)}px;flex:none">🙋</span>`}
function avBtn(){return `<button class="avb" onclick="openMe()" aria-label="我的檔案和大頭貼">${avImg(S.avatar,34)}</button>`}
function openMe(){modal(`<h3>🙋 我的檔案</h3><div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 4px">${avImg(S.avatar,110)}
 <div style="display:flex;gap:8px"><button class="btn" onclick="pickAv()">📷 上傳照片</button>${S.avatar?'<button class="btn gray" onclick="delAv()">移除照片</button>':''}</div>
 <p style="font-size:12px;margin:0;text-align:center">照片會自動裁成正方形、縮小，朋友在朋友廣場看得到。</p></div>
 <div style="font-size:13px;font-weight:900;margin-top:4px">🏷️ 我的稱號 <small style="font-weight:600;color:#a08670">（戴在家裡左上角）</small></div>${titleSel()}
 <label for="nk" style="font-size:13px;font-weight:900">飼主暱稱（最多 12 字）</label><input id="nk" maxlength="12" value="${esc(S.nick||'')}" placeholder="${esc(myNick())}">
 <div class="mbtns"><button class="btn gray" onclick="closeModal()">取消</button><button class="btn" onclick="saveMe()">儲存</button></div>`)}
function saveMe(){const e=document.getElementById('nk');if(e){S.nick=e.value.trim().slice(0,12)}save();try{pushMe(true)}catch(x){}closeModal();render();toast('✅ 檔案已更新')}
function delAv(){S.avatar='';save();try{pushMe(true)}catch(x){}render();openMe()}
function pickAv(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.style.display='none';document.body.appendChild(i);
 i.onchange=()=>{const f=i.files&&i.files[0];i.remove();if(!f)return;if(!/^image\//.test(f.type))return toast('請選一張照片');
  const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{URL.revokeObjectURL(url);const s=Math.min(im.width,im.height);if(!s)return toast('這張照片讀不到');
   const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,128,128);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
   let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>22000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}
   if(!okAv(d))return toast('照片處理失敗，換一張試試');const nk=document.getElementById('nk');const keep=nk?nk.value:null;S.avatar=d;save();try{pushMe(true)}catch(x){}render();openMe();if(keep!==null){const n2=document.getElementById('nk');if(n2)n2.value=keep}toast('📷 大頭貼換好了！')};
  im.onerror=()=>{URL.revokeObjectURL(url);toast('這個檔案打不開，請換一張照片（建議 JPG 或 PNG）')};im.src=url};
 i.click()}

load();S.pets.forEach(initPet);if(!S.wx)newWx();weekly();if(!S.pets.length){S.intro=false}if(!S.tasks)newTasks();render();if(!S.intro||!S.pets.length){window.PENDLOGIN=1;realDay();intro()}else if(syncDay()){window.AFTERM=()=>loginBonus()}else loginBonus();
</script>
<script>
/* ---------- 小遊戲場加強：今日推薦（金幣 ×1.5）＋練習模式（次數用完也能玩，不拿獎勵、可刷新紀錄） ---------- */
(function(){
 const FEAT_BONUS=0.5;
 function featId(){const d=todayStr();let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;return MG[h%MG.length].id}
 window.mgFeatId=featId;
 const _play=playMG,_fin=mgFinish,_gEnd=gEnd,_chk=typeof checkAch==='function'?checkAch:null;
 let PR=null;
 function restore(){if(!PR)return;const id=PR.id,b=(S.best||{})[id]||0;S=JSON.parse(PR.snap);S.best=S.best||{};if(b>(S.best[id]||0))S.best[id]=b;PR=null;window._mgPrac=0;save();try{render()}catch(e){}}
 function watch(){const mo=new MutationObserver(()=>{if(!document.getElementById('game')){mo.disconnect();setTimeout(restore,0)}});mo.observe(document.body,{childList:true})}
 function practice(id){const p=pet();PR={id,snap:JSON.stringify(S)};window._mgPrac=1;S.gameToday=0;if(p.energy<10)p.energy=10;_play(id);
  if(!document.getElementById('game')){restore();return}watch()}
 window.mgPractice=practice;
 if(_chk)checkAch=function(){if(PR)return;return _chk.apply(this,arguments)};
 function pracBox(){const g=document.getElementById('game');if(!g)return;const box=[...g.querySelectorAll('.gstart')].pop();if(!box)return;
  const c=box.querySelector('#gcoin');if(c){const line=c.closest('div');if(line)line.outerHTML='<div style="font-size:16px;font-weight:800;color:#8a5cff">🎯 練習模式：不拿獎勵，只刷新個人紀錄</div>'}
  const t=[...box.querySelectorAll('div')].find(d=>/心情 \+10/.test(d.textContent)&&!d.querySelector('div'));if(t)t.remove();
  const ok=box.querySelector('#gok');if(ok){ok.textContent='結束練習';ok.onclick=()=>{g.remove();G=null}}}
 function featBonus(before){if(window._mgFeatNow!==featId())return;const got=S.coins-before;if(got<=0)return;const add=Math.round(got*FEAT_BONUS);S.coins+=add;
  const g=document.getElementById('game');const box=g&&[...g.querySelectorAll('.gstart')].pop();const c=box&&box.querySelector('#gcoin');
  if(c){const line=c.closest('div');line.insertAdjacentHTML('afterend',`<div style="font-size:14px;font-weight:800;color:#ff8a00">⭐ 今日推薦加成 +${add} 💰</div>`)}
  const ok=box&&box.querySelector('#gok');if(ok){const f=ok.onclick;ok.onclick=function(){f&&f.apply(this,arguments);setTimeout(()=>floatText(`+${add} 💰 推薦加成`),500)}}}
 mgFinish=function(){const before=S.coins;const r=_fin.apply(this,arguments);if(PR)pracBox();else featBonus(before);return r};
 gEnd=function(){const before=S.coins;const r=_gEnd.apply(this,arguments);if(PR)pracBox();else featBonus(before);return r};
 playMG=function(id){window._mgFeatNow=id;if(S.gameToday>=MGLIM){
   modal(`<h3>🎯 練習模式</h3><p>今天的 ${MGLIM} 次獎勵已經玩完了。</p><p style="font-size:13px;color:#a08670">還想玩的話可以用練習模式：不拿金幣和道具、不消耗精力，但可以刷新個人最佳紀錄。</p><div class="mbtns"><button class="btn" onclick="closeModal();mgPractice('${id}')">開始練習</button><button class="btn gray" onclick="openGames()">回小遊戲場</button></div>`);return}
  return _play(id)};
 openGames=function(){
  const p=pet();if(p.sick)return toast(`${p.name} 生病了，先帶去看獸醫吧 🏥`);
  const fid=featId(),left=MGLIM-S.gameToday,L=[...MG].sort((a,b)=>(b.id===fid)-(a.id===fid));
  modal(`<h3>🎮 小遊戲場</h3><p style="font-size:13px;color:#a08670">${left>0?`今天還能玩 ${left}/${MGLIM} 次・陪 ${esc(p.name)} 玩`:`今天的獎勵次數用完了，還可以玩 🎯 練習模式刷新紀錄`}</p>${L.map(g=>{const f=g.id===fid;return `<div class="row" onclick="playMG('${g.id}')" style="cursor:pointer${f?';background:linear-gradient(90deg,#fff3c4,#fff);border-color:#ffb020':''}"><span class="re">${g.e}</span><span class="rt"><b>${g.n}${f?' <span style="font-size:10px;background:#ff9a00;color:#fff;border-radius:8px;padding:0 5px">⭐ 今日推薦 金幣×1.5</span>':''}${g.nw&&!(S.best&&S.best[g.id])?' <span style="font-size:10px;background:#ff5c9e;color:#fff;border-radius:8px;padding:0 5px">NEW</span>':''}${S.best&&S.best[g.id]?` <span style="font-size:11px;color:#8a5cff">🏆 最佳 ${S.best[g.id]}</span>`:''}</b><small>${g.d}</small></span><button class="btn">${left>0?'玩':'練習'}</button></div>`}).join('')}<div class="mbtns"><button class="btn gray" onclick="closeModal()">關閉</button></div>`)};
})();
</script>

<script>
(function(){

const btn=document.getElementById('cloudBtn'),box=document.getElementById('cloudBox');
const setBtn=t=>btn.textContent=t;
setInterval(()=>{try{const nav=document.getElementById('nav'),m=document.getElementById('modal');
 const busy=document.getElementById('game')||(m&&!m.classList.contains('hidden'));btn.classList.toggle('hide',!!busy);
 if(nav){const r=nav.getBoundingClientRect();if(r.height>0&&r.top<innerHeight){btn.style.bottom=Math.max(8,innerHeight-r.top+6)+'px'}else btn.style.bottom='8px'}}catch(e){}},400);

firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore();
let ref=null,timer=null,ready=false;
function docFor(u){return db.collection('saves').doc(u.uid)}
window.cloudSave=function(){if(!ref||!ready)return;clearTimeout(timer);timer=setTimeout(()=>{
  ref.set({data:JSON.stringify(S),savedAt:S.savedAt||Date.now()}).then(()=>setBtn(label())).catch(()=>setBtn('☁️ 存檔失敗，稍後重試'))},1500)};
function label(){const u=auth.currentUser;return u&&!u.isAnonymous?'☁️ 已同步':'☁️ 綁定 Google 保存進度'}
async function sync(u){
  ref=docFor(u);
  try{const d=await ref.get();
    if(d.exists){const c=d.data();const pc=sessionStorage.getItem('preferCloud');sessionStorage.removeItem('preferCloud');if(((c.savedAt||0)>(S.savedAt||0)||pc)&&!sessionStorage.getItem('cloudLoaded')){
      localStorage.setItem(SKEY,c.data);sessionStorage.setItem('cloudLoaded','1');location.reload();return}}

}
auth.getRedirectResult().catch(e=>{if(e.code==='auth/credential-already-in-use'&&e.credential){sessionStorage.removeItem('cloudLoaded');sessionStorage.setItem('preferCloud','1');auth.signInWithCredential(e.credential)}});
auth.onAuthStateChanged(u=>{if(u){window.__fbResolve&&window.__fbResolve({auth,db});sync(u)}else auth.signInAnonymously().catch(()=>setBtn('☁️ 只存在本機'))});
function show(msg,acts){document.getElementById('cloudMsg').innerHTML=msg;const a=document.getElementById('cloudAct');a.innerHTML='';
  acts.forEach(([t,f,c])=>{const b=document.createElement('button');b.textContent=t;b.style.background=c||'#eee';b.onclick=f;a.appendChild(b)});box.style.display='flex'}
const close=()=>box.style.display='none';
async function google(){close();if(window.pawInApp&&pawInApp()){pawOpenExternal(true);return}const p=new firebase.auth.GoogleAuthProvider();const u=auth.currentUser;

  catch(e){if(e.code==='auth/credential-already-in-use'&&e.credential){sessionStorage.removeItem('cloudLoaded');sessionStorage.setItem('preferCloud','1');ready=false;await auth.signInWithCredential(e.credential)}
    else if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{const u2=auth.currentUser;if(u2&&u2.isAnonymous)await u2.linkWithRedirect(p);else await auth.signInWithRedirect(p)}catch(x){show('登入失敗：'+x.code,[['關閉',close]])}}

async function mkCode(){try{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let k='';const r=crypto.getRandomValues(new Uint8Array(8));r.forEach(x=>k+=A[x%A.length]);
  await db.collection('transfers').doc(k).set({data:JSON.stringify(S),savedAt:Date.now(),exp:Date.now()+86400000});

async function useCode(){const k=(document.getElementById('xcode').value||'').trim().toUpperCase();if(!/^[A-Z0-9]{8}$/.test(k))return;try{const ref2=db.collection('transfers').doc(k);const d=await ref2.get();

})();

<script>
