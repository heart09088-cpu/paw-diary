<script>
/* 網頁版：用 Firebase 取代 Claude 專用的 db/user 功能 */
(function(){if(window.claude)return;let res;window.__fb=new Promise(r=>res=r);window.__fbResolve=res;
const wrapSnap=s=>({docs:s.docs.map(d=>({id:d.id,exists:d.exists,data:()=>d.data()}))});
window.claude={use:async k=>{if(k==='sample')return null;const fb=await Promise.race([window.__fb,new Promise(r=>setTimeout(()=>r(null),15000))]);if(!fb)return null;
 if(k==='user')return{id:async()=>fb.auth.currentUser&&fb.auth.currentUser.uid,can:async()=>true};
 if(k==='db')return{collection:n=>({onSnapshot:(cb,er)=>fb.db.collection(n).onSnapshot(s=>cb(wrapSnap(s)),er)}),doc:p=>({set:d=>fb.db.doc(p).set(d)})};
 return null}};
try{const r=new URLSearchParams(location.search).get('ref');if(r&&/^[A-Za-z0-9]{10,64}$/.test(r))sessionStorage.setItem('pawRef',r)}catch(e){}
})();
</script>

<style>/* 小遊戲共用樣式：插畫背景、倒數、點擊特效、星星（11/22 補回） */
#game{background:var(--gbg,linear-gradient(#bfe6ff,#fff4e8))}
#game[data-g=catch]{--gbg:linear-gradient(#aee0ff,#fff3dc 70%,#ffe2b8)}
#game[data-g=fly]{--gbg:linear-gradient(#bdf0ff,#e9ffd9 65%,#bfe8a0)}
#game[data-g=race]{--gbg:linear-gradient(#9fdcff,#dff7c8 55%,#a8dc84)}
#game[data-g=dig]{--gbg:linear-gradient(#ffe7b8,#e8c08a 60%,#c99a62)}
#game[data-g=mem]{--gbg:linear-gradient(#ffe0ef,#fff2f8)}
#game[data-g=shell]{--gbg:linear-gradient(#ffeccf,#fff7ec)}
#game[data-g=beat]{--gbg:linear-gradient(#e7dcff,#fff0f7)}
#game[data-g=jump]{--gbg:linear-gradient(#9fdcff,#e8f8ff 60%,#bfe8a0)}
#game[data-g=bath]{--gbg:linear-gradient(#d4f1ff,#f3fbff)}
#game[data-g=shop]{--gbg:linear-gradient(#fff0d8,#ffe2c2)}
#game[data-g=stack]{--gbg:linear-gradient(#ffd6e8,#fff3e0)}
#game[data-g=fish]{--gbg:linear-gradient(#bfe6ff,#7cc7ef)}
#game[data-g=disc]{--gbg:linear-gradient(#9fdcff,#dff7c8 55%,#a8dc84)}
#game::before{content:'';position:absolute;inset:0 -50% auto -50%;height:46%;pointer-events:none;opacity:.55;
 background:radial-gradient(60px 26px at 12% 30%,#fff 60%,#0000 62%),radial-gradient(80px 30px at 38% 18%,#fff 60%,#0000 62%),radial-gradient(54px 22px at 66% 36%,#fff 60%,#0000 62%),radial-gradient(70px 26px at 88% 14%,#fff 60%,#0000 62%);
 animation:gcloud 40s linear infinite;will-change:transform}
#game[data-g=beat]::before,#game[data-g=dig]::before,#game[data-g=mem]::before,#game[data-g=shop]::before{display:none}
@keyframes gcloud{to{transform:translate3d(33%,0,0)}}
#game .ghd{position:relative;z-index:6;padding:10px 12px 14px;gap:8px;align-items:center;font-size:17px}
#game .ghd>span{background:#fffc;border-radius:999px;padding:5px 14px;box-shadow:0 2px 0 #0001;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
#game .ghd>span:empty{visibility:hidden}
#gs.bump{animation:gbump .28s}
@keyframes gbump{40%{transform:scale(1.22)}}
#gt.hurry{background:#ff5c6c;color:#fff;animation:ghurry 1s infinite}
@keyframes ghurry{50%{transform:scale(1.1)}}
#gbar{position:absolute;left:12px;right:12px;bottom:4px;height:6px;border-radius:9px;background:#0000001a;overflow:hidden}
#gbar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#ffb020,#ff6b8a);transform-origin:left;will-change:transform;transition:transform .25s linear}
#game .ghd{justify-content:flex-start}#game #gt{margin-left:auto}#gquit{flex:none;border:none;background:#fff9;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;z-index:7;margin-left:4px}
#garea{contain:layout paint}
.gfx{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:4;will-change:transform,opacity;animation:gfx .5s ease-out forwards}
@keyframes gfx{to{transform:translate3d(var(--dx),var(--dy),0) scale(.2);opacity:0}}
.gring{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border:3px solid #fff;border-radius:50%;pointer-events:none;z-index:4;animation:gring .35s ease-out forwards}
@keyframes gring{to{transform:scale(3.2);opacity:0}}
.gcd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;pointer-events:none}
.gcd b{font-size:96px;font-weight:900;color:#fff;-webkit-text-stroke:3px #ee5a3c;text-shadow:0 6px 0 #ee5a3c55;animation:gcd .7s ease-out forwards}
@keyframes gcd{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
.gconf{position:absolute;top:-20px;width:10px;height:14px;z-index:6;opacity:.9;pointer-events:none;will-change:transform;animation:gconf linear forwards}
@keyframes gconf{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r))}}
.gstars{font-size:34px;letter-spacing:4px}.gstars span{display:inline-block;opacity:.25;transform:scale(.6);transition:.3s}.gstars span.on{opacity:1;transform:scale(1)}
#garea>.gstart{z-index:5}

/* 小遊戲插畫背景（ComfyUI 生成，進遊戲才載入） */
#game[data-g=catch]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_catch.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=fly]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_fly.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=race]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_race.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=dig]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_dig.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=mem]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_mem.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=shell]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_shell.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=beat]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_beat.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=jump]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_jump.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=bath]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_bath.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=shop]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_shop.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=stack]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_stack.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=fish]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_fish.webp) center/cover no-repeat,var(--gbg)}
#game[data-g=disc]{background:linear-gradient(#ffffff38,#ffffff38),url(a/mg_race.webp) center/cover no-repeat,var(--gbg)}
#game[data-g]::before{display:none}
#game .gi{text-shadow:0 4px 6px #0000004d}
#game .gstart{background:radial-gradient(ellipse at center,#fffaf2f0 0 55%,#fffaf2b0 80%,#fffaf200)}
#game .track{background:#bfe3a8d9;box-shadow:0 6px 18px #0002}
#game .bt{background:linear-gradient(#fff7fbd9,#e9f3ffd9)}
#game[data-g=catch] #garea::after{content:'';position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(#0000,#fff4dc99);pointer-events:none}
@media (prefers-reduced-motion:reduce){#game::before,.gfx,.gring,.gconf{animation:none;display:none}}
</style>

<title>毛孩零用錢日記</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff4e8;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#4a3426;user-select:none;-webkit-user-select:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:92px}
button{font-family:inherit;cursor:pointer;border:none}
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px 12px;background:#fff4e8ee;backdrop-filter:blur(6px)}
.hd .day{font-weight:700;font-size:15px}
.hd .coin{margin-left:auto;background:#ffd36b;padding:6px 10px;border-radius:20px;font-weight:800;font-size:15px;box-shadow:0 2px 0 #e0a92e}
.hd .sleep{background:#4b4a7a;color:#fff;padding:7px 12px;border-radius:20px;font-size:14px;font-weight:700}
main{padding:0 12px}
.petsw{display:flex;gap:8px;margin:4px 0 10px}
.chip{flex:1;padding:9px;border-radius:14px;background:#fff;font-size:15px;font-weight:700;color:#8a6a55;box-shadow:0 2px 0 #ecd6c2}
.chip.on{background:#ff8a5b;color:#fff;box-shadow:0 2px 0 #d9663a}
.room{position:relative;height:350px;border-radius:22px;overflow:hidden;
 background:linear-gradient(#ffe6cf 0 60%,transparent 60%),repeating-linear-gradient(90deg,#e2b88c 0 46px,#d9ab7c 46px 48px);box-shadow:inset 0 -6px 0 #c99a6a}
.win{position:absolute;left:38%;top:7%;width:24%;height:30%;background:linear-gradient(#bfe6ff,#e8f6ff);border:6px solid #fff;border-radius:8px;box-shadow:0 2px 0 #e9cdb4}
.win:before,.win:after{content:"";position:absolute;background:#fff}
.win:before{left:50%;top:0;bottom:0;width:4px;margin-left:-2px}
.win:after{top:50%;left:0;right:0;height:4px;margin-top:-2px}
.deco{position:absolute;line-height:1;filter:drop-shadow(0 3px 2px #0002)}
.rug{position:absolute;left:18%;right:18%;bottom:5%;height:16%;border-radius:50%;background:repeating-radial-gradient(#ff9fb0 0 8px,#ffc2cd 8px 16px);opacity:.9}
.lights{position:absolute;left:0;right:0;top:2%;text-align:center;font-size:16px;letter-spacing:6px;animation:tw 1.6s infinite alternate}
@keyframes tw{to{opacity:.55}}
.petwrap{position:absolute;left:50%;bottom:1%;width:212px;height:310px;margin-left:-106px}
.pbody{position:absolute;inset:0;animation:breathe 2.8s ease-in-out infinite;transform-origin:50% 100%}
.petwrap.jump .pbody{animation:jump .55s ease}
.pimg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 6px #0003);transition:filter .4s}
.pimg.sad{filter:drop-shadow(0 8px 6px #0003) grayscale(.45) brightness(.92)}
.pimg.dirty{filter:drop-shadow(0 8px 6px #0003) sepia(.55) brightness(.82) contrast(1.05)}
.flies{position:absolute;left:10%;top:30%;font-size:18px;animation:bob 1s infinite}
.shadow{position:absolute;left:22%;right:22%;bottom:-1%;height:16px;border-radius:50%;background:#0002;filter:blur(3px)}
.adopt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.adopt button{background:#fff6ee;border-radius:14px;padding:6px 4px;font-size:12.5px;font-weight:700;color:#4a3426;display:flex;flex-direction:column;align-items:center}
.adopt button img{width:100%;height:96px;object-fit:contain}
.adopt button.on{outline:3px solid #ee5a3c;background:#fff1ea}
.adopt button[disabled]{opacity:.35}
.chip img{width:22px;height:22px;object-fit:cover;object-position:50% 12%;border-radius:50%;vertical-align:middle;margin-right:4px;background:#fff6ee}
.petsw{overflow-x:auto;scrollbar-width:none}.petsw .chip{flex:1 0 auto;min-width:30%}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
@keyframes jump{30%{transform:translateY(-28px) scale(.96,1.05)}60%{transform:translateY(0) scale(1.06,.94)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.2s ease-in-out infinite}
.dog .tail{animation-duration:.45s}
@keyframes wag{50%{transform:rotate(14deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.acc{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none;filter:drop-shadow(0 2px 2px #0003)}
.bub{position:absolute;right:-6px;top:4px;background:#fff;border-radius:16px;padding:4px 8px;font-size:20px;box-shadow:0 2px 6px #0002;animation:bob 1.4s infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:800;font-size:20px;color:#e2552b;white-space:nowrap;text-shadow:0 2px 0 #fff,0 -1px 0 #fff;animation:up 1.3s ease-out forwards;pointer-events:none;z-index:5}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
.house{position:relative;z-index:1;isolation:isolate;height:310px;border-radius:20px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;box-shadow:0 3px 0 #e6cdb6;scrollbar-width:none;background:#ddd}
.house::-webkit-scrollbar{display:none}
.hin{position:relative;height:100%;display:flex}
.rm{flex:none;height:100%;background-size:cover;background-position:center bottom;position:relative;scroll-snap-align:start}
.rm .rl{position:absolute;left:8px;top:8px;background:#0007;color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;z-index:200;cursor:pointer}
.lockrm{flex:none;height:100%;position:relative;scroll-snap-align:start;background-size:cover;background-position:center}
.lockrm .lk{position:absolute;inset:0;background:#2b1d12aa;backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:8px;font-weight:700;text-align:center}
.lockrm .lk div{font-size:40px}
.dimg{position:absolute;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 4px 3px #0004)}
.pw{position:absolute;transform:translateX(-50%);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.pw.t-purr .bw{animation:tPurr .09s linear 12}
@keyframes tPurr{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}75%{transform:translate(1px,-1px)}}
.pw.t-flip .bw{animation:tFlip 1.4s ease}
@keyframes tFlip{0%{transform:none}30%,70%{transform:rotate(-18deg) translateY(6px) scaleY(.9)}100%{transform:none}}
.stc{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:#fff;border:2px solid #3a2a4a;border-radius:12px;padding:0 7px;font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none;z-index:9}
.albg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:56vh;overflow:auto;padding:2px}
.alc{background:#fff;border-radius:6px;padding:6px 6px 8px;box-shadow:0 2px 6px #0002;transform:rotate(var(--r));text-align:center}
.alc .alp{background:linear-gradient(#cfeaff,#fff3e2);border-radius:4px;height:72px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.alc .ale{position:absolute;right:4px;top:2px;font-size:20px}
.alc .alt{font-size:12px;font-weight:700;margin-top:5px;line-height:1.35}.alc small{color:#a08670;font-size:10.5px}
.pw .bw{position:relative}
.pw.jump .bw{animation:jump .55s ease}
.pw .flipper{position:relative}
.pw .flipper.l{transform:scaleX(-1)}
.spr{background-repeat:no-repeat;transition:filter .4s}
.spr.walk{animation:walk var(--d) steps(8) infinite}
@keyframes walk{from{background-position:0 0}to{background-position:calc(var(--w) * -8) 0}}
.spr.dirty{filter:sepia(.55) brightness(.82)}.spr.sad{filter:grayscale(.45) brightness(.92)}
.pw .sh{position:absolute;left:12%;right:12%;bottom:-5px;height:12px;border-radius:50%;background:#0003;filter:blur(3px)}
.pw .tg{position:absolute;left:50%;transform:translateX(-50%);top:-20px;white-space:nowrap;font-size:11px;font-weight:700;background:#fffd;color:#4a3426;padding:1px 7px;border-radius:9px;box-shadow:0 1px 3px #0002}
.pw.sel .tg{background:#ee5a3c;color:#fff}
.pw .bb{position:absolute;left:50%;top:-46px;transform:translateX(-50%);font-size:18px;background:#fff;border-radius:12px;padding:1px 6px;box-shadow:0 2px 5px #0002;animation:bob 1.4s infinite}
.hhint{font-size:11.5px;color:#a08670;text-align:center;margin:5px 0 0}
.th{display:inline-block;background-repeat:no-repeat;vertical-align:middle}
.stg{font-size:12px;background:#fff1ea;color:#ee5a3c;border-radius:8px;padding:1px 7px;margin-left:6px;font-weight:700}
.tint{position:absolute;inset:0;pointer-events:none;z-index:150;transition:background 2s}
.stars{position:absolute;left:0;right:0;top:4%;text-align:center;color:#fff8;font-size:14px;letter-spacing:10px;z-index:151;pointer-events:none;animation:tw 2s infinite alternate}
.rain{position:absolute;inset:0;pointer-events:none;z-index:160;background-image:repeating-linear-gradient(105deg,transparent 0 22px,rgba(210,225,255,.45) 22px 23px);background-size:120px 120px;animation:rainf .45s linear infinite}
@keyframes rainf{to{background-position:-30px 120px}}
.pw.acting .acc{display:none}
.pw.nom .bw{animation:nom .45s ease-in-out infinite}
@keyframes nom{50%{transform:translateY(4px) rotate(3deg)}}
.pw.sleeping .bw::after{content:'💤';position:absolute;right:-6px;top:-8px;font-size:18px;animation:bob 1.6s infinite}
.pw.sleeping .spr:not(.walk){filter:brightness(.92)}
.gshake{animation:gshake .25s infinite}@keyframes gshake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.gpopin{animation:gpop .5s cubic-bezier(.3,1.6,.5,1)}@keyframes gpop{from{transform:scale(.2)}}
/* 2026-11-17 觸摸部位反應＋待機小動作 */
.pw.t-head .bw{animation:tHead .6s ease}@keyframes tHead{30%{transform:scale(1.04,.93)}60%{transform:scale(.98,1.03)}}
.pw.t-chin .bw{animation:tChin .9s ease}@keyframes tChin{25%,75%{transform:rotate(-5deg) translateY(-2px)}50%{transform:rotate(5deg) translateY(-2px)}}
.pw.t-belly .bw{animation:tBelly .7s ease}@keyframes tBelly{20%{transform:translateY(-10px) scale(.95,1.06)}45%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}
.pw.t-back .bw{animation:tBack .8s ease}@keyframes tBack{40%{transform:scale(1.05,.95)}}
.pw.t-tail .bw{animation:tTail .8s ease}@keyframes tTail{50%{transform:scaleX(-1) translateY(-6px)}}
.pw.t-no .bw{animation:tNo .45s ease}@keyframes tNo{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pw.i-stretch .bw{animation:iStretch 1.8s ease-in-out}@keyframes iStretch{35%,65%{transform:scale(1.1,.86)}}
.pw.i-yawn .bw{animation:iYawn 1.6s ease}@keyframes iYawn{30%,60%{transform:rotate(-4deg) scale(1,1.04)}}
.pw.i-groom .bw{animation:iGroom .5s ease-in-out 3}@keyframes iGroom{50%{transform:translateY(3px) rotate(4deg)}}
.pw.i-sniff .bw{animation:iSniff .35s ease-in-out 4}@keyframes iSniff{50%{transform:translateX(4px) translateY(2px)}}
.pw.i-scratch .bw{animation:iScratch .12s linear 8}@keyframes iScratch{50%{transform:rotate(2deg) translateY(1px)}}
.pw.i-look .bw{animation:iLook 1.4s ease}@keyframes iLook{30%,70%{transform:translateY(-4px) scale(1.02)}}
.thp{position:absolute;font-size:15px;pointer-events:none;z-index:7;animation:thp 1s ease-out forwards}
@keyframes thp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-46px) scale(.9)}}
.spotg{background:#ffe8f2;color:#c2417a}
.track{position:relative;margin:30px 10px 10px;background:#bfe3a8;border-radius:14px;padding:6px 0;border:3px solid #fff}
.lane{position:relative;height:68px;border-bottom:2px dashed #fff8}.lane:last-child{border:none}
.lane.me{background:#fff3}.lname{position:absolute;left:6px;top:2px;font-size:11px;font-weight:800;color:#3d6b2b;z-index:2}

.ab{background:#fff;border-radius:16px;padding:10px 4px 8px;box-shadow:0 3px 0 #ecd2bb;display:flex;flex-direction:column;align-items:center;gap:2px;color:#4a3426}
.ab:active{transform:translateY(2px);box-shadow:0 1px 0 #ecd2bb}
.ab .ae{font-size:28px}
.ab .an{font-size:14px;font-weight:700}
.ab .ac{font-size:11px;color:#a08670}
.ab.off{opacity:.45}
.tip{font-size:12.5px;color:#9b7f69;text-align:center;margin:8px 0 14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;display:flex;justify-content:center;box-shadow:0 -2px 10px #0001;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;padding:9px 0 10px;font-size:12px;color:#a08670;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span{font-size:24px}
nav button.on{color:#ee5a3c}
nav .badge{position:absolute;top:4px;left:56%;background:#ee5a3c;color:#fff;font-size:10px;border-radius:10px;padding:1px 6px}
/* shop */
.banner{border-radius:20px;padding:14px 16px;color:#fff;background:linear-gradient(120deg,#ff6f3c,#ff3d5a);box-shadow:0 3px 0 #c9324a;margin:4px 0 10px}
.banner h2{margin:0;font-size:21px}
.banner p{margin:4px 0 0;font-size:12.5px;opacity:.95}
.sale{display:flex;align-items:center;gap:12px;background:#fff;border:2px dashed #ff5a4a;border-radius:16px;padding:10px 12px;margin-bottom:10px}
.sale .se{font-size:42px}
.sale .st{flex:1}
.sale .tag{background:#ff3d5a;color:#fff;font-size:11px;padding:2px 7px;border-radius:8px;font-weight:700}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:7px 12px;border-radius:16px;background:#fff;font-size:13.5px;font-weight:700;color:#8a6a55}
.cats button.on{background:#ee5a3c;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.prod{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 0 #f0dcc8;display:flex;flex-direction:column}
.prod .pe{font-size:44px;text-align:center;background:#fff6ee;border-radius:12px;padding:8px 0;position:relative}
.prod .pe .tag{position:absolute;left:6px;top:6px;background:#ff3d5a;color:#fff;font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700}
.prod .pn{font-weight:800;font-size:14.5px;margin-top:6px}
.prod .pd{font-size:11.5px;color:#9b7f69;margin:3px 0;flex:1;line-height:1.35}
.prod .pp{color:#ee5a3c;font-weight:800;font-size:16px}
.prod .pp s{color:#bbb;font-size:12px;font-weight:400;margin-left:4px}
.prod .sold{font-size:10.5px;color:#b59c88;margin:2px 0 6px}
.btn{background:#ee5a3c;color:#fff;border-radius:12px;padding:8px;font-size:13.5px;font-weight:800}
.btn.gray{background:#e9dccf;color:#9b7f69}
.btn.ghost{background:#fff1ea;color:#ee5a3c}
.fab{position:fixed;right:max(14px,calc(50% - 226px));bottom:84px;z-index:25;background:#ee5a3c;color:#fff;border-radius:30px;padding:12px 16px;font-size:16px;font-weight:800;box-shadow:0 4px 12px #ee5a3c66}
.order{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13px;border-left:5px solid #45b37a}
/* bag */
.sec{font-weight:800;margin:14px 2px 6px;font-size:15px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px 11px;margin-bottom:7px;box-shadow:0 2px 0 #f0dcc8}
.row .re{font-size:32px}
.row .rt{flex:1;font-size:13.5px}
.row .rt small{display:block;color:#a08670;font-size:11.5px}
.row .btn{padding:7px 10px;font-size:12.5px;white-space:nowrap}
.empty{text-align:center;color:#b59c88;font-size:13px;padding:10px}
/* modal */
#modal{position:fixed;inset:0;z-index:500;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px}
#modal.hidden{display:none}
.mbox{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:380px;max-height:84vh;overflow:auto;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mbox h3{margin:0 0 8px;font-size:19px}
.mbox p{font-size:14px;line-height:1.6;margin:6px 0}
.mbtns{display:flex;gap:8px;margin-top:12px}
.mbtns .btn{flex:1;padding:11px;font-size:15px}
.mbox input{width:100%;padding:11px;border-radius:12px;border:2px solid #f0dcc8;font-size:16px;font-family:inherit}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f4e7da;font-size:14px}
.ci .q{display:flex;align-items:center;gap:6px}
.ci .q button{width:28px;height:28px;border-radius:50%;background:#fff1ea;color:#ee5a3c;font-weight:800;font-size:16px}
.ship{display:flex;gap:6px;margin:10px 0}
.ship button{flex:1;padding:9px 4px;border-radius:12px;background:#f7efe7;font-size:12.5px;color:#7a5f4b;line-height:1.4}
.ship button.on{background:#fff1ea;outline:2px solid #ee5a3c;color:#ee5a3c;font-weight:700}
.sum{font-size:13.5px;line-height:1.8}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:17px;font-weight:800;color:#ee5a3c}
#toasts{position:fixed;left:0;right:0;top:64px;z-index:510;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#4a3426ee;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;max-width:88%;text-align:center;animation:pop .25s ease}
#night{position:fixed;inset:0;z-index:520;background:#1d1b3a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:700;animation:fade 1.6s ease forwards}
#night div{font-size:70px}
@keyframes fade{0%{opacity:0}25%,75%{opacity:1}100%{opacity:0}}
/* game */
#game{position:fixed;inset:0;z-index:530;background:linear-gradient(#bfe6ff,#fff4e8);display:flex;flex-direction:column}
.ghd{display:flex;justify-content:space-between;padding:14px 18px;font-size:20px;font-weight:800}
#garea{position:relative;flex:1;overflow:hidden;touch-action:none}
.gi{position:absolute;top:0;font-size:46px;line-height:1;padding:6px;will-change:transform}
.gpop{position:absolute;font-weight:900;font-size:22px;animation:up .8s forwards;pointer-events:none}
.gstart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;font-size:15px}
.gstart .btn{padding:14px 34px;font-size:19px}
/* ===== 介面風格 B：糖果果凍 ===== */
:root{--ink:#3B2A55;--sky:#8ED8FF;--yel:#FFD84D;--pink:#FF5C9E;--pk2:#FF8CC0;--mint:#7BE3B5;--blu:#6FCBFF;--lav:#C4A8FF;--org:#FFB36B}
body{background-color:var(--sky);background-image:radial-gradient(#B8E7FF 18%,transparent 19%);background-size:34px 34px;background-attachment:fixed;font-family:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);font-weight:500}
#app{padding-bottom:104px}
.hd{background:#8ED8FFe6}
.hd .day{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 10px;box-shadow:0 3px 0 var(--ink);font-weight:900}
.hd .coin{background:var(--yel);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-weight:900}
.hd .sleep{background:#5B57C9!important;color:#fff!important;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)!important}
.chip{background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-weight:700}
.chip.on{background:var(--yel);color:var(--ink);box-shadow:0 3px 0 var(--ink);font-weight:900}
.house,.room{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:24px}
.card,.row,.prod,.ach,.dex,.order,.sale{background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:22px}
.order{border-left:8px solid #45b37a}
.sale{border-style:dashed}
.nameRow b{font-weight:900}
.lv,.stg{background:var(--mint);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;padding:1px 8px;font-weight:900}
.bar .tr{height:16px;background:#F2ECFF;border:3px solid var(--ink);border-radius:999px}
.bar .fi{border-radius:0}
.bar .num{color:var(--ink)}
.big{border:3px solid var(--ink)!important;box-shadow:0 5px 0 var(--ink)!important;border-radius:20px;font-weight:900}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)!important}
.gold{background:var(--yel)!important;color:var(--ink)!important}
.actions{gap:10px}
.ab{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:22px;color:var(--ink)}
.ab:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.ab:nth-child(6n+1){background:var(--org)}.ab:nth-child(6n+2){background:var(--pk2)}.ab:nth-child(6n+3){background:var(--blu)}
.ab:nth-child(6n+4){background:var(--mint)}.ab:nth-child(6n+5){background:var(--lav)}.ab:nth-child(6n){background:var(--yel)}
.ab .an{font-weight:900}.ab .ac{color:#4d3d68}
.tip,.hhint{color:#24486b}
.btn{background:var(--pink);color:#fff;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-weight:900}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.gray{background:#ECE6F7;color:#7d7296;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink)}
nav{left:10px;right:10px;bottom:10px;background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:0 5px 0 var(--ink);padding-bottom:0;max-width:480px;margin:0 auto}
nav button{color:var(--ink);padding:7px 0 8px}
nav button.on{color:var(--ink);font-weight:900}
nav button.on span{background:var(--yel);border:3px solid var(--ink);border-radius:14px;padding:0 8px}
nav .badge{background:var(--pink);border:2px solid var(--ink)}
.banner{background:var(--pink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.cats button{background:#fff;color:var(--ink);border:3px solid var(--ink)}
.cats button.on{background:var(--yel);color:var(--ink);font-weight:900}
.prod .pe{background:#FFF4C2;border:2.5px solid var(--ink)}
.prod .pp{color:#d0306f}
.fab{background:var(--pink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);bottom:96px}
.mbox{border:3px solid var(--ink);box-shadow:0 7px 0 var(--ink);border-radius:26px;color:var(--ink)}
.mbox input{border:3px solid var(--ink)}
.ship button{border:2.5px solid var(--ink);background:#fff}
.ship button.on{background:var(--yel);outline:none;color:var(--ink)}
.sum .tot{color:#d0306f}
.toast{background:#3B2A55f0;border:3px solid #fff}
.pw .tg{border:2px solid var(--ink);box-shadow:none}
.pw.sel .tg{background:var(--yel);color:var(--ink)}
.say{border:2.5px solid var(--ink);color:var(--ink)}
.adopt button{border:3px solid var(--ink);background:#fff}
.adopt button.on{outline:none;background:var(--yel)}
.dcell{border:3px solid var(--ink)}
.hd{gap:5px;padding:10px 8px}.hd .day,.hd .coin,.hd .sleep{white-space:nowrap}.hd .day{font-size:13.5px;padding:3px 8px}.hd .coin{padding:5px 9px;font-size:14px}.hd .sleep{padding:6px 9px;font-size:13px}
.empty{color:#24486b}.sec{color:var(--ink);font-weight:900}
.rnm{margin:0 6px;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:2px 8px;font-size:12.5px;font-weight:900;box-shadow:0 2px 0 var(--ink);vertical-align:middle}
.avb{background:none;padding:0;border-radius:50%;flex:none;display:flex;box-shadow:0 3px 0 var(--ink);border:0}.avb img,.avb span{display:block}
@media(max-width:420px){.hd .slt{display:none}.hd{gap:4px}}

/* 領養中心：一頁看完，確認鍵固定在下方 */
.mbox.adm{max-width:440px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);padding:12px 10px 0;display:flex;flex-direction:column;overflow:hidden}
.mbox.adm .adbody{overflow-y:auto;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
.mbox.adm h3{margin:0 0 2px;font-size:17px}.mbox.adm p{margin:2px 0 4px;line-height:1.45}
.mbox.adm .sec{margin:6px 0 0}
.mbox.adm .adopt{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:6px}
.mbox.adm .adtabs{display:flex;gap:6px;margin-top:6px}.mbox.adm .adtabs button{flex:1;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:7px 4px;font-weight:900;font-size:14px;color:var(--ink)}.mbox.adm .adtabs button.on{background:var(--yel)}
.mbox.adm .adopt button{padding:3px 1px 4px;font-size:10.5px;min-width:0;overflow:hidden;border-radius:12px;line-height:1.25}
.mbox.adm .adopt button small{font-size:10px}
.mbox.adm .adt{height:46px;width:100%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.mbox.adm .mbtns{flex:0 0 auto;margin:0 -10px;padding:10px 12px 12px;background:#fff;border-top:2px dashed #e6d8f0}
@media(max-height:640px){.mbox.adm .adt{height:40px}}

/* ===== 11/22 果凍光澤質感：高光、厚度、陰影統一 ===== */
:root{--hi:inset 0 3px 0 #ffffff8c;--lo:inset 0 -4px 0 #3b2a551a}
.lv:empty,.stg:empty{display:none}
.btn{box-shadow:0 3px 0 var(--ink),inset 0 2px 0 #ffffff8c,inset 0 -3px 0 #3b2a5526;text-shadow:0 1px 0 #3b2a5533}
.btn:active{box-shadow:0 1px 0 var(--ink),inset 0 2px 0 #ffffff6e,inset 0 -1px 0 #3b2a5526}
.btn.gray{box-shadow:inset 0 2px 0 #ffffffb0,inset 0 -2px 0 #3b2a5512;text-shadow:none}
.btn.ghost{text-shadow:none;box-shadow:0 3px 0 var(--ink),inset 0 -3px 0 #3b2a5512}
.ab{box-shadow:0 5px 0 var(--ink),inset 0 4px 0 #ffffff80,inset 0 -6px 0 #3b2a551c}
.ab:nth-child(n){background-image:radial-gradient(120% 60% at 50% 0,#ffffff70 0 45%,#fff0 46%)}
.ab:active{box-shadow:0 2px 0 var(--ink),inset 0 3px 0 #ffffff66,inset 0 -3px 0 #3b2a551c}
.ab .ae{filter:drop-shadow(0 3px 0 #3b2a5533);transition:transform .15s}.ab:active .ae{transform:scale(.9)}
.chip{box-shadow:0 3px 0 var(--ink),inset 0 -3px 0 #3b2a5514}
.chip.on{box-shadow:0 3px 0 var(--ink),inset 0 3px 0 #ffffffa0,inset 0 -4px 0 #c9940026}
.hd .coin,.hd .day{box-shadow:0 3px 0 var(--ink),inset 0 2px 0 #ffffffa0,inset 0 -3px 0 #3b2a5520}
.hd .sleep{box-shadow:0 3px 0 var(--ink),inset 0 2px 0 #ffffff55,inset 0 -3px 0 #0000002a!important}
.big{box-shadow:0 5px 0 var(--ink),inset 0 3px 0 #ffffff80,inset 0 -5px 0 #3b2a5522!important;text-shadow:0 1px 0 #ffffff55}
.big:active{box-shadow:0 2px 0 var(--ink),inset 0 3px 0 #ffffff66,inset 0 -2px 0 #3b2a5522!important}
.big.gold{position:relative;overflow:hidden}
.big.gold::after{content:'';position:absolute;top:-10%;bottom:-10%;left:-60%;width:38%;background:linear-gradient(100deg,#fff0,#ffffffb0,#fff0);transform:skewX(-18deg);animation:jshine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes jshine{0%,55%{left:-60%}100%{left:130%}}
.card,.row,.prod,.ach,.dex,.order,.sale{box-shadow:0 5px 0 var(--ink),0 10px 18px #1d5c8a1f,inset 0 -4px 0 #3b2a550d}
.card{background-image:linear-gradient(#fff 0,#fff 70%,#fffaf5 100%)}
.lv,.stg{box-shadow:inset 0 2px 0 #ffffff90,inset 0 -2px 0 #3b2a5518}
.bar .tr{box-shadow:inset 0 2px 3px #3b2a5522}
.bar .fi{box-shadow:inset 0 3px 0 #ffffff70,inset 0 -2px 0 #0000001a}
.cats button{box-shadow:0 3px 0 var(--ink),inset 0 -3px 0 #3b2a5512}
.cats button.on{box-shadow:0 3px 0 var(--ink),inset 0 3px 0 #ffffffa0,inset 0 -3px 0 #c9940026}
.hub button{box-shadow:0 2px 0 #3a2a4a,inset 0 2px 0 #ffffffa0,inset 0 -3px 0 #3b2a5512}
.banner{box-shadow:0 5px 0 var(--ink),0 10px 18px #1d5c8a1f,inset 0 4px 0 #ffffff4d,inset 0 -6px 0 #3b2a5522}
.banner h2{text-shadow:0 2px 0 #3b2a5540}
nav{box-shadow:0 5px 0 var(--ink),0 8px 22px #1d5c8a33}
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#8ed8ff00,#8ed8ffe6 50%,#8ed8ff);z-index:29;pointer-events:none}
.gogrid button{border:3px solid var(--ink)!important;box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 #0000001f!important;position:relative;overflow:hidden}
.gogrid button::after{content:'';position:absolute;left:6%;right:6%;top:3px;height:42%;border-radius:14px 14px 40% 40%;background:linear-gradient(#ffffff70,#fff0);pointer-events:none}
.gogrid button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink),inset 0 -3px 0 #0000001f!important}
nav button.on span{box-shadow:0 2px 0 var(--ink),inset 0 2px 0 #ffffffa0,inset 0 -3px 0 #c9940026}
nav button span{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}nav button.on span{transform:translateY(-2px)}
nav .badge{box-shadow:inset 0 2px 0 #ffffff70}
.mbox{box-shadow:0 7px 0 var(--ink),0 18px 40px #1d2a5a55,inset 0 4px 0 #fff,inset 0 -5px 0 #3b2a550d}
.mbox h3{text-shadow:0 2px 0 #ffd84d66}
.house{box-shadow:0 6px 0 var(--ink),0 12px 22px #1d5c8a26}
.prod .pe{box-shadow:inset 0 3px 0 #ffffffb0,inset 0 -3px 0 #c9940020}
.toast{box-shadow:0 6px 16px #1d2a5a40}
@media (prefers-reduced-motion:reduce){.big.gold::after{animation:none;display:none}}

/* ===== 11/22 小遊戲畫面質感（只動 #game 內的樣式） ===== */
#game .ghd>span{border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink),inset 0 2px 0 #fff,inset 0 -3px 0 #3b2a5514;font-weight:900;color:var(--ink)}
#game #gquit{border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink),inset 0 -3px 0 #3b2a5514;background:#fff;font-weight:900;color:var(--ink)}
#gbar{height:8px;border:2px solid #3b2a5540;bottom:2px}
#gbar i{box-shadow:inset 0 2px 0 #ffffff80}
#game .gstart>.btn{box-shadow:0 5px 0 var(--ink),inset 0 3px 0 #ffffff80,inset 0 -5px 0 #3b2a5526;border-width:3px}
#game .gi{filter:drop-shadow(0 4px 3px #3b2a5540)}
#game .gpop{-webkit-text-stroke:1px #fff;paint-order:stroke;text-shadow:0 2px 0 #fff,0 3px 6px #0003}
/* 賽跑：割草條紋跑道 */
#game .track{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink),0 12px 22px #1d5c8a33;background:repeating-linear-gradient(90deg,#a6dd84 0 28px,#97d274 28px 56px);border-radius:18px;padding:4px 0}
#game .lane{border-bottom:3px solid #ffffffb0}
#game .lane.me{background:linear-gradient(90deg,#ffe9784d,#ffe97826)}
#game .lname{background:#fff;border:2px solid var(--ink);border-radius:9px;padding:0 6px;color:var(--ink);top:4px}
#game .lane.me .lname{background:var(--yel)}
#game .runner .spr{filter:drop-shadow(0 4px 2px #0003)}
#game .finish{width:14px;border:2px solid var(--ink);right:10px}
#game .dash{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink),inset 0 4px 0 #ffffff80,inset 0 -6px 0 #3b2a5526!important;font-size:28px}
#game .dash:not([disabled]){animation:dashGlow 1s ease-in-out infinite}
@keyframes dashGlow{50%{filter:brightness(1.1) drop-shadow(0 0 10px #ff8ab4)}}
#game .dash:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink),inset 0 3px 0 #ffffff80!important}
/* 挖寶藏：土堆 */
#game .dig{gap:10px}
#game .dcell{border:3px solid var(--ink);border-radius:18px 18px 14px 14px;background:radial-gradient(circle at 30% 30%,#7a522f 0 3px,#0000 4px),radial-gradient(circle at 70% 62%,#7a522f 0 3px,#0000 4px),radial-gradient(circle at 45% 78%,#8a6040 0 2px,#0000 3px),radial-gradient(ellipse at 50% 22%,#e2bd90 0,#c69565 55%,#a8784a 100%);box-shadow:0 5px 0 var(--ink),inset 0 4px 0 #ffffff55,inset 0 -6px 0 #5a3a1f40;transition:transform .12s}
#game .dcell:not(.open):active{transform:translateY(3px) scale(.96)}
#game .dcell.open{background:radial-gradient(ellipse at 50% 60%,#fff8ec 0,#f1dcc0 70%,#e2c49c 100%);box-shadow:0 3px 0 var(--ink),inset 0 6px 10px #a8784a55}
/* 零食翻牌：卡背花紋 */
#game .mcell{position:relative;border:3px solid var(--ink);background:radial-gradient(circle,#ffffff40 0 3px,#0000 4px) 0 0/16px 16px,linear-gradient(150deg,#ffa6cb,#c9adff);box-shadow:0 4px 0 var(--ink),inset 0 3px 0 #ffffff80,inset 0 -4px 0 #3b2a5526}
#game .mcell::before{content:'🐾';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;opacity:.55;filter:grayscale(1) brightness(3)}
#game .mcell.up::before,#game .mcell.ok::before{display:none}
#game .mcell.up{background:#fff;box-shadow:0 4px 0 var(--ink),inset 0 0 0 4px #ffe3ef}
#game .mcell.ok{background:#e4fbef;box-shadow:0 4px 0 var(--ink),inset 0 0 0 4px #9edbb8}
/* 毛孩躲哪裡：箱子影子 */
#game .shb::after{content:'';position:absolute;left:12%;right:12%;bottom:-14px;height:14px;border-radius:50%;background:#3b2a5533;filter:blur(2px);z-index:0}
#game .shlid{filter:drop-shadow(0 6px 4px #3b2a5540)}
#game .shmsg{display:table;margin:18px auto 0;background:#fffd;border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:0 3px 0 var(--ink)}
#game .shmsg:empty{display:none}
/* 跳跳毛孩：透明天空＋草地 */
#game .jp{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink),0 12px 22px #1d5c8a33;background:linear-gradient(#bfe6ff59 0,#e8f6ff40 62%,#79c25a 62%,#79c25a 64.5%,#5ea544 64.5%,#5ea544 66%,#c79a68 66%,#b0814f 100%)}
#game .jp .hint{background:#fffd;border:2px solid var(--ink);border-radius:12px;display:table;margin:0 auto;left:0;right:0;padding:2px 12px;color:var(--ink)}
#game .jp .jpet{filter:drop-shadow(0 5px 3px #0003)}
/* 零食疊疊樂：蛋糕層 */
#game .stk{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink),0 12px 22px #8a3a5a33;background:linear-gradient(#fff0f6cc,#fff7ead9)}
#game .stk .lay{border:2px solid var(--ink);border-radius:10px;box-shadow:inset 0 5px 0 #ffffffa0,inset 0 -5px 0 #3b2a5522}
#game .stk .cut{border:2px solid #3b2a5580}
/* 節奏拍拍、泡泡浴面板 */
#game .bt,#game .bth{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink),0 12px 22px #1d5c8a33}
#game .bt .pad{box-shadow:0 4px 0 #3a2a4a,inset 0 3px 0 #ffffff90,inset 0 -5px 0 #3b2a5522}
#game .bt .nt{box-shadow:0 3px 0 #3a2a4a,inset 0 3px 0 #ffffffa0}
#game .bth .tub{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 6px 0 #fff,inset 0 -8px 0 #b8c8d688}

#game[data-g=puz]{background:radial-gradient(circle,#ffffff80 0 3px,#0000 4px) 0 0/26px 26px,linear-gradient(160deg,#ffe0ef,#e9dcff 60%,#d8f0ff)}

.pzt{position:absolute;left:0;top:0;border-radius:10px;border:2px solid #fff;box-shadow:0 3px 0 #3b2a5566,inset 0 2px 0 #ffffff70;transition:transform .14s cubic-bezier(.3,1.3,.5,1);cursor:pointer;touch-action:none}

const BGMSRC={day:'a/bgm_day.mp3',night:'a/bgm_night.mp3'};
let BG={a:null,b:null,cur:null,on:false,track:null,timer:null};
function bgmPref(){return S&&S.music!==false}
function bgmTrack(){const h=new Date().getHours();return h>=6&&h<18?'day':'night'}
function bgmEl(src){const a=new Audio(src);a.preload='auto';a.volume=0;return a}
function fade(a,to,ms){if(!a)return;const from=a.volume,t0=performance.now();const step=()=>{const k=Math.min(1,(performance.now()-t0)/ms);try{a.volume=from+(to-from)*k}catch(e){}if(k<1)requestAnimationFrame(step);else if(to===0)a.pause()};step()}
function bgmPlay(){const tr=bgmTrack();if(BG.on&&BG.track===tr)return;BG.track=tr;BG.on=true;
 const old=BG.cur;const a=bgmEl(BGMSRC[tr]);BG.cur=a;
 a.addEventListener('timeupdate',()=>{if(a.duration&&a.currentTime>a.duration-4&&!a._x){a._x=1;const n=bgmEl(BGMSRC[BG.track]);BG.cur=n;n.play().catch(()=>{});fade(n,.35,3500);fade(a,0,3500)}});
 a.play().then(()=>fade(a,.35,2500)).catch(()=>{BG.on=false;BG.track=null});if(old)fade(old,0,2000)}
function bgmStop(){BG.on=false;BG.track=null;if(BG.cur)fade(BG.cur,0,800)}
function sndMode(){return S.music===false?(S.calls===false?2:1):0}
function toggleMusic(){const m=(sndMode()+1)%3;S.music=m===0;S.calls=m!==2;save();S.music?bgmPlay():bgmStop();render();toast(['🔊 音樂＋叫聲都開','🐾 只開毛孩叫聲','🔇 全部靜音'][m])}
document.addEventListener('pointerdown',()=>{if(bgmPref()&&!BG.on)bgmPlay()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgmStop();else if(bgmPref())setTimeout(bgmPlay,300)});
setInterval(()=>{if(BG.on&&BG.track!==bgmTrack()){BG.on=false;bgmPlay()}},60000);

 const sig=JSON.stringify([phase(),S.wx,RW,S.rooms,S.cur,S.pets.map(p=>[p.id,p.breed,stage(p),p.acc,p.name,p.clean<30,p.mood<35,p.energy<20,p.hunger<25,!!p.sick]),ITEMS.filter(i=>i.c==='deco'&&has(i.id)).map(i=>i.id),S.skin]);
 if(sig===houseSig)return;houseSig=sig;
 let h='';
 const deco=decoLayout();
 ROOMS.slice(0,S.rooms).forEach((r,ri)=>{
  h+=`<div class="rm" style="width:${RW}px;background-image:url(${roomBg(r,ri)})"><span class="rl" onclick="event.stopPropagation();openDecor(${ri})">${r.n} 🎨</span>`;
  deco.filter(d=>d.r===ri).forEach(d=>{const im=DECOIMG[d.i.id];const st=d.t!==undefined?`top:${d.t}%`:`bottom:${d.b}%`;const zi=d.t!==undefined?1:(d.i.id==='rug'?2:60-d.b);h+=im?`<img class="dimg" src="${im}" style="left:${d.x}%;${st};height:${d.i.h}px;z-index:${zi}">`:`<span class="dimg" style="left:${d.x}%;${st};font-size:${d.i.h}px;line-height:1;z-index:${zi}">${d.i.e}</span>`});
  h+='</div>';
 });
 const nx=ROOMS[S.rooms];
 if(nx)h+=`<div class="lockrm" style="width:${RW}px;background-image:url(${ROOMIMG[nx.id]})"><div class="lk"><div>🔒</div>擴建「${nx.n}」<br><span style="font-size:12px;font-weight:400">多 1 個毛孩名額・空間更大</span><button class="btn" onclick="expand()">💰${nx.p} 擴建</button></div></div>`;
 const HW=RW*S.rooms;
 S.pets.forEach((p,i)=>{
  const e=ENT[p.id]||(ENT[p.id]={x:40+Math.random()*(HW-80),y:4+Math.random()*13,dir:Math.random()<.5?1:-1,st:'idle',t:Math.random()*3});

  let bb='';if(p.sick)bb='🤒';else if(p.energy<20)bb='💤';else if(p.hunger<25)bb='🍗？';else if(p.clean<30)bb='🫧？';else if(p.mood<35)bb='💔';
  const cls=p.clean<30?'dirty':p.mood<35?'sad':'';
  h+=`<div class="pw ${i===S.cur?'sel':''}" data-id="${p.id}" data-i="${i}" onclick="tapPet(${i},event)" style="left:${e.x}px;bottom:${e.y}%"><div class="bw"><div class="sh"></div><div class="flipper ${e.dir<0?'l':''}"><div class="spr ${cls} ${e.st==='walk'?'walk':''}" style="width:${W}px;height:${H}px;background-image:url(${sp.img});background-size:${W*sp.n}px ${H}px;--w:${W}px;--d:${STG[stage(p)].d}s"></div>${accHTML(p,W,H)}</div><span class="tg">${esc(p.name)}</span>${bb?`<span class="bb">${bb}</span>`:''}</div></div>`;
 });
 document.getElementById('hin').innerHTML=h+overlayHTML();
 placePets();
 S.pets.forEach(p=>{const e=ENT[p.id];if(e&&(e.st==='eat'||e.st==='sleep'))setMode(p,e.st)});

function placePets(){
 document.querySelectorAll('.pw').forEach(el=>{const p=S.pets[+el.dataset.i];if(!p)return;const e=ENT[p.id];el.style.left=e.x+'px';el.style.bottom=e.y+'%';el.style.zIndex=100-Math.round(e.y*2);const k=1-(e.y-4)/13*.12;el.querySelector('.bw').style.transform=`scale(${k.toFixed(3)})`;el.querySelector('.bw').style.transformOrigin='50% 100%'});
}
let lastT=performance.now();
function petLoop(t){
 const dt=Math.min(.1,(t-lastT)/1000);lastT=t;
 if(tab==='home'&&!G&&S.pets.length){
  const HW=RW*S.rooms;
  S.pets.forEach(p=>{
   const e=ENT[p.id];if(!e)return;const el=document.querySelector(`.pw[data-id="${p.id}"]`);if(!el)return;
   const spr=el.querySelector('.spr'),fl=el.querySelector('.flipper');
   if(e.st==='eat'||e.st==='sleep'){e.t-=dt;if(e.t<=0){e.st='idle';e.t=1+Math.random()*3;setMode(p,'idle')}}
   else if(e.st==='idle'){e.t-=dt;if(e.t<=0&&(phase()==='night'||p.energy<20||p.sick||(p.trait==='lazy'&&Math.random()<.25))&&Math.random()<.55){e.st='sleep';e.t=18+Math.random()*30;setMode(p,'sleep')}
    else if(e.t>.5&&!e.ia&&Math.random()<dt*.12){e.ia=1;idleAct(p)}
    else if(e.t<=0&&p.energy>=20&&Math.random()<.3&&decoGo(p,e,fl,spr)){}
    else if(e.t<=0&&p.energy>=20){e.ia=0;e.dg=null;e.st='walk';e.tx=30+Math.random()*(HW-60);e.ty=4+Math.random()*13;e.dir=e.tx>e.x?1:-1;fl.classList.toggle('l',e.dir<0);spr.classList.add('walk')}}
   else if(e.st==='walk'){const sp=STG[stage(p)].sp*(p.energy<40?.75:1);const dx=e.tx-e.x;const step=sp*dt;
    if(Math.abs(dx)<=step){e.x=e.tx;e.st='idle';e.t=2+Math.random()*5;spr.classList.remove('walk');if(e.dg){decoArrive(p,e.dg);e.dg=null;e.t=3+Math.random()*3}}
    else{e.x+=Math.sign(dx)*step;e.y+=(e.ty-e.y)*Math.min(1,dt*.8)}}
  });
  placePets();
 }
 requestAnimationFrame(petLoop);
}

const TASKPOOL=[
 {id:'pet',n:'摸摸毛孩',need:3,e:'🤲'},{id:'feed',n:'餵毛孩吃東西',need:2,e:'🍽️'},{id:'play',n:'陪毛孩玩耍',need:2,e:'🎈'},
 {id:'bath',n:'幫毛孩洗澡',need:1,e:'🛁'},{id:'walkbrush',n:'帶狗散步或幫貓梳毛',need:1,e:'🐕'},{id:'game',n:'玩一次接零食',need:1,e:'🎮'},
 {id:'buy',n:'在蝦拼下單買東西',need:1,e:'🦐'},{id:'wear',n:'幫毛孩換穿衣服或配件',need:1,e:'👕'},{id:'allow',n:'領今日零用金',need:1,e:'💰'},{id:'tap',n:'點點毛孩跟牠打招呼',need:5,e:'👋'}];
const TASKREW=50,LOGINREW=100;
function newTasks(){const pool=[...TASKPOOL].sort(()=>Math.random()-.5).slice(0,5);S.tasks=pool.map(t=>({id:t.id,have:0,got:false}))}
function task(id,n=1){if(!S.tasks)return;const t=S.tasks.find(x=>x.id===id);if(!t||t.got)return;const def=TASKPOOL.find(x=>x.id===id);const was=t.have>=def.need;t.have=Math.min(def.need,t.have+n);if(!was&&t.have>=def.need)setTimeout(()=>toast(`✅ 任務完成：${def.n}！去領 ${TASKREW} 零用金`),700)}
function claimTask(i){const t=S.tasks[i];const def=TASKPOOL.find(x=>x.id===t.id);if(t.got||t.have<def.need)return;t.got=true;S.coins+=TASKREW;stat('task');coinSound();render();toast(`🎉 領到任務獎勵 ${TASKREW} 零用金`);if(S.tasks.every(x=>x.got)){S.shrimp=(S.shrimp||0)+20;save();setTimeout(()=>{toast('🏆 今天 5 個任務全部完成！再送 🦐20 拼幣');render()},900)}}
function tasksHTML(){if(!S.tasks)newTasks();const done=S.tasks.filter(t=>t.got).length;
 return `<div class="card"><div class="nameRow"><b>📋 今日任務</b><span class="lv">${done}/5 已領・每個 ${TASKREW} 零用金</span></div>${S.tasks.map((t,i)=>{const d=TASKPOOL.find(x=>x.id===t.id);const ok=t.have>=d.need;
  return `<div class="row" style="box-shadow:none;background:#fff8f1;margin:6px 0 0"><span style="font-size:22px">${d.e}</span><span class="rt">${d.n}<small>${t.have}/${d.need}</small></span>${t.got?'<button class="btn gray" disabled>已領取</button>':ok?`<button class="btn" onclick="claimTask(${i})">領 ${TASKREW}</button>`:`<button class="btn gray" disabled>未完成</button>`}</div>`}).join('')}</div>`}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function loginBonus(){const t=todayStr();if(S.lastLogin===t)return false;S.streak=(S.lastLogin===(()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()})())?(S.streak||0)+1:1;S.lastLogin=t;S.coins+=LOGINREW;stat('login');S.loginDays=(S.loginDays||0)+1;const petGift=S.loginDays%7===0;if(petGift)S.petTicket=(S.petTicket||0)+1;save();
 modal(`<h3>🎁 每日登入獎勵</h3><p style="font-size:40px;text-align:center;margin:8px 0">💰</p><p style="text-align:center">今天第一次登入，送你 <b style="color:#ee5a3c;font-size:20px">${LOGINREW} 零用金</b>！</p><p style="text-align:center;font-size:13px;color:#a08670">已連續登入 ${S.streak} 天・累計登入 ${S.loginDays} 天</p>${petGift?`<p style="text-align:center;font-size:15px;font-weight:800;color:#d0577a;background:#fff0f5;border-radius:12px;padding:10px">🎉 累計登入滿 ${S.loginDays} 天！<br>送你 1 張「🐾 神秘毛孩領養券」，到我的家領取隨機一隻貓或狗！</p>`:`<p style="text-align:center;font-size:12.5px;color:#a08670">再登入 ${7-S.loginDays%7} 天就送 1 隻隨機毛孩 🐾</p>`}<div class="mbtns"><button class="btn" onclick="closeModal();render()">收下！</button></div>`);coinSound();return true}

/* ---------- actions ---------- */
function applyFx(p,fx){for(const k in fx){if(k==='aff')continue;p[k]=clamp(p[k]+fx[k])}}
function addAff(p,n){const b=lvl(p);p.aff+=n;if(lvl(p)>b){S.coins+=20;diary(`💞 和 ${p.name} 的親密度升到 Lv.${lvl(p)}`);setTimeout(()=>{toast(`🎉 ${p.name} 親密度升到 Lv.${lvl(p)}！獎勵 💰20`);beep(784,.1);setTimeout(()=>beep(1046,.2),110)},500)}}
function act(k){
 const p=pet(),a=ACT[k];
 if(cnt(p.id,k)>=a.lim)return toast(`今天${a.n}過 ${a.lim} 次囉，明天再來～`);
 if(a.tired&&p.sick)return toast(`${p.name} 生病了，要休息，先帶去看獸醫吧 🏥`);
 if(k==='walk'&&S.wx==='rain')return toast('🌧️ 下雨天不能出門散步，在家陪牠玩吧');
 if(a.tired&&p.energy<15)return toast(`${p.name} 累壞了😪 吃元氣小餅乾或睡一覺吧`);
 const fx={...a.fx};let base=a.coins,msg='';
 if(k==='play'){if(has(p.type==='cat'?'wand':'frisbee'))base*=1.5;if(has(p.type==='cat'?'yarn':'ball'))fx.mood+=8;msg=p.type==='cat'?'撲撲撲！':'追追追！'}
 if(k==='bath'){if(has('shampoo')){S.inv.shampoo--;fx.mood=5;msg='香噴噴🧴'}else{fx.mood=p.type==='cat'?-12:-6;msg=p.type==='cat'?'喵嗚！討厭水😾':'有點不情願…'}}
 if(k==='pet')msg=p.type==='cat'?'呼嚕呼嚕～':'汪～好舒服';
 if(k==='walk'){msg='出門囉！🌳';if(S.wx==='sun'){base*=1.5;msg='好天氣散步☀️'}}
 if(k==='brush')msg='毛毛變蓬鬆✨';
 if(p.trait==='play'&&k==='play'){fx.mood=Math.round(fx.mood*1.5);base+=3}
 if(p.trait==='neat'&&k==='bath'&&fx.mood<5){fx.mood=5;msg='洗澡最舒服了🫧'}
 if(p.trait==='lazy'&&fx.energy)fx.energy=Math.round(fx.energy/2);
 let affA=a.aff;if(p.trait==='cling'&&k==='pet')affA*=2;
 ITEMS.forEach(i=>{const b=i.bon;if(!b||b.k!==k||!has(i.id)||!fits(i,p))return;if(b.mood)fx.mood=(fx.mood||0)+b.mood;if(b.cm)base*=b.cm;if(b.aff)affA+=b.aff});
 applyFx(p,fx);
 const coins=Math.max(1,Math.round(base*mult(p)));
 S.coins+=coins;S.today[p.id][k]=cnt(p.id,k)+1;addAff(p,affA);task(k==='walk'||k==='brush'?'walkbrush':k);stat('act');wishHit(p,k);
 render();jump();coinSound();
 floatText(`+${coins} 💰`);if(msg)floatText(msg,350);
}

 {const e=ENT[p.id];if(e&&e.st==='sleep'){e.st='idle';e.t=2;setMode(p,'idle');floatText('醒來了…🥱');task('tap');return}}

/* ---------- 觸摸部位：摸頭、搔下巴、戳肚子、摸背、碰尾巴（2026-11-17） ---------- */
const SPOTS={head:'頭頂',chin:'下巴',belly:'肚子',back:'背'};
function petSpot(p){if(!p.spot){const k=Object.keys(SPOTS);p.spot=k[Math.floor(Math.random()*k.length)]}return p.spot}
function touchZone(i,ev){
 const p=S.pets[i];if(!p||!ev||ev.clientX===undefined)return null;const e=ENT[p.id];if(e&&(e.st==='eat'||e.st==='sleep'))return null;
 const el=document.querySelector(`.pw[data-i="${i}"] .spr`);if(!el)return null;const a=SP(p).anc;if(!a||!a.head)return null;
 const r=el.getBoundingClientRect();if(!r.width)return null;
 let x=(ev.clientX-r.left)/r.width*100;const y=(ev.clientY-r.top)/r.height*100;
 if(el.closest('.flipper').classList.contains('l'))x=100-x;
 const [hx,hy]=a.head,fy=a.face?a.face[1]:hy+11,ny=a.neck?a.neck[1]:fy+11;
 const right=hx>50,dx=right?hx-x:x-hx;// dx>0 = 往身體方向
 const ad=Math.abs(x-hx);
 let z;
 if(ad<20&&y<fy-1)z='head';
 else if(ad<20&&y<ny+12)z='chin';
 else if(dx>62)z='tail';
 else if(y>55&&dx>8)z='belly';
 else z=ad<24?'chin':'back';
 return {z,x:right?x:x,y,lx:(ev.clientX-r.left)/r.width*100,ly:y};
}
function touchPop(p,emo,lx,ly){const w=document.querySelector(`.pw[data-id="${p.id}"] .bw`);if(!w)return;emo.forEach((t,k)=>{const f=document.createElement('div');f.className='thp';f.textContent=t;f.style.left=Math.max(5,Math.min(95,lx))+'%';f.style.top=Math.max(-10,Math.min(80,ly-14))+'%';f.style.setProperty('--dx',((k-(emo.length-1)/2)*16)+'px');f.style.animationDelay=(k*.08)+'s';w.appendChild(f);setTimeout(()=>f.remove(),1300)})}
function touchAnim(p,cls){const w=document.querySelector(`.pw[data-id="${p.id}"]`);if(!w)return;w.classList.remove('t-head','t-chin','t-belly','t-back','t-tail','t-no','jump');void w.offsetWidth;w.classList.add(cls);clearTimeout(w._tt);w._tt=setTimeout(()=>w.classList.remove(cls),1000)}

 S.today.touch=S.today.touch||{};const n=S.today.touch[p.id]||0;
 let good=true,line,emo,cls='t-'+z;
 if(z==='head'){line=cat?tpick(['(瞇眼)咕嚕～','喵～再摸一下','(用頭頂你的手)']):tpick(['(耳朵往後貼)嘿嘿','汪～好舒服','(閉眼享受)']);emo=['💕','✨']}
 else if(z==='chin'){line=cat?tpick(['呼嚕呼嚕呼嚕…','(抬起下巴)這裡這裡','(陶醉)喵～']):tpick(['(脖子伸長長)','嗯～就是那裡！','(腳在空中踢)']);emo=cat?['🎶','💗']:['💗','🐾']}
 else if(z==='belly'){

function gLoop(ts){
 if(!G||!G.on)return;
 const dt=Math.min(.05,(ts-G.last)/1000);G.last=ts;
 if(G.fever>0){G.fever-=dt;if(G.fever<=0){const b=document.getElementById('gfev');if(b)b.remove()}}

 const base=SP(p);const H0=sprH(p),W0=Math.round(H0*base.fw/base.fh);

 if(a){W=Math.round(W0*(mode==='sleep'?1.05:1));H=Math.round(W*a.fh/a.fw);s=a;dur=mode==='eat'?1.1:2.8;anim=true}

function mgRec(raw){const id=window._mgId;if(!id)return'';S.best=S.best||{};const v=Math.round(raw*10)/10,o=S.best[id]||0;window._mgId=null;if(v>o){S.best[id]=v;return o?`<div style="font-weight:900;color:#8a5cff;font-size:16px">🎉 新紀錄！（之前 ${o}）</div>`:''}return `<div style="font-size:12px;color:#a08670">個人最佳 ${o}</div>`}

 if(p.energy<10)return toast(`${p.name} 太累了😪 先吃元氣小餅乾或睡一覺吧`);
 closeModal();window._mgId=id;if(id==='catch')return startGame();if(id==='fly')return flyGame(p);if(id==='race')return raceGame(p);if(id==='dig')return digGame(p);if(id==='mem')return memGame(p);if(id==='shell')return shellGame(p);if(id==='beat')return beatGame(p);if(id==='jump')return jumpGame(p);if(id==='bath')return bathGame(p);if(id==='stack')return stackGame(p);if(id==='shop')return shopGame(p);if(id==='fish')return fishGame(p);if(id==='disc')return discGame(p);if(id==='puz')return puzGame(p);if(id==='simon')return simonGame(p);
}
const FSH=[['🐟','小魚',1,40],['🐠','熱帶魚',2,25],['🦐','小蝦',1,14],['🐡','河豚',3,10],['🦀','螃蟹',2,6],['👢','舊靴子',0,4],['🐋','傳說鯨魚',8,1],['🎁','漂流寶箱',4,3]];

 mgOpen(p,`陪 ${esc(p.name)} 釣魚！`,'浮標出現 <b>❗</b> 時快點池塘<br>太早點會把魚嚇跑・30 秒<br>最後 10 秒魚群來了，還可能釣到 🎁 寶箱',(ov,area)=>{

  <svg style="position:absolute;inset:0;pointer-events:none" width="100%" height="100%"><line id="fline" x1="96" y1="60" x2="60%" y2="52%" stroke="#333" stroke-width="1.5"/></svg>

  <div id="fbag" style="position:absolute;left:6px;right:6px;bottom:2%;text-align:center;font-size:20px"></div>`;
  const bob=area.querySelector('#fbob'),ex=area.querySelector('#fex'),msg=area.querySelector('#fmsg'),bag=area.querySelector('#fbag');

  const arm=(d)=>{G.bite=0;ex.style.display='none';bob.style.top='52%';G.next=performance.now()+d*(G.t<=10?.45:1)};arm(1200+Math.random()*1800);
  area.addEventListener('pointerdown',ev=>{ev.preventDefault();if(!G.on)return;const now=performance.now();
   if(G.bite&&now<G.bite){const f=pick();G.score+=f[2];G.caught.push(f[0]);bag.textContent=G.caught.slice(-12).join('');msg.textContent=f[2]?`釣到 ${f[0]} ${f[1]}！+${f[2]}`:`釣到 ${f[0]} ${f[1]}…`;beep(f[2]>=3?988:784,.1,'triangle',.06);document.getElementById('gs').textContent='得分 '+G.score;arm(1000+Math.random()*1800)}
   else if(!G.bite){msg.textContent='太早了！魚被嚇跑了 💦';beep(200,.12);arm(1800+Math.random()*1500)}});
  const loop=now=>{if(!G||!G.on)return;const dt=(now-G.last)/1000;G.last=now;G.t-=dt;mgT(G.t);
   if(G.t<=10&&!G.fz){G.fz=1;if(!G.bite)G.next=Math.min(G.next,now+600);const z=document.createElement('div');z.style.cssText='position:absolute;left:0;right:0;top:24%;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 4px #0008;pointer-events:none';z.textContent='🐟🐟 魚群來了！上鉤更快！';area.appendChild(z);beep(988,.1,'triangle',.05);setTimeout(()=>z.remove(),2200)}
   if(!G.bite&&now>=G.next){G.bite=now+Math.max(550,900-G.caught.length*25);ex.style.display='block';bob.style.top='55%';msg.textContent='❗ 上鉤了！快點！';beep(660,.05,'square',.04)}
   else if(G.bite&&now>G.bite){msg.textContent='魚溜走了…';arm(1200+Math.random()*1500)}
   else if(!G.bite)bob.style.top=(52+Math.sin(now/300)*1.2)+'%';
   if(G.t<=0){G.on=false;const big=G.caught.includes('🐋');stat('fish');if(big)stat('whale');

   requestAnimationFrame(loop)};requestAnimationFrame(loop)})}

/* ---------- 🥏 第 13 個小遊戲：飛盤接接樂（拖曳移動毛孩去接） ---------- */
const DSC=[['🥏',1,30],['🧸',1,24],[null,2,16],['⭐',3,6],['🌟',0,3],['🐝',-2,11],['💧',-1,8]];
function discGame(p){const tr=p.type==='cat'?'🐟':'🦴';
 mgOpen(p,`陪 ${esc(p.name)} 接飛盤！`,`手指在畫面上左右拖，讓毛孩去接<br>🥏🧸 1 分・${tr} 2 分・⭐ 3 分・連接 5 個以上加分<br>🌟 讓毛孩變大 5 秒・碰到 🐝 會暈一下・30 秒`,(ov,area)=>{
  const W=area.clientWidth,H=area.clientHeight,ph=72;
  G={on:true,score:0,t:30,last:performance.now(),spawn:.3,items:[],x:W/2,tx:W/2,big:0,stun:0,combo:0,best:0,n:0,gs:0};
  area.style.touchAction='none';
  area.innerHTML=`<div id="dpet" style="position:absolute;left:0;bottom:4%;transform-origin:50% 100%;will-change:transform"><div id="dfl">${sprDiv(p.breed,stage(p),ph,p.acc.body)}</div><div class="sh" style="position:absolute;left:15%;right:15%;bottom:-4px;height:10px;border-radius:50%;background:#0003"></div></div><div id="dcb" style="position:absolute;left:0;right:0;top:8px;text-align:center;font-weight:900;font-size:20px;color:#ff5c9e;text-shadow:0 2px 0 #fff;pointer-events:none"></div><div style="position:absolute;left:0;right:0;bottom:1%;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px #0008;pointer-events:none">← 左右拖曳 →</div>`;
  const pe=area.querySelector('#dpet'),fl=area.querySelector('#dfl'),cb=area.querySelector('#dcb'),pw=pe.offsetWidth||90;
  const mv=e=>{if(!G||!G.on)return;const r=area.getBoundingClientRect();G.tx=Math.max(pw/2,Math.min(W-pw/2,e.clientX-r.left))};
  area.addEventListener('pointerdown',e=>{e.preventDefault();mv(e)});area.addEventListener('pointermove',mv);
  const pick=()=>{const tot=DSC.reduce((a,d)=>a+d[2],0);let r=Math.random()*tot;for(const d of DSC){if((r-=d[2])<0)return d}return DSC[0]};
  const pop=(x,y,t,c)=>{const d=document.createElement('div');d.className='gpop';d.textContent=t;d.style.color=c;d.style.left=x+'px';d.style.top=y+'px';area.appendChild(d);setTimeout(()=>d.remove(),800)};
  const spawn=()=>{let d=pick();if(d[0]==='🌟'&&G.gs>=2)d=DSC[0];if(d[0]==='🌟')G.gs++;const el=document.createElement('div');el.className='gi';el.textContent=d[0]||tr;el.style.fontSize='40px';el.style.pointerEvents='none';const x=10+Math.random()*(W-60);
   area.appendChild(el);G.items.push({el,v:d[1],e:d[0]||tr,x,x0:x,y:-50,vy:120+Math.random()*80+(30-G.t)*4,sw:d[0]==='🥏'?30+Math.random()*50:0,ph:Math.random()*6})};
  const hit=(it,x,y)=>{if(it.e==='🌟'){G.big=5;pop(x,y,'變大！','#f0a500');beep(1318,.12,'triangle',.06);return}
   if(it.v<0){G.score=Math.max(0,G.score+it.v);G.combo=0;cb.textContent='';if(it.e==='🐝')G.stun=.7;pop(x,y,String(it.v),'#e04848');beep(180,.15,'sawtooth',.05)}
   else{G.combo++;G.n++;G.best=Math.max(G.best,G.combo);const b=it.v+(G.combo>=10?2:G.combo>=5?1:0);G.score+=b;pop(x,y,'+'+b,'#2f9e5b');beep(880+Math.min(G.combo,10)*40,.06,'square',.04);cb.textContent=G.combo>=3?`🔥 連續接到 ${G.combo} 個`:''}
   document.getElementById('gs').textContent='得分 '+G.score};
  const loop=now=>{if(!G||!G.on)return;const dt=Math.min(.05,(now-G.last)/1000);G.last=now;G.t-=dt;mgT(G.t);
   G.spawn-=dt;if(G.spawn<=0){spawn();G.spawn=Math.max(.3,.5+Math.random()*.3-(30-G.t)*.006)}
   if(G.stun>0)G.stun-=dt;else{const dx=G.tx-G.x;G.x+=dx*Math.min(1,dt*12);if(Math.abs(dx)>3)fl.style.transform=dx<0?'scaleX(-1)':''}
   G.big=Math.max(0,G.big-dt);const sc=G.big>0?1.45:1;
   pe.style.transform=`translate3d(${(G.x-pw/2).toFixed(1)}px,0,0) scale(${sc})`;pe.style.filter=G.stun>0?'grayscale(.7) brightness(.9)':G.big>0?'drop-shadow(0 0 8px #ffd84d)':'';
   const top=H*.96-ph*sc,cw=pw*.45*sc+16;
   G.items.forEach(it=>{if(it.dead)return;it.y+=it.vy*dt;it.ph+=dt*3;it.x=it.x0+Math.sin(it.ph)*it.sw;it.el.style.transform=`translate3d(${it.x.toFixed(1)}px,${it.y.toFixed(1)}px,0)`;
    const cx=it.x+22,cy=it.y+24;
    if(G.stun<=0&&cy>top&&cy<top+ph*sc*.75&&Math.abs(cx-G.x)<cw){it.dead=true;it.el.remove();hit(it,cx-10,cy-20)}
    else if(it.y>H){it.dead=true;it.el.remove();if(it.v>0){G.combo=0;cb.textContent=''}}});
   G.items=G.items.filter(i=>!i.dead);
   if(G.t<=0){G.on=false;G.items.forEach(i=>i.el.remove());stat('disc');if(G.best>=20)stat('discc');

/* ---------- 🧩 第 14 個小遊戲：毛孩拼圖（3×3 滑動拼圖） ---------- */
const PZIMG=['catch','fly','race','fish','jump','shop','stack','bath','dig','beat'];
function puzGame(p){
 mgOpen(p,`跟 ${esc(p.name)} 拼拼圖！`,'點空格旁邊的圖塊來移動<br>把 8 塊拼回原本的插畫・60 秒<br>步數越少獎勵越多',(ov,area)=>{
  const im='a/mg_'+PZIMG[Math.floor(Math.random()*PZIMG.length)]+'.webp',N=3,SZ=Math.min(area.clientWidth-40,320),T=SZ/N,IH=SZ*1052/720,OY=(IH-SZ)/2;
  const adj=i=>{const r=Math.floor(i/N),c=i%N,a=[];if(r>0)a.push(i-N);if(r<N-1)a.push(i+N);if(c>0)a.push(i-1);if(c<N-1)a.push(i+1);return a};
  let b=[0,1,2,3,4,5,6,7,8],e=8;
  const mix=()=>{let prev=-1;for(let k=0;k<90;k++){const nb=adj(e).filter(x=>x!==prev),m=nb[Math.floor(Math.random()*nb.length)];[b[e],b[m]]=[b[m],b[e]];prev=e;e=m}};
  const ok=()=>b.every((v,i)=>v===i);do{mix()}while(ok()||b.filter((v,i)=>v===i).length>3);
  G={on:true,t:60,last:performance.now(),mv:0};document.getElementById('gs').textContent='步數 0';
  area.innerHTML=`<div class="pzw"><div class="pzref"><div style="background-image:url(${im});background-size:72px ${72*1052/720}px;background-position:0 ${-(72*1052/720-72)/2}px"></div><small>完成圖</small></div><div class="pzb" style="width:${SZ+12}px;height:${SZ+12}px">${[0,1,2,3,4,5,6,7].map(t=>`<div class="pzt" data-t="${t}" style="width:${T-4}px;height:${T-4}px;background-image:url(${im});background-size:${SZ}px ${IH}px;background-position:${-(t%N)*T}px ${-(Math.floor(t/N)*T+OY)}px"><i>${t+1}</i></div>`).join('')}</div><div class="pzm" id="pzm">步數 0</div><div style="filter:drop-shadow(0 6px 4px #0003)">${thumb(p.breed,stage(p),110,p.acc.body)}</div></div>`;
  const el=[...area.querySelectorAll('.pzt')],mm=area.querySelector('#pzm');
  const place=()=>b.forEach((v,i)=>{if(v<8){const d=el[v];d.style.transform=`translate(${(i%N)*T+5}px,${Math.floor(i/N)*T+5}px)`;d.classList.toggle('ok',v===i)}});place();
  el.forEach(d=>d.addEventListener('pointerdown',ev=>{ev.preventDefault();if(!G||!G.on)return;const t=+d.dataset.t,i=b.indexOf(t);if(!adj(e).includes(i)){d.classList.remove('no');void d.offsetWidth;d.classList.add('no');return}
   [b[e],b[i]]=[b[i],b[e]];e=i;G.mv++;mm.textContent='步數 '+G.mv;document.getElementById('gs').textContent='步數 '+G.mv;beep(620+Math.random()*120,.04,'triangle',.04);place();if(ok())fin(true)}));
  const fin=win=>{if(!G.on)return;G.on=false;stat('puz');const right=b.filter((v,i)=>v===i&&v<8).length;let c,sh=0,head;
   if(win){stat('puzok');if(G.mv<=30)stat('puzfast');c=Math.max(18,40-Math.max(0,G.mv-24));sh=G.mv<=30?3:0;area.querySelector('.pzb').classList.add('done');head=`<div style="font-size:56px">🧩</div><b style="font-size:22px">拼好了！${G.mv} 步・剩 ${Math.ceil(G.t)} 秒</b>`}
   else{c=Math.min(20,right*3);head=`<div style="font-size:56px">⏰</div><b style="font-size:22px">時間到！拼對 ${right}/8 塊</b>`}
   setTimeout(()=>mgFinish(p,ov,area,head,c,sh,win&&G.mv<=30?'<div style="color:#8a5cff;font-weight:900">✨ 30 步內完成！拼圖高手！</div>':''),win?900:300)};
  const loop=now=>{if(!G||!G.on)return;const dt=Math.min(.05,(now-G.last)/1000);G.last=now;G.t-=dt;mgT(G.t);if(G.t<=0)return fin(false);requestAnimationFrame(loop)};requestAnimationFrame(loop)})}

/* ---------- 🧠 第 15 個小遊戲：口令記憶（照毛孩表演的順序按） ---------- */

function passKey(){const d=new Date();return d.getFullYear()*100+d.getMonth()+1}
function pass(){const k=passKey();if(!S.pass||S.pass.k!==k)S.pass={k,xp:0,got:[]};return S.pass}
function passLv(){return Math.min(PASSLV,Math.floor(pass().xp/PASSXP))}
function passXP(k,n){const x=(PXMAP[k]||0)*n;if(!x||!S)return;S.today=S.today||{};const e=S.today.px||0,g=Math.max(0,Math.min(x,PXCAP-e));if(!g)return;
 const b=passLv();S.today.px=e+g;pass().xp+=g;const a=passLv();if(a>b){S.passBest=Math.max(S.passBest||0,a);setTimeout(()=>{toast(`📘 毛孩護照升到 Lv.${a}！去「收集」領獎勵`);beep(988,.1,'triangle',.05)},1100)}}

function passReady(){const P=pass(),L=passLv(),o=[];for(let i=1;i<=L;i++)if(!P.got.includes(i))o.push(i);return o}
function claimPass(L){const P=pass();if(L>passLv()||P.got.includes(L))return;const r=passRew(L);P.got.push(L);
 if(r.c)S.coins+=r.c;if(r.s)S.shrimp=(S.shrimp||0)+r.s;if(r.inv)S.inv[r.inv[0]]=(S.inv[r.inv[0]]||0)+r.inv[1];if(r.item){S.inv[r.item]=(S.inv[r.item]||0)+1;diary(`📘 得到毛孩護照限定 ${IT[r.item].e}${IT[r.item].name}`)}

function memGame(p){

  const cards=[...pool,...pool].sort(()=>Math.random()-.5);let open=[],pairs=0,lock=false,ended=false;G={on:true,t:45,last:performance.now()};
  area.innerHTML=`<div class="mem">${cards.map((c,i)=>`<button class="mcell" data-i="${i}"><span>${c}</span></button>`).join('')}</div>`;
  document.getElementById('gs').textContent='配對 0/6';
  const done=()=>{if(ended)return;ended=true;G.on=false;const perfect=pairs===6;if(perfect)stat('memall');const tb=perfect?Math.ceil(G.t):0;
   setTimeout(()=>mgFinish(p,ov,area,`<div style="font-size:56px">${perfect?'🏆':'🃏'}</div><b style="font-size:22px">配對 ${pairs}/6${perfect?`・剩 ${tb} 秒`:''}</b>`,pairs*3+tb*.4,perfect?3:0),perfect?450:0)};
  area.querySelectorAll('.mcell').forEach(b=>b.addEventListener('click',()=>{if(!G||!G.on||lock||b.classList.contains('up'))return;b.classList.add('up');open.push(b);beep(880,.04);
   if(open.length<2)return;const [a,c]=open;open=[];
   if(cards[a.dataset.i]===cards[c.dataset.i]){a.classList.add('ok');c.classList.add('ok');pairs++;document.getElementById('gs').textContent='配對 '+pairs+'/6';beep(1175,.08,'triangle',.05);if(pairs===6)done()}
   else{lock=true;setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');lock=false},650)}}));
  const loop=ts=>{if(!G||!G.on)return;G.t-=Math.min(.1,(ts-G.last)/1000);G.last=ts;mgT(G.t);if(G.t<=0)return done();requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
 });
}

function qProg(o){const q=qS();if(o[0]==='or'){const a=qProg(o[1]),b=qProg(o[2]);return a[0]/a[1]>=b[0]/b[1]?a:b}if(o[0]==='st'){const v=(S.st&&S.st[o[1]]||0)-(q.base[o[1]]||0);return [Math.max(0,Math.min(o[2],v)),o[2]]}const ok=!!o[1]();return [ok?1:0,1]}
function qDone(){const Q=qCur();return Q&&Q.o.every(o=>{const [a,b]=qProg(o);return a>=b})}
function questCard(){if(!S.pets.length)return'';const Q=qCur(),q=qS();
 if(!Q)return `<div class="qc" onclick="openQuest()"><div class="qh"><span class="qa">${QBOSS}</span><span class="qt">店長的委託：全部完成！<small>🏅 你是蝦拼百貨的明星主人</small></span></div></div>`;
 const ps=Q.o.map(qProg),pc=ps.reduce((a,[x,y])=>a+x/y,0)/ps.length,ok=qDone();
 return `<div class="qc ${ok?'ok':''}" onclick="openQuest()"><div class="qh"><span class="qa">${QBOSS}</span><span class="qt">店長的委託・${q.i<18?'第一季':q.i<30?'第二季':q.i<42?'第三季':'第四季'} 第 ${q.i+1}/${QUESTS.length} 章<small>${esc(Q.t)}${ok?'　✅ 可以回報了！':''}</small></span><span style="font-size:20px">›</span></div><div class="qb"><i style="width:${Math.round(pc*100)}%"></i></div></div>`}
function qRewTxt(r){return [r.c?'💰'+r.c:'',r.s?'🦐'+r.s:'',r.inv?IT[r.inv[0]].e+'×'+r.inv[1]:'',r.item?IT[r.item].e+IT[r.item].name:''].filter(Boolean).join('　')}
function openQuest(){const Q=qCur(),q=qS();
 if(!Q)return modal(`<h3>${QBOSS} 店長的委託</h3><div class="qtalk"><span class="qav">${QBOSS}</span><div class="qbub">全部 ${QUESTS.length} 章都完成了！謝謝你這麼用心照顧毛孩。之後有新的委託會再找你喔～</div></div><div class="mbtns"><button class="btn" onclick="closeModal()">好</button></div>`);
 const ok=qDone();

function qClaim(){if(!qDone())return;const Q=qCur(),q=qS(),r=Q.r;
 if(r.c)S.coins+=r.c;if(r.s)S.shrimp=(S.shrimp||0)+r.s;if(r.inv)S.inv[r.inv[0]]=(S.inv[r.inv[0]]||0)+r.inv[1];if(r.item)S.inv[r.item]=(S.inv[r.item]||0)+1;

function jumpGame(p){
 mgOpen(p,`陪 ${esc(p.name)} 跳跳跳！`,'點一下畫面跳起來，長按跳更高<br>跳過 🪣🧹🌵，吃到 🍖🐟⭐ 加分・撞到扣時間・25 秒',(ov,area)=>{
  const W=Math.min(area.clientWidth-16,400),H=330,GY=H*.62,ph=Math.round(56*Math.min(1.35,BR[p.breed].st[stage(p)].fh/BR[p.breed].st[stage(p)].fw*1.6)),pw=Math.round(ph*BR[p.breed].st[stage(p)].fw/BR[p.breed].st[stage(p)].fh);
  area.innerHTML=`<div class="jp" style="width:${W}px;height:${H}px"><span class="cl" style="left:20%;top:12%">☁️</span><span class="cl" style="left:68%;top:22%">☁️</span><div class="hint" id="jh">點畫面跳躍！</div><div class="jpet" id="jpet">${thumb(p.breed,stage(p),ph,p.acc.body)}</div></div>`;
  const box=area.querySelector('.jp'),pe=box.querySelector('#jpet');let y=0,vy=0,hold=false,score=0,t=25,last=performance.now(),spawn=1.2,speed=170,objs=[],ended=false,hits=0,eaten=0;G={on:true};
  const hd=()=>{document.getElementById('gs').textContent='得分 '+score};hd();
  const jump=()=>{if(!G||!G.on)return;if(y<=0.5){vy=520;beep(660,.05,'triangle',.04);const h=box.querySelector('#jh');if(h)h.remove()}};
  box.addEventListener('pointerdown',e=>{e.preventDefault();hold=true;jump()});box.addEventListener('pointerup',()=>hold=false);box.addEventListener('pointerleave',()=>hold=false);
  const mk=()=>{const good=Math.random()<.45;const e=good?(Math.random()<.12?'⭐':Math.random()<.5?'🍖':'🐟'):['🪣','🧹','🌵'][Math.floor(Math.random()*3)];const el=document.createElement('span');el.className='ob';el.textContent=e;box.appendChild(el);
   objs.push({el,e,good,x:W+10,y:good?(Math.random()<.5?0:60+Math.random()*60):0})};
  const end=()=>{if(ended)return;ended=true;G.on=false;if(hits===0&&eaten>=8)stat('jumpall');mgFinish(p,ov,area,`<div style="font-size:56px">${hits===0?'🏆':'🦘'}</div><b style="font-size:22px">得分 ${score}・吃到 ${eaten} 個</b><div style="font-size:13px">撞到 ${hits} 次</div>`,Math.min(score,40)*.7,hits===0&&eaten>=8?3:0)};
  const loop=ts=>{if(!G||!G.on||ended)return;const dt=Math.min(.05,(ts-last)/1000);last=ts;t-=dt;speed+=dt*6;
   vy-=(hold&&vy>0?900:1600)*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=0;pe.style.transform=`translateY(${GY-ph-y}px)`;
   spawn-=dt;if(spawn<=0){mk();spawn=.75+Math.random()*.9}
   objs.forEach(o=>{if(o.dead)return;o.x-=speed*dt;o.el.style.transform=`translate(${o.x}px,${GY-34-o.y}px)`;
    const px0=46+pw*.2,px1=46+pw*.8,py0=y,py1=y+ph*.75,ox0=o.x+6,ox1=o.x+28,oy0=o.y,oy1=o.y+28;
    if(ox1>px0&&ox0<px1&&oy1>py0&&oy0<py1){o.dead=1;o.el.remove();if(o.good){const v=o.e==='⭐'?5:2;score+=v;eaten++;beep(988,.06,'triangle',.05)}else{hits++;t=Math.max(0,t-2);score=Math.max(0,score-1);beep(200,.12,'sawtooth',.04);pe.style.opacity=.4;setTimeout(()=>pe.style.opacity=1,300)}hd()}
    else if(o.x<-40){o.dead=1;o.el.remove()}});
   mgT(t);if(t<=0)return end();requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
 });
}

const FT_REW=10,FCHECK=5,FXMAS=30;
function md(d){return (d.getMonth()+1)*100+d.getDate()}
function fest(){const d=new Date(),m=md(d);for(const f of FESTS){const a=f.from[0]*100+f.from[1],b=f.to[0]*100+f.to[1];if(m>=a&&m<=b)return f}return null}
function festKey(f){return f.id+new Date().getFullYear()}
function festEnd(f){const d=new Date(),e=new Date(d.getFullYear(),f.to[0]-1,f.to[1]+1);return Math.max(0,Math.ceil((e-d)/864e5))}
function festS(){const f=fest();if(!f||!S)return null;const k=festKey(f);if(!S.fest||S.fest.k!==k)S.fest={k,tok:0,got:{},d:'',ts:[]};const o=S.fest,t=todayStr();
 if(o.d!==t){o.d=t;o.ci=0;o.xm=0;const ok=FTASK.filter(x=>x[0]!=='perform'||S.pets.some(p=>(p.tricks||[]).length));o.ts=[...ok].sort(()=>Math.random()-.5).slice(0,3).map(x=>({k:x[0],have:0,got:0}))}
 return o}
function festAdd(k,n){const f=fest();if(!f||!S||!S.pets||!S.pets.length)return;const o=festS();let hit=0;
 o.ts.forEach(t=>{const def=FTASK.find(x=>x[0]===t.k);if(t.k!==k||t.have>=def[1])return;t.have=Math.min(def[1],t.have+n);if(t.have>=def[1]){hit=1;setTimeout(()=>toast(`${f.e} 活動任務完成：${def[2]}！去領 ${f.te}${FT_REW}`),900)}})}
function festReady(){const f=fest();if(!f||!S||!S.pets||!S.pets.length)return 0;const o=festS(),m=md(new Date());
 return o.ts.filter(t=>!t.got&&t.have>=FTASK.find(x=>x[0]===t.k)[1]).length+(o.ci?0:1)+(f.id==='win'&&(m===1224||m===1225)&&!o.xm?1:0)}
function festBtn(){const f=fest();if(!f||!S.pets.length)return'';const o=festS(),r=festReady();
 return `<button class="big fbtn ${f.cls}" onclick="openFest()">${f.e} ${f.n}・${f.te} ${o.tok}${r?`<span class="fdot">${r} 個可領</span>`:''}<span style="display:block;font-size:12px;font-weight:normal">${festEnd(f)<=3?`⏰ 最後 ${festEnd(f)} 天！限定品要趕快換`:`季節限定活動・還剩 ${festEnd(f)} 天・限定配件和家具`}</span></button>`}
function festClaim(what,i){const f=fest();if(!f)return;const o=festS(),m=md(new Date());let n=0;
 if(what==='ci'&&!o.ci){o.ci=1;n=FCHECK}
 else if(what==='xm'&&f.id==='win'&&(m===1224||m===1225)&&!o.xm){o.xm=1;n=FXMAS}
 else if(what==='t'){const t=o.ts[i],def=t&&FTASK.find(x=>x[0]===t.k);if(t&&!t.got&&t.have>=def[1]){t.got=1;n=FT_REW;stat('festtask')}}
 if(!n)return;o.tok+=n;save();beep(988,.08,'triangle',.05);toast(`${f.te} +${n} ${f.tn}`);openFest();render()}
function festBuy(id){const f=fest(),i=IT[id];if(!f||!i||i.fe!==f.id||has(i.id))return;const o=festS();if(o.tok<i.fp)return toast(`${f.tn}不夠喔，還差 ${i.fp-o.tok} 個`);
 o.tok-=i.fp;S.inv[id]=(S.inv[id]||0)+1;stat('festbuy');diary(`${f.e} 用${f.tn}換到 ${i.e}${i.name}`);save();coinSound();houseSig='';
 toast(`${i.e} 換到「${i.name}」！${i.c==='deco'?'已經擺進家裡了':'到背包幫毛孩戴上吧'}`);openFest();render()}
function openFest(){const f=fest();if(!f)return closeModal();const o=festS(),m=md(new Date());
 const ts=o.ts.map((t,i)=>{const def=FTASK.find(x=>x[0]===t.k),ok=t.have>=def[1];return `<div class="ftask"><span style="font-size:24px">${def[3]}</span><span class="fb">${def[2]}<small>${t.have}/${def[1]}</small></span>${t.got?'<b style="color:#45b37a">✔ 已領</b>':`<button class="btn" ${ok?'':'disabled style="opacity:.45"'} onclick="festClaim('t',${i})">${f.te}${FT_REW}</button>`}</div>`}).join('');
 const xm=f.id==='win'&&(m===1224||m===1225);
 const shop=ITEMS.filter(i=>i.fe===f.id).map(i=>{const own=has(i.id),can=o.tok>=i.fp;return `<button class="${own?'own':can?'':'no'}" onclick="${own?'':`festBuy('${i.id}')`}"><span class="fe">${i.e}</span>${i.name}<br>${own?'✔ 已擁有':`${f.te}${i.fp}`}</button>`}).join('');
 modal(`<h3>${f.e} ${f.n}</h3><p style="margin:0 0 6px;font-size:13px;color:#7a6a5a">${f.d}<br><b>還剩 ${festEnd(f)} 天</b>・目前 ${f.te} <b style="font-size:16px">${o.tok}</b> ${f.tn}</p>
 <div class="ftask"><span style="font-size:24px">📅</span><span class="fb">今日活動簽到<small>每天來看看就送</small></span>${o.ci?'<b style="color:#45b37a">✔ 已領</b>':`<button class="btn" onclick="festClaim('ci')">${f.te}${FCHECK}</button>`}</div>
 ${xm?`<div class="ftask" style="background:#fff4d6"><span style="font-size:24px">🎅</span><span class="fb"><b>聖誕節禮物</b><small>12/24、12/25 限定</small></span>${o.xm?'<b style="color:#45b37a">✔ 已領</b>':`<button class="btn" onclick="festClaim('xm')">${f.te}${FXMAS}</button>`}</div>`:''}
 <b style="font-size:14px">今日活動任務</b>${ts}
 <b style="font-size:14px;display:block;margin-top:8px">${f.e} 限定兌換（活動結束就換不到囉）</b><div class="fshop">${shop}</div>

 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let h=0;for(let i=0;i<d.length;i+=997)h=(h*31+d[i])>>>0;return {blob,hash:h.toString(36)}}

  {id:'ty3b',cont:1,ep:'3/5',arc:'storm',x:'陳阿姨傳訊息來：「我被困在公司回不去，黑糖可以先拜託你一晚嗎？」黑糖縮在騎樓角落，全身都是水。',o:[['🏠 帶黑糖回家跟 {n} 一起過夜','{n} 一開始有點吃醋，後來主動把自己的軟墊讓出一半……（明天繼續）',{mood:4,aff:3,next:'ty4'}],['💨 先幫黑糖擦乾、吹乾毛','吹風機一開，{n} 也排隊站過來，好像也想被吹一吹……（明天繼續）',{mood:6,aff:2,clean:5,next:'ty4'}]]},
  {id:'ty4',cont:1,ep:'4/5',arc:'storm',x:'半夜突然停電，屋子裡一片漆黑，外面的風聲像在吼。黑糖嚇得一直發抖，{n} 卻慢慢走過去，在牠旁邊趴下來。',o:[['🏕️ 點起露營燈，大家擠在一起','小小的燈光下，你、{n} 和黑糖靠在一起，慢慢都睡著了……（明天繼續）',{mood:6,aff:4,energy:6,next:'ty5'}],['🎵 小聲哼歌給牠們聽','你哼著小時候的歌，{n} 的尾巴跟著節拍輕輕拍地板，黑糖也閉上眼睛了……（明天繼續）',{mood:7,aff:4,next:'ty5'}]]},

  {id:'tn2',cont:1,ep:'2/5',arc:'tnr',x:'林姐說，巷口的貓越來越多，已經有鄰居在抱怨了。她想試試「TNR」：把貓抓去結紮、打疫苗，再放回原來的地方。',o:[['🙋 報名當誘捕志工','林姐借你一個誘捕籠，約好明天傍晚一起行動……（明天繼續）',{mood:4,aff:3,next:'tn3a'}],['🗺️ 帶 {n} 幫忙畫浪貓地圖','{n} 的鼻子超靈，找到好幾個貓咪的祕密基地……（明天繼續）',{mood:5,aff:2,energy:-4,next:'tn3b'}]]},

  {id:'cp1',ep:'1/4',arc:'camp',x:'週末天氣很好，你決定第一次帶 {n} 去山上露營。你把帳篷攤在客廳試搭，{n} 第一個鑽進去，不肯出來。',o:[['🎒 幫 {n} 準備專屬的露營包','水碗、牽繩、外套、小毯子，還有牠最愛的玩具。{n} 一直盯著包包……（明天繼續）',{mood:5,aff:2,next:'cp2'}],['🗺️ 先查好營地可不可以帶毛孩','你找到一個「毛孩友善營地」，還有專屬的草地跑跑區……（明天繼續）',{mood:4,aff:2,next:'cp2'}]]},
  {id:'cp2',cont:1,ep:'2/4',arc:'camp',x:'到了營地，到處都是新的味道：青草、營火、隔壁烤肉的香味。{n} 的鼻子動個不停，興奮得原地轉圈。',o:[['🦮 牽著牠慢慢探索營地','你們沿著小溪走了一圈，{n} 認識了一隻也來露營的柯基……（明天繼續）',{mood:7,aff:2,energy:-6,next:'cp3a'}],['⛺ 先一起把帳篷搭好','{n} 叼著營釘跑來跑去，雖然幫倒忙，帳篷還是搭好了……（明天繼續）',{mood:5,aff:3,next:'cp3b'}]]},
  {id:'cp3a',cont:1,ep:'3/4',arc:'camp',x:'柯基的主人邀你們一起烤棉花糖。天色暗下來，營火劈哩啪啦響，{n} 和柯基並排趴在你腳邊。',o:[['🔥 讓 {n} 離營火遠一點','你把牠的軟墊移到安全的地方，{n} 看著火光慢慢瞇起眼睛……（明天繼續）',{mood:5,aff:3,next:'cp4'}],['🌭 分牠一小塊沒調味的烤雞肉','{n} 小口吃完，滿足地舔舔嘴巴。柯基也眼巴巴地看著你……（明天繼續）',{mood:7,aff:2,hunger:8,next:'cp4'}]]},
  {id:'cp3b',cont:1,ep:'3/4',arc:'camp',x:'半夜，帳篷外傳來沙沙的聲音。{n} 突然坐起來，耳朵豎得高高的，緊盯著帳篷門口。',o:[['🔦 打開手電筒看看','原來是一隻小刺蝟在找蟲吃！{n} 看呆了，一動也不敢動……（明天繼續）',{mood:6,aff:2,next:'cp4'}],['🫂 抱著牠說「沒事沒事」','{n} 慢慢放鬆，把頭靠在你手臂上，又睡著了……（明天繼續）',{mood:4,aff:4,energy:5,next:'cp4'}]]},
  {id:'cp4',cont:1,ep:'4/4 完結',arc:'camp',x:'清晨，山谷裡全是雲海。你泡了一杯熱茶，{n} 裹著小毯子坐在你旁邊，一起看太陽慢慢升起來。',o:[['📸 拍一張雲海合照','照片裡的 {n} 頭髮被風吹得亂七八糟，表情卻好滿足。',{mood:10,aff:6,arc:'camp'}],['🧹 一起把營地收拾乾淨','你們把垃圾都帶走，{n} 最後回頭看了營地一眼，好像在說「下次再來」。',{mood:10,aff:6,arc:'camp'}]]},
  {id:'wd1',ep:'1/4',arc:'wed',x:'表姊要結婚了！她傳訊息問：「可以讓 {n} 當我們的毛孩花童嗎？要叼著戒指枕走紅毯喔！」',o:[['💍 一口答應','表姊傳來一堆愛心貼圖。你看著 {n}，牠歪著頭，完全不知道自己接了大任務……（明天繼續）',{mood:5,aff:2,next:'wd2'}],['🤔 先問問 {n} 的意見','你問牠要不要當花童，{n} 用鼻子頂了頂你的手，好像在說「交給我」……（明天繼續）',{mood:5,aff:3,next:'wd2'}]]},
  {id:'wd2',cont:1,ep:'2/4',arc:'wed',x:'婚禮前的練習：從客廳門口走到沙發，嘴裡叼著小枕頭，不能停下來聞東西。{n} 走到一半，看到地上的餅乾屑就停住了。',o:[['🍪 用零食當獎勵慢慢練','走一步給一口，練了十幾次，{n} 終於能一路走到底……（明天繼續）',{mood:4,aff:3,hunger:6,next:'wd3a'}],['🎀 讓牠戴上小領結找感覺','{n} 戴上領結突然變得好神氣，抬頭挺胸走完全程……（明天繼續）',{mood:7,aff:2,next:'wd3b'}]]},

  {id:'wd4',cont:1,ep:'4/4 完結',arc:'wed',x:'交換戒指之後，新郎新娘蹲下來抱了抱 {n}。表姊說：「你是我們婚禮最可愛的小花童！」攝影師幫大家拍了一張大合照。',o:[['📸 讓 {n} 站在正中間','照片洗出來，{n} 站在新人中間，笑得比誰都開心。',{mood:10,aff:6,arc:'wed'}],['🍰 分一小塊毛孩蛋糕給牠','表姊特地準備了毛孩專用的小蛋糕，{n} 吃得滿臉都是奶油。',{mood:10,aff:6,hunger:10,arc:'wed'}]]},
  {id:'sea1',ep:'1/4',arc:'sea',x:'你在手機上看海邊的照片，{n} 湊過來盯著螢幕裡的浪花，耳朵一動一動的。你突然想到：{n} 還沒看過真正的海！',o:[['🗓️ 這個週末就出發','你查好一個可以帶毛孩的沙灘，還準備了遮陽傘和一大瓶飲用水……（明天繼續）',{mood:5,aff:2,next:'sea2'}],['🛁 先在家用水盆讓牠玩玩水','{n} 先用前腳試探，再整張臉湊上去聞，濺得地板都是水……（明天繼續）',{mood:6,aff:2,next:'sea2'}]]},

  {id:'sea4',cont:1,ep:'4/4 完結',arc:'sea',x:'傍晚，夕陽把整片海染成橘色。{n} 全身沾滿沙子，安安靜靜地坐在你旁邊，看著浪一波一波打上來。',o:[['📸 拍一張夕陽剪影','照片裡只看得到你和 {n} 的黑色輪廓，背後是金色的海。這張一定要放進相簿。',{mood:10,aff:6,arc:'sea'}],['🚿 回家前幫牠沖乾淨腳掌','你用清水沖掉牠腳上的沙和鹽，{n} 在回家的車上一下子就睡著了。',{mood:10,aff:6,energy:8,arc:'sea'}]]}],
