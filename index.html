/* 網頁版：用 Firebase 取代 Claude 專用的 db/user 功能 */
(function(){if(window.claude)return;let res;window.__fb=new Promise(r=>res=r);window.__fbResolve=res;
const wrapSnap=s=>({docs:s.docs.map(d=>({id:d.id,exists:d.exists,data:()=>d.data()}))});
window.claude={use:async k=>{if(k==='sample')return null;const fb=await Promise.race([window.__fb,new Promise(r=>setTimeout(()=>r(null),15000))]);if(!fb)return null;
 if(k==='user')return{id:async()=>fb.auth.currentUser&&fb.auth.currentUser.uid,can:async()=>true};
 if(k==='db')return{collection:n=>({onSnapshot:(cb,er)=>fb.db.collection(n).onSnapshot(s=>cb(wrapSnap(s)),er)}),doc:p=>({set:d=>fb.db.doc(p).set(d)})};
 return null}};
try{const r=new URLSearchParams(location.search).get('ref');if(r&&/^[A-Za-z0-9]{10,64}$/.test(r))sessionStorage.setItem('pawRef',r)}catch(e){}
})();

<style>

/* ===== 介面風格 B：糖果果凍 ===== */
:root{--ink:#3B2A55;--sky:#8ED8FF;--yel:#FFD84D;--pink:#FF5C9E;--pk2:#FF8CC0;--mint:#7BE3B5;--blu:#6FCBFF;--lav:#C4A8FF;--org:#FFB36B}
body{background-color:var(--sky);background-image:radial-gradient(#B8E7FF 18%,transparent 19%);background-size:34px 34px;background-attachment:fixed;font-family:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);font-weight:500}
#app{padding-bottom:104px}
.hd{background:#8ED8FFe6}

 const HW=RW*S.rooms;
 S.pets.forEach((p,i)=>{

  const cls=p.clean<30?'dirty':p.mood<35?'sad':'';
  h+=`<div class="pw ${i===S.cur?'sel':''}" data-id="${p.id}" data-i="${i}" onclick="tapPet(${i})" style="left:${e.x}px;bottom:${e.y}%"><div class="bw"><div class="sh"></div><div class="flipper ${e.dir<0?'l':''}"><div class="spr ${cls} ${e.st==='walk'?'walk':''}" style="width:${W}px;height:${H}px;background-image:url(${sp.img});background-size:${W*sp.n}px ${H}px;--w:${W}px;--d:${STG[stage(p)].d}s"></div>${accHTML(p,W,H)}</div><span class="tg">${esc(p.name)}</span>${bb?`<span class="bb">${bb}</span>`:''}</div></div>`;
 });

function placePets(){
 document.querySelectorAll('.pw').forEach(el=>{const p=S.pets[+el.dataset.i];if(!p)return;const e=ENT[p.id];el.style.left=e.x+'px';el.style.bottom=e.y+'%';el.style.zIndex=100-Math.round(e.y*2);const k=1-(e.y-4)/13*.12;el.querySelector('.bw').style.transform=`scale(${k.toFixed(3)})`;el.querySelector('.bw').style.transformOrigin='50% 100%'});
}
let lastT=performance.now();
function petLoop(t){
 const dt=Math.min(.1,(t-lastT)/1000);lastT=t;
 if(tab==='home'&&!G&&S.pets.length){
  const HW=RW*S.rooms;
  S.pets.forEach(p=>{
   const e=ENT[p.id];if(!e)return;const el=document.querySelector(`.pw[data-id="${p.id}"]`);if(!el)return;
   const spr=el.querySelector('.spr'),fl=el.querySelector('.flipper');
   if(e.st==='eat'||e.st==='sleep'){e.t-=dt;if(e.t<=0){e.st='idle';e.t=1+Math.random()*3;setMode(p,'idle')}}
   else if(e.st==='idle'){e.t-=dt;if(e.t<=0&&(phase()==='night'||p.energy<20||p.sick||(p.trait==='lazy'&&Math.random()<.25))&&Math.random()<.55){e.st='sleep';e.t=18+Math.random()*30;setMode(p,'sleep')}
    else if(e.t<=0&&p.energy>=20){e.st='walk';e.tx=30+Math.random()*(HW-60);e.ty=4+Math.random()*13;e.dir=e.tx>e.x?1:-1;fl.classList.toggle('l',e.dir<0);spr.classList.add('walk')}}
   else if(e.st==='walk'){const sp=STG[stage(p)].sp*(p.energy<40?.75:1);const dx=e.tx-e.x;const step=sp*dt;
    if(Math.abs(dx)<=step){e.x=e.tx;e.st='idle';e.t=2+Math.random()*5;spr.classList.remove('walk')}
    else{e.x+=Math.sign(dx)*step;e.y+=(e.ty-e.y)*Math.min(1,dt*.8)}}
  });
  placePets();
 }
 requestAnimationFrame(petLoop);
}

function claimTask(i){const t=S.tasks[i];const def=TASKPOOL.find(x=>x.id===t.id);if(t.got||t.have<def.need)return;t.got=true;S.coins+=TASKREW;stat('task');coinSound();render();toast(`🎉 領到任務獎勵 ${TASKREW} 零用金`);if(S.tasks.every(x=>x.got)){S.shrimp=(S.shrimp||0)+20;save();setTimeout(()=>{toast('🏆 今天 5 個任務全部完成！再送 🦐20 拼幣');render()},900)}}
function tasksHTML(){if(!S.tasks)newTasks();const done=S.tasks.filter(t=>t.got).length;
 return `<div class="card"><div class="nameRow"><b>📋 今日任務</b><span class="lv">${done}/5 已領・每個 ${TASKREW} 零用金</span></div>${S.tasks.map((t,i)=>{const d=TASKPOOL.find(x=>x.id===t.id);const ok=t.have>=d.need;
  return `<div class="row" style="box-shadow:none;background:#fff8f1;margin:6px 0 0"><span style="font-size:22px">${d.e}</span><span class="rt">${d.n}<small>${t.have}/${d.need}</small></span>${t.got?'<button class="btn gray" disabled>已領取</button>':ok?`<button class="btn" onclick="claimTask(${i})">領 ${TASKREW}</button>`:`<button class="btn gray" disabled>未完成</button>`}</div>`}).join('')}</div>`}

function act(k){
 const p=pet(),a=ACT[k];
 if(cnt(p.id,k)>=a.lim)return toast(`今天${a.n}過 ${a.lim} 次囉，明天再來～`);
 if(a.tired&&p.sick)return toast(`${p.name} 生病了，要休息，先帶去看獸醫吧 🏥`);
 if(k==='walk'&&S.wx==='rain')return toast('🌧️ 下雨天不能出門散步，在家陪牠玩吧');
 if(a.tired&&p.energy<15)return toast(`${p.name} 累壞了😪 吃元氣小餅乾或睡一覺吧`);
 const fx={...a.fx};let base=a.coins,msg='';
 if(k==='play'){if(has(p.type==='cat'?'wand':'frisbee'))base*=1.5;if(has(p.type==='cat'?'yarn':'ball'))fx.mood+=8;msg=p.type==='cat'?'撲撲撲！':'追追追！'}
 if(k==='bath'){if(has('shampoo')){S.inv.shampoo--;fx.mood=5;msg='香噴噴🧴'}else{fx.mood=p.type==='cat'?-12:-6;msg=p.type==='cat'?'喵嗚！討厭水😾':'有點不情願…'}}
 if(k==='pet')msg=p.type==='cat'?'呼嚕呼嚕～':'汪～好舒服';
 if(k==='walk'){msg='出門囉！🌳';if(S.wx==='sun'){base*=1.5;msg='好天氣散步☀️'}}
 if(k==='brush')msg='毛毛變蓬鬆✨';
 if(p.trait==='play'&&k==='play'){fx.mood=Math.round(fx.mood*1.5);base+=3}
 if(p.trait==='neat'&&k==='bath'&&fx.mood<5){fx.mood=5;msg='洗澡最舒服了🫧'}
 if(p.trait==='lazy'&&fx.energy)fx.energy=Math.round(fx.energy/2);
 let affA=a.aff;if(p.trait==='cling'&&k==='pet')affA*=2;
 applyFx(p,fx);
 const coins=Math.max(1,Math.round(base*mult(p)));
 S.coins+=coins;S.today[p.id][k]=cnt(p.id,k)+1;addAff(p,affA);task(k==='walk'||k==='brush'?'walkbrush':k);stat('act');
 render();jump();coinSound();
 floatText(`+${coins} 💰`);if(msg)floatText(msg,350);
}

/* ---------- shop ---------- */
function addCart(id){S.cart[id]=(S.cart[id]||0)+1;beep(760,.06);render();toast(`${IT[id].e} 已加入購物車`)}
const CASHBACK=.2;
function cartCalc(){
 const E=Object.entries(S.cart);
 const sub=E.filter(([k])=>!isW(IT[k])).reduce((a,[k,v])=>a+price(IT[k])*v,0);

 const coupon=sub>=100?10:0;const ship=S.ship==='exp'?15:(sub>=80||sub===0?0:6);
 const total=sub-coupon+ship;
 return{sub,coupon,ship,total,shrimp,back:Math.floor(sub*CASHBACK)};
}

function sleepNow(){closeModal();const n=document.createElement('div');n.id='night';n.innerHTML='<div>🌙</div>Zzz… 晚安';document.body.appendChild(n);beep(392,.3,'sine',.05);setTimeout(doSleep,900);setTimeout(()=>n.remove(),1650)}
function doSleep(){
 S.day++;const rep=[];
 S.pets.forEach(p=>{const hungry=p.hunger<20;p.energy=100;p.mood=clamp(p.mood-8-(hungry?12:0)-(p.clean<20?6:0));p.hunger=clamp(p.hunger-(p.trait==='food'?28:22));p.clean=clamp(p.clean-(p.trait==='neat'?6:12));

function gSpawn(){
 const r=Math.random();let e,val;
 if(r<.08){e='⭐';val=3}else if(r<.28){e=Math.random()<.5?'🌶️':'🧅';val=-2}else{e=G.good[Math.floor(Math.random()*3)];val=1}

 el.style.left=it.x+'px';el.style.transform=`translateY(${it.y}px)`;
 el.addEventListener('pointerdown',ev=>{ev.preventDefault();gHit(it)});

function gHit(it){

function gLoop(ts){

}

    const pop=document.createElement('div');pop.className='gpop';pop.textContent=it.v>0?'+'+it.v:it.v;pop.style.color=it.v>0?'#2f9e5b':'#e04848';pop.style.left=it.x+'px';pop.style.top=it.cy+'px';area.appendChild(pop);setTimeout(()=>pop.remove(),800);

   area.appendChild(el);G.items.push(it)};
  const loop=ts=>{if(!G||!G.on)return;const dt=Math.min(.05,(ts-G.last)/1000);G.last=ts;G.spawn-=dt;if(G.spawn<=0){spawn();G.spawn=.45+Math.random()*.4}
   G.items.forEach(it=>{if(it.dead)return;it.x+=it.dir*it.sp*dt;it.ph+=dt*it.f;it.cy=it.by+Math.sin(it.ph)*it.amp;it.el.style.transform=`translate(${it.x}px,${it.cy}px) scaleX(${-it.dir})`;if(it.x<-70||it.x>W+70){it.dead=true;it.el.remove()}});
   G.items=G.items.filter(i=>!i.dead);G.t-=dt;document.getElementById('gt').textContent='⏱ '+Math.max(0,Math.ceil(G.t));

 mgOpen(p,`${esc(p.name)} 的賽跑大賽！`,'一直點下面的「衝！」按鈕<br>點越快跑越快，搶第一名！',(ov,area)=>{

  const tw=area.querySelector('.track').clientWidth-80;let boost=0,order=[],go=false,t0=0;
  const dash=area.querySelector('#dash');dash.addEventListener('pointerdown',e=>{e.preventDefault();if(go){boost=Math.min(11,boost+1.6);beep(400+boost*30,.03,'square',.02)}});
  let c=3;const cd=setInterval(()=>{c--;const el=area.querySelector('#rcnt');beep(c?520:1046,.15);if(c>0)el.textContent=c;else{el.textContent='GO!';setTimeout(()=>el.remove(),500);clearInterval(cd);go=true;dash.disabled=false;G.last=performance.now();t0=G.last;requestAnimationFrame(loop)}},700);
  G={on:true,last:0};
  const loop=ts=>{if(!G||!G.on)return;const dt=Math.min(.05,(ts-G.last)/1000);G.last=ts;
   R.forEach((r,i)=>{if(r.done)return;if(r.me){boost*=Math.pow(.35,dt);r.v=3+boost}else{r.v=r.base+Math.sin(ts/600+i)*1.5}

   if(order.some(r=>r.me)){

   requestAnimationFrame(loop)};
 },false);

 const comp=a.createDynamicsCompressor();comp.connect(out);
 const dur=.85+Math.random()*.25;const o=a.createOscillator();o.type='sawtooth';const f0=520*k;
 o.frequency.setValueAtTime(f0*.85,t);o.frequency.linearRampToValueAtTime(f0*1.45,t+dur*.3);o.frequency.linearRampToValueAtTime(f0*1.25,t+dur*.6);o.frequency.exponentialRampToValueAtTime(f0*.75,t+dur);

 [[1,900,1900,1100,6],[.6,2600,3400,2400,8]].forEach(([amp,a1,a2,a3,q])=>{const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;bp.frequency.setValueAtTime(a1*k**.5,t);bp.frequency.linearRampToValueAtTime(a2*k**.5,t+dur*.35);bp.frequency.linearRampToValueAtTime(a3*k**.5,t+dur);const ga=a.createGain();ga.gain.value=amp*2.2;g.connect(bp);bp.connect(ga);ga.connect(comp)});

 const bp=a.createBiquadFilter();bp.type='peaking';bp.frequency.value=1100*k**.5;bp.gain.value=9;bp.Q.value=1.5;
 const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);
 const nb=a.createBuffer(1,a.sampleRate*.08,a.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);const n=a.createBufferSource();n.buffer=nb;const nf=a.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1500*k**.5;nf.Q.value=1;const ng=a.createGain();ng.gain.value=.55;
 o.connect(ws);ws.connect(lp);lp.connect(bp);bp.connect(g);g.connect(dest);n.connect(nf);nf.connect(ng);ng.connect(dest);o.start(t);o.stop(t+d+.02);n.start(t)}

 i.onchange=()=>{const f=i.files&&i.files[0];i.remove();if(!f)return;if(!/^image\//.test(f.type))return toast('請選一張照片');

   let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>22000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}

 i.click()}
