const wrapSnap=s=>({docs:s.docs.map(d=>({id:d.id,exists:d.exists,data:()=>d.data()}))});
window.claude={use:async k=>{if(k==='sample')return null;const fb=await Promise.race([window.__fb,new Promise(r=>setTimeout(()=>r(null),15000))]);if(!fb)return null;
 if(k==='user')return{id:async()=>fb.auth.currentUser&&fb.auth.currentUser.uid,can:async()=>true};
 if(k==='db')return{collection:n=>({onSnapshot:(cb,er)=>fb.db.collection(n).onSnapshot(s=>cb(wrapSnap(s)),er)}),doc:p=>({set:d=>fb.db.doc(p).set(d)})};
 return null}};

const BGMSRC={day:'a/bgm_day.mp3',night:'a/bgm_night.mp3'};
let BG={a:null,b:null,cur:null,on:false,track:null,timer:null};
function bgmPref(){return S&&S.music!==false}
function bgmTrack(){const h=new Date().getHours();return h>=6&&h<18?'day':'night'}
function bgmEl(src){const a=new Audio(src);a.preload='auto';a.volume=0;return a}
function fade(a,to,ms){if(!a)return;const from=a.volume,t0=performance.now();const step=()=>{const k=Math.min(1,(performance.now()-t0)/ms);try{a.volume=from+(to-from)*k}catch(e){}if(k<1)requestAnimationFrame(step);else if(to===0)a.pause()};step()}
function bgmPlay(){const tr=bgmTrack();if(BG.on&&BG.track===tr)return;BG.track=tr;BG.on=true;
 const old=BG.cur;const a=bgmEl(BGMSRC[tr]);BG.cur=a;
 a.addEventListener('timeupdate',()=>{if(a.duration&&a.currentTime>a.duration-4&&!a._x){a._x=1;const n=bgmEl(BGMSRC[BG.track]);BG.cur=n;n.play().catch(()=>{});fade(n,.35,3500);fade(a,0,3500)}});
 a.play().then(()=>fade(a,.35,2500)).catch(()=>{BG.on=false;BG.track=null});if(old)fade(old,0,2000)}
function bgmStop(){BG.on=false;BG.track=null;if(BG.cur)fade(BG.cur,0,800)}
function sndMode(){return S.music===false?(S.calls===false?2:1):0}
function toggleMusic(){const m=(sndMode()+1)%3;S.music=m===0;S.calls=m!==2;save();S.music?bgmPlay():bgmStop();render();toast(['🔊 音樂＋叫聲都開','🐾 只開毛孩叫聲','🔇 全部靜音'][m])}
document.addEventListener('pointerdown',()=>{if(bgmPref()&&!BG.on)bgmPlay()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgmStop();else if(bgmPref())setTimeout(bgmPlay,300)});
setInterval(()=>{if(BG.on&&BG.track!==bgmTrack()){BG.on=false;bgmPlay()}},60000);

let AC=null;
function beep(f=660,d=.08,type='sine',v=.08){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}

function petLoop(t){

   if(e.st==='eat'||e.st==='sleep'){e.t-=dt;if(e.t<=0){e.st='idle';e.t=1+Math.random()*3;setMode(p,'idle')}}
   else if(e.st==='idle'){e.t-=dt;if(e.t<=0&&(phase()==='night'||p.energy<20||p.sick||(p.trait==='lazy'&&Math.random()<.25))&&Math.random()<.55){e.st='sleep';e.t=18+Math.random()*30;setMode(p,'sleep')}

    else{e.x+=Math.sign(dx)*step;e.y+=(e.ty-e.y)*Math.min(1,dt*.8)}}
  });
  placePets();
 }
 requestAnimationFrame(petLoop);
}

/* ---------- 觸摸部位：摸頭、搔下巴、戳肚子、摸背、碰尾巴（2026-11-17） ---------- */
const SPOTS={head:'頭頂',chin:'下巴',belly:'肚子',back:'背'};
function petSpot(p){if(!p.spot){const k=Object.keys(SPOTS);p.spot=k[Math.floor(Math.random()*k.length)]}return p.spot}
function touchZone(i,ev){
 const p=S.pets[i];if(!p||!ev||ev.clientX===undefined)return null;const e=ENT[p.id];if(e&&(e.st==='eat'||e.st==='sleep'))return null;
 const el=document.querySelector(`.pw[data-i="${i}"] .spr`);if(!el)return null;const a=SP(p).anc;if(!a||!a.head)return null;
 const r=el.getBoundingClientRect();if(!r.width)return null;
 let x=(ev.clientX-r.left)/r.width*100;const y=(ev.clientY-r.top)/r.height*100;
 if(el.closest('.flipper').classList.contains('l'))x=100-x;
 const [hx,hy]=a.head,fy=a.face?a.face[1]:hy+11,ny=a.neck?a.neck[1]:fy+11;
 const right=hx>50,dx=right?hx-x:x-hx;// dx>0 = 往身體方向
 const ad=Math.abs(x-hx);
 let z;
 if(ad<20&&y<fy-1)z='head';
 else if(ad<20&&y<ny+12)z='chin';
 else if(dx>62)z='tail';
 else if(y>55&&dx>8)z='belly';
 else z=ad<24?'chin':'back';
 return {z,x:right?x:x,y,lx:(ev.clientX-r.left)/r.width*100,ly:y};
}
function touchPop(p,emo,lx,ly){const w=document.querySelector(`.pw[data-id="${p.id}"] .bw`);if(!w)return;emo.forEach((t,k)=>{const f=document.createElement('div');f.className='thp';f.textContent=t;f.style.left=Math.max(5,Math.min(95,lx))+'%';f.style.top=Math.max(-10,Math.min(80,ly-14))+'%';f.style.setProperty('--dx',((k-(emo.length-1)/2)*16)+'px');f.style.animationDelay=(k*.08)+'s';w.appendChild(f);setTimeout(()=>f.remove(),1300)})}
function touchAnim(p,cls){const w=document.querySelector(`.pw[data-id="${p.id}"]`);if(!w)return;w.classList.remove('t-head','t-chin','t-belly','t-back','t-tail','t-no','jump');void w.offsetWidth;w.classList.add(cls);clearTimeout(w._tt);w._tt=setTimeout(()=>w.classList.remove(cls),1000)}

/* ---------- 毛孩護照（每月通行證） ---------- */
const PASSLV=30,PASSXP=50,PXCAP=120;
const PXMAP={act:2,feed:2,social:2,mg:5,task:5,visit:5,vet:5,perform:5,train:3,gacha:3,wish:10,login:10,trip:10,surprise:5,story:5};
function passKey(){const d=new Date();return d.getFullYear()*100+d.getMonth()+1}
function pass(){const k=passKey();if(!S.pass||S.pass.k!==k)S.pass={k,xp:0,got:[]};return S.pass}
function passLv(){return Math.min(PASSLV,Math.floor(pass().xp/PASSXP))}
function passXP(k,n){const x=(PXMAP[k]||0)*n;if(!x||!S)return;S.today=S.today||{};const e=S.today.px||0,g=Math.max(0,Math.min(x,PXCAP-e));if(!g)return;
 const b=passLv();S.today.px=e+g;pass().xp+=g;const a=passLv();if(a>b){S.passBest=Math.max(S.passBest||0,a);setTimeout(()=>{toast(`📘 毛孩護照升到 Lv.${a}！去「收集」領獎勵`);beep(988,.1,'triangle',.05)},1100)}}
function passMon(){return pass().k%100}
function passRew(L){const m=passMon();if(L%10===0)return{item:`ps_${m}_${L/10}`,s:30};if(L===25)return{s:30,inv:['cake',1]};if(L%5===0)return{s:30,inv:['cookie',2]};if(L%2===0)return{s:10};return{c:60}}
function rewIcon(r){return r.item?IT[r.item].e:r.inv?IT[r.inv[0]].e:r.s?'🦐':'💰'}
function rewTxt(r){return [r.item?IT[r.item].e+IT[r.item].name:'',r.inv?IT[r.inv[0]].e+'×'+r.inv[1]:'',r.c?'💰'+r.c:'',r.s?'🦐'+r.s:''].filter(Boolean).join(' ')}
function passReady(){const P=pass(),L=passLv(),o=[];for(let i=1;i<=L;i++)if(!P.got.includes(i))o.push(i);return o}
function claimPass(L){const P=pass();if(L>passLv()||P.got.includes(L))return;const r=passRew(L);P.got.push(L);
 if(r.c)S.coins+=r.c;if(r.s)S.shrimp=(S.shrimp||0)+r.s;if(r.inv)S.inv[r.inv[0]]=(S.inv[r.inv[0]]||0)+r.inv[1];if(r.item){S.inv[r.item]=(S.inv[r.item]||0)+1;diary(`📘 得到毛孩護照限定 ${IT[r.item].e}${IT[r.item].name}`)}

 else toast(`📘 領了 ${ls.length} 個護照獎勵`)}
function passLeft(){const d=new Date(),e=new Date(d.getFullYear(),d.getMonth()+1,1);return Math.ceil((e-d)/864e5)}

 return `<div class="row" style="cursor:pointer;background:linear-gradient(90deg,#efe6ff,#fff)" onclick="go('col')"><span class="re">📘</span><span class="rt"><b>毛孩護照 Lv.${L}/${PASSLV}</b><small>今天護照經驗 ${t}/${PXCAP}${r?`・<b style="color:#d9662f">${r} 個獎勵可領</b>`:''}</small></span><button class="btn" style="background:#8a5cff">看看</button></div>`}
function passHTML(){const P=pass(),L=passLv(),m=passMon(),cur=P.xp-L*PASSXP,t=(S.today&&S.today.px)||0,rd=passReady();

 <p style="font-size:12px;color:#7d6aa0;margin:4px 0">本月限定：${lim.map((it,k)=>`${it.e}${it.name}<small>(Lv.${(k+1)*10})</small>`).join('、')}</p>

 ${rd.length?`<div class="mbtns" style="margin-top:8px"><button class="btn" style="background:#8a5cff" onclick="claimPassAll()">🎁 一次領取 ${rd.length} 個獎勵</button></div>`:''}</div>`}

const SP_MIN=120,SP_MAX=180,SP_DAY=8,SP_GRACE=90,SP_PITY=15,SP_TAPS=5;
const SPT={n:['普通','#b08a6a'],r:['稀有','#3d8fd8'],sr:['超稀有','#a24de0'],lg:['傳說','#e09a00']};
function sp(){const t=todayStr();if(!S.sp)S.sp={next:Date.now(),streak:0,best:0,pity:0,d:t,dn:0};if(S.sp.d!==t){S.sp.d=t;S.sp.dn=0}return S.sp}
function spReady(){if(!S||!S.pets||!S.pets.length)return false;const o=sp();return o.dn<SP_DAY&&Date.now()>=o.next}
function hm(ms){const m=Math.max(1,Math.ceil(ms/6e4)),h=Math.floor(m/60);return h?`${h} 小時 ${m%60} 分`:`${m} 分鐘`}
function clk(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
// 晚上 0～8 點不算遲到
function awakeMin(a,b){if(b<=a)return 0;if(b-a>3*864e5)return 1e9;let m=0;for(let t=a;t<b;t+=5*6e4)if(new Date(t).getHours()>=8)m+=5;return m}
function spBtn(){const o=sp();if(!S.pets.length)return'';
 if(spReady()){const p=S.pets[(o.dn+o.pity)%S.pets.length];return `<button class="big spb" onclick="openSurprise()">🎁 ${esc(p.name)} 叼來一份驚喜禮物！<span style="display:block;font-size:12px;font-weight:normal">快來摸摸牠打開・可能開出稀有禮物✨</span></button>`}
 const full=o.dn>=SP_DAY;
 return `<div class="spw"><span style="font-size:26px">🎁</span><span style="flex:1"><b>${full?'今天的驚喜禮物都收完了':'下一份驚喜禮物'}</b><br><span style="color:#a08670" id="spT">${full?'明天早上再來喔':`還有 ${hm(o.next-Date.now())}（${clk(o.next)}）`}</span>${window.pawPushBtn?'<br>'+pawPushBtn():''}</span><span style="text-align:right;font-size:12px;color:#d0577a;font-weight:700">黏人度<br>${'❤️'.repeat(Math.min(o.streak,5))}${o.streak>5?'+'+(o.streak-5):''}${o.streak?'':'－'}</span></div>`}
let spWas=null;
function spTick(){if(!S||!S.pets||!S.pets.length)return;const r=spReady();document.title=r?'🎁 毛孩有禮物要給你！':'毛孩零用錢日記';
 if(spWas!==null&&r!==spWas&&tab==='home'&&!document.querySelector('#modal:not(.hidden),#game,#ov3d')){render()}
 else{const e=document.getElementById('spT'),o=sp();if(e&&o.dn<SP_DAY&&!r)e.textContent=`還有 ${hm(o.next-Date.now())}（${clk(o.next)}）`}
 if(r&&spWas===false){toast('🎁 毛孩叼來驚喜禮物了！快去「我的家」看看');beep(988,.1,'triangle',.05)}spWas=r}
let spTap=0;
function openSurprise(){if(!spReady())return render();const o=sp(),p=S.pets[(o.dn+o.pity)%S.pets.length];spTap=0;beep(784,.08);
 modal(`<h3>🎁 ${esc(p.name)} 叼來一份禮物</h3><p style="text-align:center;margin:0">牠想先撒嬌一下～<b>摸摸牠 ${SP_TAPS} 下</b>就打開禮物</p>
 <div class="sppet" id="spP" onclick="spPat()">${thumb(p.breed,stage(p),120,p.acc.body)}<span style="position:absolute;top:0;right:22%;font-size:40px">🎁</span></div>
 <p style="text-align:center;font-size:20px;font-weight:800;margin:4px 0" id="spC">🤲 0/${SP_TAPS}</p>
 <p style="text-align:center;font-size:12px;color:#a08670;margin:0">準時回來（禮物出現 90 分鐘內）黏人度 +1，稀有機率會越來越高<br>晚上 12 點到早上 8 點不算遲到喔</p><div class="mbtns"><button class="btn gray" onclick="closeModal()">等一下</button></div>`)}
function spPat(){if(spTap>=SP_TAPS)return;spTap++;const el=document.getElementById('spP'),c=document.getElementById('spC');if(!el)return;
 const h=document.createElement('span');h.className='sph';h.textContent=['💕','❤️','💖','✨','😻'][spTap%5];h.style.left=(30+Math.random()*40)+'%';h.style.top=(10+Math.random()*40)+'%';el.appendChild(h);setTimeout(()=>h.remove(),900);
 beep(600+spTap*90,.06,'triangle',.05);c.textContent=`🤲 ${spTap}/${SP_TAPS}`;if(spTap>=SP_TAPS)setTimeout(spOpen,350)}
function spRoll(st,pity){const r=Math.random(),lg=.01+st*.002,sr=lg+.05+st*.008;if(pity>=SP_PITY)return r<.15?'lg':'sr';return r<lg?'lg':r<sr?'sr':r<sr+.28?'r':'n'}
function spOpen(){if(!spReady())return;const o=sp(),now=Date.now(),p=S.pets[(o.dn+o.pity)%S.pets.length];
 const late=awakeMin(o.next,now)>SP_GRACE;o.streak=late?1:Math.min(10,o.streak+1);o.best=Math.max(o.best||0,o.streak);o.pity++;
 const tier=spRoll(o.streak,o.pity),pk=a=>a[Math.floor(Math.random()*a.length)],ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));let e,txt;
 const give=(id,n=1)=>{S.inv[id]=(S.inv[id]||0)+n;e=IT[id].e;txt=IT[id].name+(n>1?' ×'+n:'')};
 if(tier==='n'){if(Math.random()<.5){const n=ri(20,40);S.coins+=n;e='💰';txt=`零用金 ${n}`}else give(pk(['puree','cookie',p.type==='cat'?'can':'jerky',p.type==='cat'?'catnip':'bone']))}
 else if(tier==='r'){const r=Math.random();if(r<.5){const n=ri(15,25);S.shrimp=(S.shrimp||0)+n;e='🦐';txt=`拼幣 ${n}`}else if(r<.75)give('cake');else give(pk(['can','jerky'].filter(k=>fits(IT[k],p))),3)}
 else{o.pity=0;stat('srgift');const pool=ITEMS.filter(i=>i.rg&&(tier==='lg'?i.legend:!i.legend)&&!has(i.id));
  if(tier==='lg'&&(Math.random()<.5||!pool.length)){S.petTicket=(S.petTicket||0)+1;e='🐾';txt='神秘毛孩領養券'}
  else if(pool.length)give(pk(pool).id);else{S.shrimp=(S.shrimp||0)+50;S.coins+=100;e='💎';txt='🦐50 ＋ 💰100（配件都收集齊了！）'}
  diary(`🎁 ${p.name} 送來${SPT[tier][0]}禮物：${e}${txt}`);mom(p,'sr_'+Date.now(),'🌟',`${p.name} 送來${SPT[tier][0]}禮物 ${e}`,1)}
 o.dn++;o.next=now+ri(SP_MIN,SP_MAX)*6e4;addAff(p,3);p.mood=clamp(p.mood+10);stat('surprise');save();spWas=false;window.pawPushSync&&pawPushSync();
 const big=tier==='sr'||tier==='lg';(big?[784,988,1175,1568,2093]:[784,988,1175]).forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.06),i*110));coinSound();
 modal(`<div style="text-align:center"><span class="tier" style="background:${SPT[tier][1]}">${SPT[tier][0]}${big?' ✨':''}</span>
 <div class="${big?'gshake':''}" style="font-size:84px;margin:10px 0;${big?`filter:drop-shadow(0 0 12px ${SPT[tier][1]})`:''}">${e}</div>
 <p style="font-size:18px;font-weight:800;margin:0">${txt}</p><p style="margin:6px 0">${esc(p.name)} 親密度 +3・心情 +10</p>
 <p style="font-size:13px;color:#a08670;margin:6px 0">${late&&o.dn>1?'💔 這次晚了一點，黏人度重新算<br>':''}黏人度 ${o.streak}/10・${o.dn>=SP_DAY?'今天的禮物都收完了，明天見！':`下一份大約 ${clk(o.next)} 出現`}</p></div>
 <div class="mbtns"><button class="btn" onclick="closeModal();render()">${big?'太幸運了！':'收下'}</button></div>`)}
function rgHTML(){const rs=ITEMS.filter(i=>i.rg),n=rs.filter(i=>has(i.id)).length,o=sp();
 return `<div class="card"><div class="nameRow"><b>🎁 稀有禮物收藏</b><span class="lv">${n}/${rs.length}・黏人度 ${o.streak}/10</span></div>
 ${window.pawPushBtn&&pawPushState()!=='on'?`<div style="margin:6px 0">${pawPushBtn()} <small style="color:#a08670">開啟後遊戲關著也會提醒你</small></div>`:''}<p style="font-size:11.5px;color:#a08670;margin:2px 0 0">每 2～3 小時毛孩會叼來驚喜禮物（每天最多 ${SP_DAY} 份）。準時回來，黏人度越高，超稀有和傳說的機率越高；連續 ${SP_PITY} 份沒開到超稀有，下一份一定是超稀有以上。</p>
 <div class="rgs">${rs.map(i=>`<div class="${has(i.id)?'':'no'}" title="${i.name}">${i.e}<small>${has(i.id)?i.name.replace('傳說',''):(i.legend?'傳說':'超稀有')}</small></div>`).join('')}</div></div>`}




/* ---------- 小遊戲：節奏拍拍 ---------- */
function beatGame(p){
 mgOpen(p,`跟 ${esc(p.name)} 一起打拍子！`,'腳印掉到粉紅線上時點那一排<br>越準分數越高，連擊有加分・30 秒',(ov,area)=>{
  const W=Math.min(area.clientWidth-16,380),H=Math.max(360,Math.min(area.clientHeight-20,520)),LN=3,lw=W/LN,hitY=H-118,FALL=1.6,BEAT=.6,DUR=30;
  const cols=['#ffb3cf','#ffe27a','#a8e6ff'],tones=[523,659,784],em=p.type==='cat'?['🐾','🐟','🐾']:['🐾','🦴','🐾'];
  area.innerHTML=`<div class="bt" style="width:${W}px;height:${H}px">${[1,2].map(k=>`<div class="ln" style="left:${k*lw}px"></div>`).join('')}<div class="hl" style="top:${hitY-3}px"></div><div class="cmb" id="bcmb"></div><div class="bpet" id="bpet">${thumb(p.breed,stage(p),70,p.acc.body)}</div>${[0,1,2].map(k=>`<button class="pad" data-l="${k}" style="left:${k*lw+6}px;width:${lw-12}px;background:${cols[k]}">${em[k]}</button>`).join('')}</div>`;
  const bt=area.querySelector('.bt'),cmbEl=area.querySelector('#bcmb'),petEl=area.querySelector('#bpet');
  // 譜面：每拍一顆，偶爾加半拍、雙押
  const notes=[];let rnd=7;const R=()=>{rnd=(rnd*9301+49297)%233280;return rnd/233280};
  for(let b=4;b*BEAT<DUR-1;b++){const t=b*BEAT,l=Math.floor(R()*3);notes.push({t,l,gold:R()<.1});if(b>12&&R()<.28)notes.push({t:t+BEAT/2,l:(l+1+Math.floor(R()*2))%3});if(b>30&&R()<.12)notes.push({t,l:(l+1)%3})}
  notes.forEach(n=>{n.el=null;n.done=0});
  let t0=performance.now()/1000,score=0,combo=0,best=0,per=0,good=0,miss=0,lastBeat=-1,ended=false;G={on:true};
  const hd=()=>{document.getElementById('gs').textContent='得分 '+score};hd();
  const judge=(n,dt)=>{const a=Math.abs(dt);if(a<=.09)return'P';if(a<=.18)return'G';return null};
  const show=(txt,col,l)=>{const j=document.createElement('div');j.className='jd';j.textContent=txt;j.style.color=col;j.style.left=(l*lw+lw/2)+'px';j.style.top=(hitY-56)+'px';bt.appendChild(j);setTimeout(()=>j.remove(),620)};
  const hit=l=>{if(!G||!G.on)return;const now=performance.now()/1000-t0;const pad=bt.querySelector(`.pad[data-l="${l}"]`);pad.classList.add('dn');setTimeout(()=>pad.classList.remove('dn'),90);
   let bestN=null,bd=9;notes.forEach(n=>{if(n.done||n.l!==l)return;const d=now-n.t;if(Math.abs(d)<Math.abs(bd)){bd=d;bestN=n}});
   const j=bestN&&judge(bestN,bd);if(!j){beep(200,.04,'square',.02);return}
   bestN.done=1;if(bestN.el){bestN.el.remove();bestN.el=null}combo++;best=Math.max(best,combo);
   const base=(j==='P'?2:1)*(bestN.gold?2:1),bonus=combo>=20?2:combo>=10?1:0;score+=base+(j==='P'?bonus:0);j==='P'?per++:good++;
   beep(tones[l]*(j==='P'?1:.94),.09,'triangle',.06);show(j==='P'?(bestN.gold?'✨完美!':'完美!'):'不錯',j==='P'?'#ee3c8a':'#3d8fd8',l);
   cmbEl.textContent=combo>=3?`${combo} 連擊！`:'';petEl.classList.remove('bop');void petEl.offsetWidth;petEl.classList.add('bop');hd()};
  bt.querySelectorAll('.pad').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();hit(+b.dataset.l)}));
  const end=()=>{if(ended)return;ended=true;G.on=false;const all=miss===0&&good+per===notes.length;if(all)stat('beatall');
   mgFinish(p,ov,area,`<div style="font-size:56px">${all?'🏆':'🥁'}</div><b style="font-size:22px">得分 ${score}・最高 ${best} 連擊</b><div style="font-size:13px">完美 ${per}・不錯 ${good}・漏掉 ${miss}</div>`,score*.15,all?3:0)};
  const loop=()=>{if(!G||!G.on||ended)return;const now=performance.now()/1000-t0;
   const bi=Math.floor(now/BEAT);if(bi!==lastBeat&&bi>=0&&now<DUR){lastBeat=bi;if(bi<4)beep(bi===3?880:660,.05,'sine',.05);else if(bi%4===0)beep(330,.03,'sine',.025)}
   notes.forEach(n=>{if(n.done)return;const dt=n.t-now;if(dt>FALL){return}
    if(!n.el){n.el=document.createElement('div');n.el.className='nt'+(n.gold?' gold':'');n.el.textContent=n.gold?'⭐':em[n.l];n.el.style.left=(n.l*lw+lw/2)+'px';n.el.style.top='0px';bt.appendChild(n.el)}
    const y=hitY-dt/FALL*(hitY+30);n.el.style.transform=`translateY(${y}px)`;
    if(dt<-.2){n.done=1;n.el.remove();n.el=null;miss++;combo=0;cmbEl.textContent='';show('漏掉','#a08670',n.l)}});
   document.getElementById('gt').textContent='⏱ '+Math.max(0,Math.ceil(DUR-now));
   if(now>DUR+.3||notes.every(n=>n.done)&&now>notes[notes.length-1].t+.3)return end();requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
 });
}

const EVCAT={all:['通用','🌈']};
function evBookHTML(){const seen=S.evSeen||{},n=EVALL.filter(e=>seen[e.id]).length;
 const cats=Object.keys(EVS).map(k=>{const t=TRAITS[k]||{n:EVCAT[k]?EVCAT[k][0]:k,e:EVCAT[k]?EVCAT[k][1]:'💭'};const L=EVS[k];

function evRead(id){const e=EVALL.find(x=>x.id===id);if(!e)return;const f=s=>esc(s.replace(/\{n\}/g,'毛孩'));
 modal(`<h3>📖 小劇情回顧</h3><p class="evtx">${f(e.x)}</p>${e.o.map(q=>`<div style="background:#f6f2ff;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:13px"><b>${esc(q[0])}</b><br><span style="color:#6b5a50">→ ${f(q[1])}</span></div>`).join('')}<p style="font-size:12px;color:#a08670;text-align:center">遇過 ${(S.evSeen||{})[id]||0} 次</p><div class="mbtns"><button class="btn gray" onclick="go('col');closeModal()">返回</button></div>`)}

/* ---------- 順毛連擊（在毛孩身上來回滑動） ---------- */
const STROKE_N=6,STROKE_DAY=3;const ST={on:0};
function strokeInit(box){if(!box||box._st)return;box._st=1;
 box.addEventListener('pointerdown',e=>{const w=e.target.closest('.pw');if(!w)return;const i=+w.dataset.i,p=S.pets[i];if(!p)return;const en=ENT[p.id];if(en&&(en.st==='eat'||en.st==='sleep'))return;
  Object.assign(ST,{on:1,i,pid:e.pointerId,x:e.clientX,y:e.clientY,d:0,mv:0,n:0,lx:0})},{passive:true});
 box.addEventListener('pointermove',e=>{if(!ST.on||e.pointerId!==ST.pid)return;const dx=e.clientX-ST.x,dy=e.clientY-ST.y;ST.x=e.clientX;ST.y=e.clientY;const a=Math.hypot(dx,dy);ST.d+=a;ST.mv+=a;
  if(ST.mv>12){const q=S.pets[ST.i],en=q&&ENT[q.id];if(en&&en.st==='walk'){en.st='idle';setMode(q,'idle');const sp=document.querySelector(`.pw[data-id="${q.id}"] .spr`);if(sp)sp.classList.remove('walk')}if(en&&en.st==='idle')en.t=Math.max(en.t,3)}
  if(ST.d>=36){ST.d=0;ST.n++;strokeTick(e)}},{passive:true});
 const end=()=>{if(!ST.on)return;if(ST.mv>12)window._noTap=Date.now();const w=document.querySelector(`.pw[data-i="${ST.i}"] .stc`);if(w)setTimeout(()=>w.remove(),500);ST.on=0};
 box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);box.addEventListener('pointerleave',end)}
function strokeTick(e){const p=S.pets[ST.i];if(!p)return;const w=document.querySelector(`.pw[data-id="${p.id}"]`);if(!w)return;
 const r=w.getBoundingClientRect();touchPop(p,[ST.n%2?'💕':'✨'],(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);beep(520+ST.n*60,.04,'triangle',.03);
 let c=w.querySelector('.stc');if(!c){c=document.createElement('div');c.className='stc';w.appendChild(c)}
 const k=ST.n%STROKE_N||STROKE_N;c.textContent=k<STROKE_N?`順毛 ${k}/${STROKE_N}`:'💗 好舒服！';
 if(ST.n%STROKE_N===0)strokeCombo(p,w)}
function strokeCombo(p,w){S.today.stroke=S.today.stroke||{};const n=S.today.stroke[p.id]||0,cat=p.type==='cat';
 touchAnim(p,cat?'t-purr':'t-flip');floatOn(p,'💬 '+(cat?tpick(['呼嚕呼嚕呼嚕呼嚕…','(瞇成一條線)咕嚕～','(整隻軟掉)喵～']):tpick(['(咚！翻肚肚)','汪～不要停！','(後腳一直踢)'])));
 try{navigator.vibrate&&navigator.vibrate(cat?[30,40,30,40,30]:60)}catch(e){}
 [660,880,1175].forEach((f,k)=>setTimeout(()=>beep(f,.08,'triangle',.05),k*80));
 if(n<STROKE_DAY){S.today.stroke[p.id]=n+1;p.mood=clamp(p.mood+5);addAff(p,1);stat('stroke');wishHit(p,'pet');
  if(!(S.st&&S.st.stroke>1))mom(p,'stroke1',cat?'😻':'🐶',`${p.name} 第一次被順毛到${cat?'呼嚕':'翻肚'}`);
  setTimeout(()=>toast(`💗 ${p.name} 被順毛到${cat?'呼嚕呼嚕':'翻肚肚'}！心情 +5・親密度 +1（今天 ${n+1}/${STROKE_DAY}）`),500)}

function mom(p,key,e,txt,multi){if(!p||!S)return;S.album=S.album||[];const k=p.id+':'+key;if(!multi&&S.album.some(a=>a.k===k))return;
 S.album.unshift({k,pid:p.id,nm:p.name,b:p.breed,st:stage(p),e,txt:txt.split(p.name).join('{n}'),date:todayStr(),day:S.day});if(S.album.length>240)S.album.length=240;
 if(!multi)setTimeout(()=>toast(`📔 收進成長相簿：${txt}`),1400)}
function alTxt(a){const p=S.pets.find(x=>x.id===a.pid);return esc(a.txt.split('{n}').join(p?p.name:(a.nm||'毛孩')))}
function albumCheck(p){if(!p)return;const g=stage(p),L=lvl(p);
 if(p.alStg===undefined){p.alStg=g;p.alLv=L;return}
 if(g!==p.alStg){p.alStg=g;mom(p,'stg_'+g,g==='a'?'🎂':'👴',g==='a'?`${p.name} 長大了！`:`${p.name} 成為穩重的老${p.type==='cat'?'貓':'狗'}`)}

async function shrink(file){const img=new Image();img.src=URL.createObjectURL(file);await img.decode();const sc=Math.min(1,1100/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let h=0;for(let i=0;i<d.length;i+=997)h=(h*31+d[i])>>>0;return {blob,hash:h.toString(36)}}

function meowS(k=1,vol=.9){const a=cac();if(!a)return;const t=a.currentTime;const out=a.createGain();out.gain.value=vol;out.connect(a.destination);
 const comp=a.createDynamicsCompressor();comp.connect(out);
 const dur=.85+Math.random()*.25;const o=a.createOscillator();o.type='sawtooth';const f0=520*k;
 o.frequency.setValueAtTime(f0*.85,t);o.frequency.linearRampToValueAtTime(f0*1.45,t+dur*.3);o.frequency.linearRampToValueAtTime(f0*1.25,t+dur*.6);o.frequency.exponentialRampToValueAtTime(f0*.75,t+dur);
 const lfo=a.createOscillator();lfo.frequency.value=6.5;const lg=a.createGain();lg.gain.value=f0*.03;lfo.connect(lg);lg.connect(o.frequency);
 const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.08);g.gain.setValueAtTime(1,t+dur*.65);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 [[1,900,1900,1100,6],[.6,2600,3400,2400,8]].forEach(([amp,a1,a2,a3,q])=>{const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;bp.frequency.setValueAtTime(a1*k**.5,t);bp.frequency.linearRampToValueAtTime(a2*k**.5,t+dur*.35);bp.frequency.linearRampToValueAtTime(a3*k**.5,t+dur);const ga=a.createGain();ga.gain.value=amp*2.2;g.connect(bp);bp.connect(ga);ga.connect(comp)});
 o.connect(g);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05)}

 const ws=a.createWaveShaper();const c=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*4)}ws.curve=c;
 const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(3200*k**.4,t);lp.frequency.exponentialRampToValueAtTime(900*k**.4,t+d);
 const bp=a.createBiquadFilter();bp.type='peaking';bp.frequency.value=1100*k**.5;bp.gain.value=9;bp.Q.value=1.5;
 const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);
 const nb=a.createBuffer(1,a.sampleRate*.08,a.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);const n=a.createBufferSource();n.buffer=nb;const nf=a.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1500*k**.5;nf.Q.value=1;const ng=a.createGain();ng.gain.value=.55;
 o.connect(ws);ws.connect(lp);lp.connect(bp);bp.connect(g);g.connect(dest);n.connect(nf);nf.connect(ng);ng.connect(dest);o.start(t);o.stop(t+d+.02);n.start(t)}

 i.onchange=()=>{const f=i.files&&i.files[0];i.remove();if(!f)return;if(!/^image\//.test(f.type))return toast('請選一張照片');

   let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>22000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}
   if(!okAv(d))return toast('照片處理失敗，換一張試試');const nk=document.getElementById('nk');const keep=nk?nk.value:null;S.avatar=d;save();try{pushMe(true)}catch(x){}render();openMe();if(keep!==null){const n2=document.getElementById('nk');if(n2)n2.value=keep}toast('📷 大頭貼換好了！')};

 i.click()}
